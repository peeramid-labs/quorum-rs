[workspace]
resolver = "2"
members = ["crates/quorum-rs", "crates/llm-repair", "crates/quorum-crypto-core", "crates/quorum-cli"]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/peeramid-labs/quorum-rs"
rust-version = "1.85"
authors = ["Peeramid Labs"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
