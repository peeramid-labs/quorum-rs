[package]
name = "noolog-files"
version = "0.1.0"
# Literal, not inherited: nsed-orchestrator uses this crate by path through
# its quorum-rs submodule, and inherited fields would resolve against its root.
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/peeramid-labs/quorum-rs"
rust-version = "1.85"
authors = ["Peeramid Labs"]
description = "Uploaded files: the Blob storage seam with its NATS object-store backend, upload spooling and sniffing, and HLS segmenting"
# Publishable: quorum-rs depends on it, so it goes to crates.io with it.

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.80"
async-nats = "0.47.0"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
futures = "0.3.31"
hex = "0.4"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.40"
uuid = { version = "1.8.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.44", features = ["full"] }
