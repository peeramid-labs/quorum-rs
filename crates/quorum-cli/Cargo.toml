[package]
name = "quorum-cli"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "CLI for running multi-agent deliberation jobs against a quorum-rs orchestrator (run / status / trace / init)"
repository = "https://github.com/peeramid-labs/quorum-rs"
homepage = "https://github.com/peeramid-labs/quorum-rs"
readme = "README.md"
keywords = ["ai", "agents", "deliberation", "nats", "cli"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "quorum"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
quorum-rs = { version = "0.6.0", path = "../quorum-rs" }
dotenvy = "0.15"
inquire = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12.4", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml = "0.9.34"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5.4.0", features = ["preserve_order"] }
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
