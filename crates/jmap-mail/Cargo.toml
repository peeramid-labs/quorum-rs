[package]
name = "jmap-mail"
version = "0.1.0"
# Literal, not inherited: nsed-orchestrator uses this crate by path through
# its quorum-rs submodule, and inherited fields would resolve against its root.
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/peeramid-labs/quorum-rs"
rust-version = "1.85"
authors = ["Peeramid Labs"]
description = "JMAP for Mail (RFC 8621): Mailbox, Thread and Email data types, written from the RFC"
publish = false

[dependencies]
jmap-core = { path = "../jmap-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# An independent JMAP implementation (Stalwart, Apache-2.0 OR MIT) as the
# judge of our wire format.
jmap-client = { version = "0.4.3", default-features = false, features = ["async"] }
