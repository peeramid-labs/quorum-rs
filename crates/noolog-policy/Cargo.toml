[package]
name = "noolog-policy"
version = "0.1.0"
# Literal, not inherited: nsed-orchestrator uses this crate by path through
# its quorum-rs submodule, and inherited fields would resolve against its root.
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/peeramid-labs/quorum-rs"
rust-version = "1.85"
authors = ["Peeramid Labs"]
description = "Deliberation policies as clients write them, with their content address"
# Publishable: quorum-rs and noolog-files depend on it.

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10"
utoipa = "5.4.0"
