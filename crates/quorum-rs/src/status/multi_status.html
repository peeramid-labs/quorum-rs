<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NSED Control Plane</title>
        <style>
            :root {
                --bg: #0d1117;
                --surface: #161b22;
                --border: #30363d;
                --text: #e6edf3;
                --text-dim: #8b949e;
                --green: #3fb950;
                --red: #f85149;
                --blue: #58a6ff;
                --yellow: #d29922;
                --accent: #8957e5;
                --radius: 6px;
                --col-w: 80px;
                --header-h: 140px;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                    Arial, sans-serif;
                background: var(--bg);
                color: var(--text);
                height: 100vh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            /* Top bar */
            .topbar {
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                padding: 8px 16px;
                display: flex;
                align-items: center;
                gap: 12px;
                flex-shrink: 0;
                min-height: 40px;
            }
            .topbar h1 {
                font-size: 14px;
                font-weight: 600;
                letter-spacing: 0.5px;
            }
            .topbar .meta {
                font-size: 12px;
                color: var(--text-dim);
                margin-left: auto;
                display: flex;
                gap: 16px;
            }
            .topbar .meta span {
                display: flex;
                align-items: center;
                gap: 4px;
            }

            /* Main area: columns + optional panel */
            .main {
                display: flex;
                flex: 1;
                overflow: hidden;
                position: relative;
            }

            /* Column layout removed — board/queue views handle agents */
            .col {
                width: var(--col-w);
                min-width: var(--col-w);
                display: flex;
                flex-direction: column;
                border-right: 1px solid rgba(48, 54, 61, 0.4);
            }

            /* Column header */
            .col-header {
                height: var(--header-h);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 6px 2px 4px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                cursor: pointer;
                position: relative;
                flex-shrink: 0;
                transition:
                    background 0.6s ease,
                    border-color 0.6s ease;
            }
            .col-header:hover {
                filter: brightness(1.2);
            }
            .col-header.selected {
                border-bottom: 2px solid var(--blue);
            }

            /* Vertical agent name */
            .col-name {
                writing-mode: vertical-rl;
                transform: rotate(180deg);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.3px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-height: 70px;
                line-height: var(--col-w);
                transition: color 0.6s ease;
            }

            /* Status indicators row — removed; divergence shown via card borders + header tint */

            /* Pause button */
            .pause-btn {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 12px;
                line-height: 1;
                padding: 2px 4px;
                border-radius: 3px;
                cursor: pointer;
                margin-top: auto;
            }
            .pause-btn:hover {
                border-color: var(--text-dim);
                color: var(--text);
            }
            .pause-btn.paused {
                color: var(--yellow);
                border-color: var(--yellow);
            }
            /* Auto-approve button */
            .auto-btn {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 11px;
                font-weight: 700;
                line-height: 1;
                padding: 2px 5px;
                border-radius: 3px;
                cursor: pointer;
                margin-top: 2px;
            }
            .auto-btn:hover {
                border-color: var(--text-dim);
                color: var(--text);
            }
            .auto-btn.active {
                color: var(--green);
                border-color: var(--green);
            }
            .master-btn {
                font-size: 14px;
                padding: 4px 8px;
                margin-top: 0;
                margin-left: 8px;
            }

            /* Score indicator */
            .score-badge {
                font-size: 9px;
                font-weight: 600;
                padding: 1px 3px;
                border-radius: 2px;
                font-family: "SF Mono", monospace;
            }
            .score-badge.good {
                color: var(--green);
            }
            .score-badge.mid {
                color: var(--yellow);
            }
            .score-badge.low {
                color: var(--red);
            }

            /* Flagged agent — red glow */
            .flag-indicator {
                color: var(--red, #f85149);
                font-size: 10px;
                margin-left: 4px;
                animation: pulse 1.5s infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.4;
                }
            }

            /* ── View tab bar ── */
            .view-tabs {
                display: flex;
                gap: 0;
                margin-left: 16px;
                border: 1px solid var(--border);
                border-radius: 4px;
                overflow: hidden;
                flex-shrink: 0;
            }
            .view-tab {
                background: none;
                border: none;
                color: var(--text-dim);
                font-size: 11px;
                font-weight: 600;
                padding: 4px 12px;
                cursor: pointer;
                letter-spacing: 0.3px;
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            .view-tab:hover {
                background: rgba(255, 255, 255, 0.04);
                color: var(--text);
            }
            .view-tab.active {
                background: rgba(88, 166, 255, 0.12);
                color: var(--blue);
            }
            .view-tab + .view-tab {
                border-left: 1px solid var(--border);
            }

            /* ── Board view (agent cards grid) ── */
            .board {
                display: none;
                flex: 1;
                overflow-y: auto;
                padding: 16px;
            }
            .board.active {
                display: block;
            }

            .board-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 12px;
            }

            .agent-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 14px;
                cursor: pointer;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .agent-card:hover {
                border-color: var(--blue);
                box-shadow: 0 0 0 1px var(--blue);
            }
            .agent-card.selected {
                border-color: var(--blue);
                box-shadow: 0 0 0 1px var(--blue);
            }
            .agent-card.flagged {
                border-color: var(--red);
            }
            .agent-card.paused {
                opacity: 0.7;
            }

            .card-top {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                flex-shrink: 0;
                background: var(--text-dim);
            }
            .status-dot.working {
                background: var(--green);
                animation: pulse 1.5s infinite;
            }
            .status-dot.idle {
                background: var(--text-dim);
            }
            .status-dot.paused {
                background: var(--yellow);
            }
            .status-dot.error {
                background: var(--red);
            }

            .card-name {
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .card-flag {
                color: var(--red);
                font-size: 12px;
                animation: pulse 1.5s infinite;
            }
            .card-pause-btn {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 12px;
                line-height: 1;
                padding: 3px 6px;
                border-radius: 3px;
                cursor: pointer;
                flex-shrink: 0;
            }
            .card-pause-btn:hover {
                border-color: var(--text-dim);
                color: var(--text);
            }
            .card-pause-btn.paused {
                color: var(--yellow);
                border-color: var(--yellow);
            }

            .card-metrics {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .card-badge {
                font-size: 11px;
                font-weight: 600;
                padding: 2px 6px;
                border-radius: 3px;
                background: var(--bg);
                color: var(--text-dim);
                font-family: "SF Mono", monospace;
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .card-badge .badge-label {
                font-weight: 400;
                font-size: 10px;
                text-transform: uppercase;
                opacity: 0.7;
            }
            .card-badge.good {
                color: var(--green);
            }
            .card-badge.mid {
                color: var(--yellow);
            }
            .card-badge.low {
                color: var(--red);
            }
            .card-badge.buf-active {
                color: var(--blue);
            }

            .card-auto {
                font-size: 10px;
                color: var(--text-dim);
                display: flex;
                align-items: center;
                gap: 4px;
                margin-top: auto;
            }
            .card-auto .auto-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--border);
            }
            .card-auto .auto-dot.on {
                background: var(--green);
            }

            /* ── Queue view (unified buffer work queue) ── */
            .queue {
                display: none;
                flex: 1;
                overflow-y: auto;
                padding: 16px;
            }
            .queue.active {
                display: block;
            }

            .queue-empty {
                text-align: center;
                color: var(--text-dim);
                padding: 48px 16px;
                font-size: 14px;
            }
            .queue-empty .empty-icon {
                font-size: 32px;
                margin-bottom: 8px;
                opacity: 0.4;
            }

            .queue-entry {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 10px 14px;
                margin-bottom: 8px;
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 12px;
                transition: border-color 0.15s;
            }
            .queue-entry:hover {
                border-color: var(--text-dim);
            }

            .queue-agent {
                font-weight: 600;
                font-size: 12px;
                color: var(--text);
                min-width: 80px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .queue-action {
                font-weight: 600;
                font-size: 10px;
                padding: 2px 6px;
                border-radius: 3px;
                text-transform: uppercase;
                letter-spacing: 0.3px;
            }
            .queue-action.propose {
                background: rgba(63, 185, 80, 0.12);
                color: var(--green);
            }
            .queue-action.evaluate {
                background: rgba(88, 166, 255, 0.12);
                color: var(--blue);
            }

            .queue-round {
                color: var(--text-dim);
                font-family: "SF Mono", monospace;
                font-size: 10px;
            }
            .queue-job {
                color: var(--text-dim);
                font-family: "SF Mono", monospace;
                font-size: 10px;
            }
            .queue-timers {
                margin-left: auto;
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 10px;
                color: var(--text-dim);
                font-family: "SF Mono", monospace;
                flex-shrink: 0;
            }
            .queue-age {
                opacity: 0.7;
            }
            .queue-countdown {
                color: var(--yellow);
            }
            .queue-countdown.overdue {
                color: var(--red);
            }

            .queue-btns {
                display: flex;
                gap: 4px;
                flex-shrink: 0;
            }
            .queue-btns button {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 10px;
                padding: 3px 8px;
                border-radius: 3px;
                cursor: pointer;
            }
            .queue-btns button:hover {
                color: var(--text);
                border-color: var(--text-dim);
            }
            .queue-btns .q-stop:hover {
                color: var(--red);
                border-color: var(--red);
            }
            .queue-btns .q-view {
                color: var(--blue);
                border-color: rgba(88, 166, 255, 0.3);
            }
            .queue-btns .q-view:hover {
                border-color: var(--blue);
            }

            /* Detail panel (slide-in from right) */
            .detail-panel {
                width: 0;
                overflow: hidden;
                background: var(--surface);
                border-left: 1px solid var(--border);
                transition: width 0.25s ease;
                flex-shrink: 0;
            }
            .detail-panel.open {
                width: 360px;
            }
            .detail-inner {
                width: 360px;
                padding: 16px;
                overflow-y: auto;
                height: 100%;
            }
            .detail-inner h3 {
                font-size: 16px;
                margin-bottom: 4px;
            }
            .detail-inner .sub {
                font-size: 12px;
                color: var(--text-dim);
                margin-bottom: 16px;
            }
            .detail-inner .close-btn {
                float: right;
                background: none;
                border: none;
                color: var(--text-dim);
                font-size: 18px;
                cursor: pointer;
                padding: 0 4px;
            }
            .detail-inner .close-btn:hover {
                color: var(--text);
            }

            /* Stats row */
            .stats-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                margin-bottom: 16px;
            }
            .mini-stat {
                background: var(--bg);
                border-radius: var(--radius);
                padding: 8px;
            }
            .mini-stat .ms-label {
                font-size: 10px;
                text-transform: uppercase;
                color: var(--text-dim);
                letter-spacing: 0.3px;
            }
            .mini-stat .ms-value {
                font-size: 18px;
                font-weight: 700;
            }
            .mini-stat .ms-value.green {
                color: var(--green);
            }
            .mini-stat .ms-value.red {
                color: var(--red);
            }

            /* Slider controls */
            .ctrl-group {
                margin-bottom: 12px;
            }
            .ctrl-label {
                font-size: 11px;
                text-transform: uppercase;
                color: var(--text-dim);
                letter-spacing: 0.3px;
                margin-bottom: 4px;
                display: flex;
                justify-content: space-between;
            }
            .ctrl-label .ctrl-val {
                color: var(--text);
                font-family: "SF Mono", monospace;
            }
            .ctrl-group input[type="range"] {
                width: 100%;
                accent-color: var(--blue);
                height: 4px;
                -webkit-appearance: none;
                appearance: none;
                background: var(--border);
                border-radius: 2px;
                outline: none;
            }
            .ctrl-group input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--blue);
                cursor: pointer;
            }

            /* Persona textarea */
            .persona-edit {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 8px;
                color: var(--text);
                font-size: 13px;
                font-family: inherit;
                resize: vertical;
                min-height: 60px;
                outline: none;
            }
            .persona-edit:focus {
                border-color: var(--blue);
            }

            /* Toggle */
            .toggle-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 12px;
            }
            .toggle-row .tgl-label {
                font-size: 11px;
                text-transform: uppercase;
                color: var(--text-dim);
            }
            .toggle-switch {
                position: relative;
                width: 36px;
                height: 20px;
            }
            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }
            .toggle-switch .slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: var(--border);
                border-radius: 10px;
                transition: 0.2s;
            }
            .toggle-switch .slider:before {
                content: "";
                position: absolute;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: var(--text-dim);
                left: 2px;
                bottom: 2px;
                transition: 0.2s;
            }
            .toggle-switch input:checked + .slider {
                background: var(--green);
            }
            .toggle-switch input:checked + .slider:before {
                transform: translateX(16px);
                background: #fff;
            }

            /* Buffer entries in panel */
            .buf-list {
                margin-top: 12px;
            }
            .buf-entry {
                background: var(--bg);
                border-radius: var(--radius);
                padding: 8px;
                margin-bottom: 6px;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
            }
            .buf-entry .buf-action {
                font-weight: 600;
                min-width: 20px;
            }
            .buf-entry .buf-action.propose {
                color: var(--green);
            }
            .buf-entry .buf-action.evaluate {
                color: var(--blue);
            }
            .buf-entry .buf-job {
                color: var(--text-dim);
                font-family: "SF Mono", monospace;
                font-size: 10px;
            }
            .buf-entry .buf-age {
                color: var(--text-dim);
                margin-left: auto;
                font-size: 10px;
            }
            .buf-btns {
                display: flex;
                gap: 4px;
            }
            .buf-btns button {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 10px;
                padding: 2px 6px;
                border-radius: 3px;
                cursor: pointer;
            }
            .buf-btns button:hover {
                color: var(--text);
                border-color: var(--text-dim);
            }
            .buf-btns .reject-btn:hover {
                color: var(--red);
                border-color: var(--red);
            }

            /* Recent events in panel */
            .panel-events {
                margin-top: 12px;
                font-size: 11px;
                font-family: "SF Mono", monospace;
                max-height: 200px;
                overflow-y: auto;
            }
            .panel-events .pe {
                padding: 2px 0;
                border-bottom: 1px solid rgba(48, 54, 61, 0.3);
                display: flex;
                gap: 6px;
            }
            .panel-events .pe-time {
                color: var(--text-dim);
                min-width: 60px;
            }
            .panel-events .pe-type {
                font-weight: 600;
                min-width: 80px;
            }
            .pe-type.task_complete {
                color: var(--green);
            }
            .pe-type.agent_error {
                color: var(--red);
            }
            .pe-type.buffer_released {
                color: var(--green);
            }
            .pe-type.buffer_rejected {
                color: var(--yellow);
            }
            .pe-type.agent_paused {
                color: var(--yellow);
            }
            .pe-type.agent_resumed {
                color: var(--green);
            }
            .pe-type.config_updated {
                color: var(--blue);
            }

            .section-label {
                font-size: 11px;
                text-transform: uppercase;
                color: var(--text-dim);
                letter-spacing: 0.5px;
                margin: 16px 0 8px;
                padding-bottom: 4px;
                border-bottom: 1px solid var(--border);
            }

            /* ── Full-screen task overlay ── */
            .task-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: var(--bg);
                z-index: 9999;
                flex-direction: column;
            }
            .task-overlay.open {
                display: flex;
            }
            .task-header {
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                padding: 12px 16px;
                flex-shrink: 0;
            }
            .task-header-row {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 6px;
            }
            .task-header .task-close {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 14px;
                cursor: pointer;
                padding: 4px 10px;
                border-radius: 4px;
            }
            .task-header .task-close:hover {
                border-color: var(--text-dim);
                color: var(--text);
            }
            .task-header h2 {
                font-size: 15px;
                font-weight: 600;
                flex: 1;
            }
            .task-header .task-sub {
                font-size: 11px;
                color: var(--text-dim);
            }
            .task-progress {
                height: 6px;
                background: var(--border);
                border-radius: 3px;
                overflow: hidden;
                margin-top: 8px;
            }
            .task-progress-fill {
                height: 100%;
                background: var(--green);
                border-radius: 3px;
                transition: width 0.5s linear;
            }
            .task-progress-fill.warning {
                background: var(--yellow);
            }
            .task-progress-fill.critical {
                background: var(--red);
            }
            .task-progress-fill.paused {
                background: var(--blue);
                animation: pulse 1.5s infinite;
            }
            .task-progress-status {
                display: flex;
                justify-content: space-between;
                font-size: 10px;
                margin-top: 4px;
                color: var(--text-dim);
                font-family: "SF Mono", monospace;
            }
            .task-body {
                flex: 1;
                min-height: 0; /* allow flex child to shrink below content → enables scroll */
                overflow-y: auto;
                padding: 0 20px 20px;
                max-width: 1100px;
                margin: 0 auto;
                width: 100%;
            }
            .task-section {
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface);
                margin-top: 16px;
                overflow: hidden;
            }
            .task-section-header {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 14px;
                font-size: 12px;
                font-weight: 600;
                color: var(--text);
                border-bottom: 1px solid var(--border);
            }
            .task-section-body {
                padding: 12px 14px;
            }
            .task-section-label {
                font-size: 10px;
                text-transform: uppercase;
                color: var(--text-dim);
                letter-spacing: 0.5px;
                margin: 12px 0 6px;
                padding-bottom: 4px;
                border-bottom: 1px solid var(--border);
            }
            .task-section-label:first-child {
                margin-top: 0;
            }
            .inject-entry {
                margin: 8px 0;
                padding: 8px 10px;
                border-left: 3px solid var(--border);
                font-size: 12px;
                line-height: 1.5;
            }
            .inject-entry .inject-who {
                font-size: 10px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 3px;
            }
            .inject-entry .inject-who.operator {
                color: #d29922;
            }
            .inject-entry .inject-who.agent {
                color: #58a6ff;
            }
            .inject-entry.from-operator {
                border-left-color: rgba(210, 153, 34, 0.5);
            }
            .inject-entry.from-agent {
                border-left-color: rgba(88, 166, 255, 0.4);
            }
            .inject-entry .inject-text {
                white-space: pre-wrap;
                word-break: break-word;
                color: var(--text);
            }
            .task-body textarea {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 8px;
                color: var(--text);
                font-family: "SF Mono", "Menlo", monospace;
                font-size: 11px;
                line-height: 1.5;
                resize: vertical;
                outline: none;
            }
            .task-body textarea:focus {
                border-color: var(--blue);
            }
            /* ── Evaluation accordion items ── */
            .eval-accordion {
                border: 1px solid var(--border);
                border-radius: 6px;
                margin: 6px 0;
                overflow: hidden;
            }
            .eval-acc-head {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                background: rgba(255, 255, 255, 0.02);
                cursor: pointer;
                user-select: none;
            }
            .eval-accordion .eval-acc-arrow {
                font-size: 9px;
                color: var(--text-dim);
                transition: transform 0.15s;
            }
            .eval-acc-head.open .eval-acc-arrow {
                transform: rotate(90deg);
            }
            .eval-acc-body {
                display: none;
                border-top: 1px solid var(--border);
                padding: 10px 12px;
            }
            .eval-acc-body.open {
                display: block;
            }
            .eval-field-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin: 6px 0;
                font-size: 12px;
            }
            .eval-field-label {
                font-size: 10px;
                color: var(--text-dim);
                text-transform: uppercase;
                letter-spacing: 0.3px;
                min-width: 70px;
                flex-shrink: 0;
            }
            .eval-field-input {
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 4px 8px;
                color: var(--text);
                font-size: 12px;
                flex: 1;
                min-width: 0;
                outline: none;
            }
            .eval-field-input:focus {
                border-color: var(--blue);
            }
            .eval-field-input.score-input {
                width: 60px;
                flex: none;
                font-weight: 700;
                text-align: center;
                font-family: "SF Mono", monospace;
            }
            .eval-opinion-toggle {
                display: none;
            }
            .eval-opinion-body {
                display: block;
                margin-top: 6px;
                font-size: 12px;
                color: var(--text);
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
                padding: 8px;
                background: var(--bg);
                border-radius: 4px;
                border: 1px solid var(--border);
            }
            /* approve-check CSS removed — unified into taskApprove() button */
            .task-actions {
                background: var(--surface);
                border-top: 1px solid var(--border);
                padding: 10px 16px;
                flex-shrink: 0;
            }
            .task-inject-row {
                display: flex;
                gap: 8px;
                margin-bottom: 8px;
            }
            .task-inject-row textarea {
                flex: 1;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 8px;
                color: var(--text);
                font-size: 12px;
                font-family: inherit;
                resize: none;
                min-height: 36px;
                max-height: 80px;
                outline: none;
            }
            .task-inject-row textarea:focus {
                border-color: var(--blue);
            }
            .task-btn-row {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                align-items: center;
            }
            .task-btn {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 12px;
                padding: 6px 14px;
                border-radius: 4px;
                cursor: pointer;
            }
            .task-btn:hover {
                border-color: var(--text-dim);
                color: var(--text);
            }
            .task-btn.primary {
                border-color: var(--green);
                color: var(--green);
            }
            .task-btn.primary:hover {
                background: rgba(63, 185, 80, 0.1);
            }
            .task-btn.danger {
                border-color: var(--red);
                color: var(--red);
            }
            .task-btn.danger:hover {
                background: rgba(248, 81, 73, 0.1);
            }
            .task-btn.accent {
                border-color: var(--blue);
                color: var(--blue);
            }
            .task-btn.accent:hover {
                background: rgba(88, 166, 255, 0.1);
            }
            .task-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .task-btn-spacer {
                flex: 1;
            }

            /* ── Agent detail modal ── */
            .agent-modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 9998;
            }
            .agent-modal.open {
                display: flex;
            }
            .agent-modal-backdrop {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.6);
            }
            .agent-modal-dialog {
                position: relative;
                margin: 40px auto;
                width: calc(100% - 80px);
                max-width: 960px;
                max-height: calc(100vh - 80px);
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 10px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                z-index: 1;
            }
            .am-header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px 18px;
                border-bottom: 1px solid var(--border);
                background: var(--surface);
                flex-shrink: 0;
            }
            .am-header h2 {
                font-size: 15px;
                font-weight: 600;
                flex: 1;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .am-header .am-sub {
                font-size: 11px;
                color: var(--text-dim);
            }
            .am-close {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 14px;
                cursor: pointer;
                padding: 4px 10px;
                border-radius: 4px;
            }
            .am-close:hover {
                border-color: var(--text-dim);
                color: var(--text);
            }
            .am-tabs {
                display: flex;
                gap: 0;
                border-bottom: 1px solid var(--border);
                background: var(--surface);
                flex-shrink: 0;
            }
            .am-tab {
                padding: 8px 18px;
                font-size: 12px;
                font-weight: 500;
                color: var(--text-dim);
                cursor: pointer;
                background: none;
                border: none;
                border-bottom: 2px solid transparent;
                transition:
                    color 0.15s,
                    border-color 0.15s;
            }
            .am-tab:hover {
                color: var(--text);
            }
            .am-tab.active {
                color: var(--text);
                border-bottom-color: var(--blue);
            }
            .am-body {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 16px 20px;
            }
            /* Overview tab */
            .am-stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
                margin-bottom: 16px;
            }
            .am-stat {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 10px 12px;
                text-align: center;
            }
            .am-stat-label {
                font-size: 10px;
                text-transform: uppercase;
                color: var(--text-dim);
                letter-spacing: 0.3px;
            }
            .am-stat-value {
                font-size: 18px;
                font-weight: 700;
                margin-top: 2px;
            }
            .am-stat-value.green {
                color: var(--green);
            }
            .am-stat-value.red {
                color: var(--red);
            }
            .am-score-chart {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 12px;
                margin-bottom: 16px;
            }
            .am-score-chart canvas {
                width: 100%;
                height: 80px;
                display: block;
            }
            .am-task-log {
                margin-top: 8px;
            }
            .am-task-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 5px 0;
                border-bottom: 1px solid rgba(48, 54, 61, 0.15);
                font-size: 12px;
            }
            .am-task-time {
                font-size: 10px;
                color: var(--text-dim);
                font-family: "SF Mono", monospace;
                min-width: 55px;
            }
            .am-task-action {
                font-size: 10px;
                font-weight: 600;
                padding: 1px 6px;
                border-radius: 3px;
                text-transform: uppercase;
            }
            .am-task-action.propose {
                background: rgba(63, 185, 80, 0.12);
                color: var(--green);
            }
            .am-task-action.evaluate {
                background: rgba(88, 166, 255, 0.12);
                color: var(--blue);
            }
            .am-task-status {
                font-size: 10px;
            }
            .am-task-status.ok {
                color: var(--green);
            }
            .am-task-status.error {
                color: var(--red);
            }
            .am-task-dur {
                font-size: 10px;
                color: var(--text-dim);
                font-family: "SF Mono", monospace;
            }
            /* Chat tab */
            .am-chat {
                display: flex;
                flex-direction: column;
                height: 100%;
                min-height: 400px;
            }
            .am-chat-messages {
                flex: 1;
                overflow-y: auto;
                padding: 8px 0;
                min-height: 0;
            }
            .am-chat-msg {
                display: flex;
                gap: 10px;
                padding: 8px 0;
            }
            .am-chat-avatar {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 11px;
                font-weight: 700;
                flex-shrink: 0;
                margin-top: 2px;
            }
            .am-chat-avatar.user {
                background: rgba(210, 153, 34, 0.15);
                color: var(--yellow);
            }
            .am-chat-avatar.agent {
                background: rgba(88, 166, 255, 0.15);
                color: var(--blue);
            }
            .am-chat-body {
                flex: 1;
                min-width: 0;
            }
            .am-chat-role {
                font-size: 10px;
                font-weight: 600;
                text-transform: uppercase;
                color: var(--text-dim);
                margin-bottom: 2px;
            }
            .am-chat-text {
                font-size: 13px;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
                color: var(--text);
            }
            .am-chat-input-row {
                display: flex;
                gap: 8px;
                padding-top: 10px;
                border-top: 1px solid var(--border);
                flex-shrink: 0;
            }
            .am-chat-input {
                flex: 1;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 8px 12px;
                color: var(--text);
                font-size: 13px;
                font-family: inherit;
                resize: none;
                min-height: 38px;
                max-height: 120px;
                outline: none;
            }
            .am-chat-input:focus {
                border-color: var(--blue);
            }
            .am-chat-send {
                background: var(--blue);
                color: #fff;
                border: none;
                border-radius: 6px;
                padding: 8px 16px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                align-self: flex-end;
            }
            .am-chat-send:hover {
                opacity: 0.85;
            }
            .am-chat-send:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .am-chat-thinking {
                font-size: 11px;
                color: var(--text-dim);
                padding: 8px 0;
                animation: pulse 1.5s infinite;
            }
            /* Buffer tab */
            .am-buf-list {
            }
            .am-buf-entry {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
                border: 1px solid var(--border);
                border-radius: 6px;
                margin-bottom: 6px;
                cursor: pointer;
                transition: background 0.15s;
            }
            .am-buf-entry:hover {
                background: rgba(255, 255, 255, 0.03);
            }
            .am-buf-badge {
                font-size: 10px;
                font-weight: 600;
                padding: 2px 6px;
                border-radius: 3px;
                text-transform: uppercase;
            }
            .am-buf-badge.propose {
                background: rgba(63, 185, 80, 0.12);
                color: var(--green);
            }
            .am-buf-badge.evaluate {
                background: rgba(88, 166, 255, 0.12);
                color: var(--blue);
            }
            .am-buf-info {
                flex: 1;
                font-size: 12px;
                color: var(--text);
            }
            .am-buf-age {
                font-size: 11px;
                color: var(--text-dim);
                font-family: "SF Mono", monospace;
            }
            .am-buf-actions {
                display: flex;
                gap: 4px;
            }
            .am-buf-empty {
                padding: 24px;
                text-align: center;
                color: var(--text-dim);
                font-size: 13px;
            }
            /* Config tab */
            .am-config {
            }
            .am-config .ctrl-group {
                margin-bottom: 12px;
            }
            .am-config .ctrl-label {
                display: flex;
                justify-content: space-between;
                font-size: 11px;
                color: var(--text-dim);
                margin-bottom: 4px;
            }
            .am-config .ctrl-val {
                font-family: "SF Mono", monospace;
                color: var(--text);
            }
            .am-config input[type="range"] {
                width: 100%;
                -webkit-appearance: none;
                appearance: none;
                height: 4px;
                background: var(--border);
                border-radius: 2px;
                outline: none;
            }
            .am-config input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--blue);
                cursor: pointer;
            }
            .am-config .persona-edit {
                width: 100%;
                min-height: 80px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 8px;
                color: var(--text);
                font-size: 12px;
                line-height: 1.5;
                resize: vertical;
                outline: none;
            }
            .am-config .persona-edit:focus {
                border-color: var(--blue);
            }
            .am-config-saved {
                font-size: 11px;
                color: var(--green);
                opacity: 0;
                transition: opacity 0.3s;
                margin-left: 8px;
            }
            .am-config-saved.show {
                opacity: 1;
            }

            /* Timeline chat messages */
            .tl-round-divider {
                padding: 6px 0;
                font-size: 10px;
                text-transform: uppercase;
                color: var(--text-dim);
                letter-spacing: 0.5px;
                border-bottom: 1px solid var(--border);
                margin: 8px 0 4px;
                display: flex;
                justify-content: space-between;
            }
            .tl-msg {
                display: flex;
                gap: 10px;
                padding: 8px 0;
                border-bottom: 1px solid rgba(48, 54, 61, 0.15);
            }
            .tl-avatar {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 11px;
                font-weight: 700;
                flex-shrink: 0;
                margin-top: 2px;
            }
            .tl-avatar.propose {
                background: rgba(63, 185, 80, 0.15);
                color: var(--green);
            }
            .tl-avatar.evaluate {
                background: rgba(88, 166, 255, 0.15);
                color: var(--blue);
            }
            .tl-avatar.error {
                background: rgba(248, 81, 73, 0.15);
                color: var(--red);
            }
            .tl-avatar.inject {
                background: rgba(210, 153, 34, 0.15);
                color: var(--yellow);
            }
            .tl-avatar.system {
                background: rgba(139, 148, 158, 0.15);
                color: var(--text-dim);
            }
            .tl-body {
                flex: 1;
                min-width: 0;
            }
            .tl-head {
                display: flex;
                align-items: baseline;
                gap: 8px;
                font-size: 12px;
            }
            .tl-agent {
                font-weight: 600;
                color: var(--text);
            }
            .tl-badge {
                font-size: 10px;
                padding: 1px 5px;
                border-radius: 3px;
                font-weight: 600;
            }
            .tl-badge.propose {
                background: rgba(63, 185, 80, 0.12);
                color: var(--green);
            }
            .tl-badge.evaluate {
                background: rgba(88, 166, 255, 0.12);
                color: var(--blue);
            }
            .tl-badge.error {
                background: rgba(248, 81, 73, 0.12);
                color: var(--red);
            }
            .tl-badge.inject {
                background: rgba(210, 153, 34, 0.12);
                color: var(--yellow);
            }
            .tl-time {
                font-size: 10px;
                color: var(--text-dim);
                margin-left: auto;
            }
            .tl-score-row {
                display: flex;
                gap: 6px;
                align-items: center;
                margin-top: 4px;
                font-size: 11px;
            }
            .tl-score-bar {
                flex: 1;
                max-width: 120px;
                height: 4px;
                background: var(--border);
                border-radius: 2px;
                overflow: hidden;
            }
            .tl-score-fill {
                height: 100%;
                border-radius: 2px;
            }
            .tl-content {
                font-size: 12px;
                margin-top: 6px;
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-word;
                color: var(--text);
                max-height: 200px;
                overflow-y: auto;
            }
            .tl-content.collapsed {
                max-height: 60px;
                overflow: hidden;
                position: relative;
            }
            .tl-content.collapsed::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 30px;
                background: linear-gradient(transparent, var(--bg));
            }
            .tl-expand {
                font-size: 10px;
                color: var(--blue);
                cursor: pointer;
                margin-top: 2px;
                background: none;
                border: none;
                padding: 0;
            }
            .tl-expand:hover {
                text-decoration: underline;
            }

            /* ── Proposal card (adapted from orchestrator) ── */
            .rp-card {
                margin: 6px 0 4px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: #0d1117;
                overflow: hidden;
            }
            .rp-header {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
            }
            .rp-avatar {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
                font-weight: 700;
                flex-shrink: 0;
                color: #fff;
            }
            .rp-avatar.propose {
                background: rgba(63, 185, 80, 0.35);
            }
            .rp-avatar.evaluate {
                background: rgba(88, 166, 255, 0.35);
            }
            .rp-info {
                flex: 1;
                min-width: 0;
            }
            .rp-author {
                font-weight: 600;
                font-size: 12px;
                color: var(--accent);
            }
            .rp-score {
                color: var(--yellow);
                font-weight: 600;
                font-size: 12px;
                margin-left: 6px;
            }
            .rp-body {
                padding: 0 10px 8px;
            }
            .rp-content {
                font-size: 12px;
                color: var(--text);
                white-space: pre-wrap;
                word-break: break-word;
                line-height: 1.5;
            }
            .rp-thought {
                margin-top: 6px;
                font-size: 11px;
                color: var(--text-dim);
                border-left: 2px solid var(--border);
                padding-left: 8px;
                white-space: pre-wrap;
            }
            .rp-thought-label {
                font-size: 10px;
                color: var(--text-dim);
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.3px;
                margin-bottom: 2px;
            }

            /* ── Evaluation rows (adapted from orchestrator) ── */
            .rp-eval-toggle {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 10px;
                border-top: 1px solid var(--border);
                cursor: pointer;
                font-size: 11px;
                color: var(--text-dim);
                transition: background 0.1s;
                user-select: none;
            }
            .rp-eval-toggle:hover {
                background: #1c2128;
            }
            .rp-eval-toggle .arrow {
                transition: transform 0.2s;
                font-size: 10px;
            }
            .rp-eval-toggle.open .arrow {
                transform: rotate(90deg);
            }
            .rp-eval-details {
                display: none;
                border-top: 1px solid #21262d;
            }
            .rp-eval-details.open {
                display: block;
            }
            .rp-eval-row {
                padding: 8px 10px;
                border-bottom: 1px solid #21262d;
                font-size: 12px;
            }
            .rp-eval-row:last-child {
                border-bottom: none;
            }
            .rp-eval-header {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 4px;
            }
            .rp-eval-agent {
                font-weight: 600;
                color: var(--accent);
                flex-shrink: 0;
            }
            .rp-eval-score-val {
                color: var(--yellow);
                font-weight: 700;
                font-size: 13px;
                flex-shrink: 0;
            }
            .rp-eval-justification {
                color: var(--text-dim);
                line-height: 1.4;
                margin-top: 4px;
                font-size: 11px;
                white-space: pre-wrap;
            }

            /* Stance badges */
            .eval-stance {
                padding: 1px 6px;
                border-radius: 8px;
                font-size: 10px;
                font-weight: 600;
            }

            /* Textual feedback */

                margin-top: 4px;
                font-size: 11px;
                white-space: pre-wrap;
                border-left: 2px solid var(--border);
                padding-left: 6px;
            }
        </style>
    </head>
