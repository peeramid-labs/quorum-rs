            function sendModalPatch(name) {
                if (!agentModalState || agentModalState.name !== name) return;
                var body = document.getElementById("am-body");
                var patch = {};

                body.querySelectorAll(
                    'input[type="range"][data-field]',
                ).forEach(function (el) {
                    patch[el.dataset.field] = parseFloat(el.value);
                });

                var personaEl = document.getElementById("am-persona");
                if (personaEl) patch.persona = personaEl.value;

                var tfEl = document.getElementById("am-textual-feedback");
                if (tfEl) patch.textual_feedback = tfEl.checked;

                // Abort any in-flight config save
                if (agentModalState.configAbort) {
                    agentModalState.configAbort.abort();
                }
                var controller = new AbortController();
                agentModalState.configAbort = controller;

                fetch("/api/agents/" + encodeURIComponent(name) + "/config", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(patch),
                    signal: controller.signal,
                })
                    .then(function (response) {
                        var saved = document.getElementById("am-config-saved");
                        if (!response.ok) {
                            console.error(
                                "Modal config patch failed: HTTP " +
                                    response.status,
                            );
                            if (saved) {
                                saved.textContent = "✗ Error";
                                saved.style.color = "var(--red)";
                                saved.classList.add("show");
                                setTimeout(function () {
                                    saved.classList.remove("show");
                                    saved.textContent = "✓ Saved";
                                    saved.style.color = "";
                                }, 2000);
                            }
                            return;
                        }
                        if (saved) {
                            saved.textContent = "✓ Saved";
                            saved.style.color = "";
                            saved.classList.add("show");
                            setTimeout(function () {
                                saved.classList.remove("show");

            // ---- Rainfall animation ----

            // Compute vivid green→yellow→red color from a divergence factor t ∈ [0, 1].
            // Used for column header tinting (not card backgrounds).
            function tToColor(t) {
                t = Math.max(0, Math.min(1, t));
                // Simple threshold: green < 0.4, orange 0.4-0.7, red > 0.7
                var r, g, b;
                if (t < 0.4) {
                    r = 46;
                    g = 160;
                    b = 67; // green
                } else if (t <= 0.7) {
                    r = 210;
                    g = 153;
                    b = 34; // orange
                } else {
                    r = 218;
                    g = 54;
                    b = 51; // red
                }
                return {
                    bg: "rgba(" + r + "," + g + "," + b + ",0.35)",
                    border: "rgba(" + r + "," + g + "," + b + ",0.8)",
                    text: "rgb(" + r + "," + g + "," + b + ")",
                };
            }

            // Normalize a QV score to [-1, +1] range.
            // Handles signed scores [-1, +1] and legacy unsigned [0, 10].
            function normScore(s) {
                if (s == null) return 0;
                // Legacy 0-10 scale: normalize to 0-1
                if (s > 1.5) return s / 10.0;
                // Signed QV [-1, +1]: pass through
                return s;
            }

            // Return CSS color variable name for a signed score [-1, +1].
            function scoreColorVar(s) {
                var n = normScore(s);
                return n < 0
                    ? "var(--red)"
                    : n >= 0.7
                      ? "var(--green)"
                      : n >= 0.4
                        ? "var(--yellow)"
                      : "var(--red)";
            }

            // Return CSS class suffix for a score: "good", "mid", or "low".
            function scoreClass(s) {
                var n = normScore(s);
                return n >= 0.7 ? "good" : n >= 0.4 ? "mid" : "low";
            }

            // Return bare CSS variable name ("green", "yellow", "red") for a score.
            function scoreColorName(s) {
                var n = normScore(s);
                return n >= 0.7 ? "green" : n >= 0.4 ? "yellow" : "red";
            }

            async function loadSlaConfig() {

                    if (resp.ok) {
                        var cfg = await resp.json();
                        if (cfg.response_sla_secs != null) {
                            configuredSlaSecs = cfg.response_sla_secs;
                            responseSlaMs = cfg.response_sla_secs * 1000;
                            currentSlaSecs = cfg.response_sla_secs;
                        }
                        loaded = true;
                    }
                    // Push our configured SLA to the backend to ensure buffer
                    // hold duration matches the operator review window. The agent's
                    // initial buffer hold_duration may be short (e.g. 10s) but the
                    // HITL control plane needs the full SLA for operator review.
                    // Only do this when the GET succeeded so we don't overwrite
                    // backend config with a hardcoded fallback on fetch failure.
                    if (loaded && currentSlaSecs > 0) {
                        await fetch("/api/config", {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                response_sla_secs: currentSlaSecs,

            function showBufferEditPanel(agentName, detail) {
                var contentStr = JSON.stringify(detail.content, null, 2);
                var releaseMs = detail.release_in_ms;
                var timerClass = releaseMs > 0 ? "" : " overdue";
                var shortId = detail.id ? detail.id.slice(-8) : "";
                var shortJob = detail.job_id ? detail.job_id.slice(-8) : "";

                var html =
                    '<button class="close-btn" onclick="selectAgent(null)">&times;</button>' +
                    "<h3>" +
                    esc(
                        detail.action === "propose" ? "Proposal" : "Evaluation",
                    ) +
                    "</h3>" +
                    '<div class="sub">' +
                    esc(shortId) +
                    " | Round " +
                    detail.round +
                    " | Job " +
                    esc(shortJob) +
                    "</div>" +
                    '<div class="countdown' +
                    timerClass +
                    '" id="buf-timer" data-release-ms="' +
                    releaseMs +
                    '" style="font-family:monospace;font-size:13px;margin:8px 0;color:var(--yellow);"></div>' +
                    '<div class="section-label">Response Content</div>' +
                    '<textarea class="persona-edit" id="buf-content" style="min-height:200px;font-family:\'SF Mono\',monospace;font-size:11px;line-height:1.4;">' +
                    esc(contentStr) +
                    "</textarea>" +
                    '<div class="section-label">Operator Commentary</div>' +
                    '<textarea class="persona-edit" id="buf-comment" placeholder="Add commentary..." style="min-height:40px;"></textarea>' +
                    '<div style="display:flex;gap:8px;margin-top:12px;">' +
                    '<button class="pause-btn" style="padding:4px 10px;" onclick="saveBufferEdit(\'' +
                    escJsAttr(agentName) +
                    "','" +
                    escJsAttr(detail.id) +
                    "')\">Save Edit</button>" +
                    '<button class="pause-btn" style="padding:4px 10px;" onclick="bufferAction(\'' +
                    escJsAttr(agentName) +
                    "','" +
                    escJsAttr(detail.id) +
                    "','release')\">Release Now</button>" +
                    '<button class="pause-btn reject-btn" style="padding:4px 10px;" onclick="bufferAction(\'' +
                    escJsAttr(agentName) +
                    "','" +
                    escJsAttr(detail.id) +
                    "','stop')\">Stop</button>" +
                    "</div>";

                document.getElementById("detail-inner").innerHTML = html;
                document.getElementById("detail-panel").classList.add("open");
                selectedAgent = agentName;
                panelMode = "buffer"; // prevent refreshAll() from overwriting with agent sidebar
                startCountdownTimer();
            }

            async function saveBufferEdit(agentName, entryId) {
                var contentEl = document.getElementById("buf-content");
                var commentEl = document.getElementById("buf-comment");
                if (!contentEl) return;
                try {
                    var content = JSON.parse(contentEl.value);
                    var resp = await fetch(
                        "/api/agents/" +
                            encodeURIComponent(agentName) +
                            "/buffer/" +
                            encodeURIComponent(entryId),
                        {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                content: content,
                                operator_comment:
                                    commentEl && commentEl.value
                                        ? commentEl.value
                                        : null,
                            }),
                        },
                    );
                    if (resp.ok) {
                        refreshAll();
                    } else {
                        var err = await resp.json().catch(function () {
                            return { error: "Unknown error" };
                        });
                        alert("Save failed: " + (err.error || "Unknown error"));
                    }
                } catch (e) {
                    alert("Invalid JSON: " + e.message);
                }
            }

            var countdownTimerId = null;
            function startCountdownTimer() {
                if (countdownTimerId) cancelAnimationFrame(countdownTimerId);
                var el = document.getElementById("buf-timer");
                if (!el) return;
                var ms = parseInt(el.dataset.releaseMs);
                var deadline = Date.now() + Math.max(ms, 0);
                function tick() {
                    var el2 = document.getElementById("buf-timer");
                    if (!el2) return;
                    var remaining = deadline - Date.now();
                    if (remaining <= 0) {
                        // Invariant: buffered item → never "OVERDUE".
                        el2.textContent = "Auto-release: Releasing\u2026";
                        el2.style.color = "var(--yellow)";
                        countdownTimerId = requestAnimationFrame(tick);
                        return;
                    }
                    el2.textContent =
                        "Auto-release in: " + Math.ceil(remaining / 1000) + "s";
                    el2.style.color = "var(--text-dim)";
                    countdownTimerId = requestAnimationFrame(tick);
                }
                tick();
            }

            // ── Full-screen task overlay state ──
            var taskViewState = null; // { agentName, action, jobId, bufEntry, bufDetail, wasPaused, timerId }

            // ---- Task detail view (from rain card click) → FULL SCREEN ----
            async function showTaskDetail(
                agentName,
                action,
                jobId,
                cardId,
                skipPause,
            ) {
                var overlay = document.getElementById("task-overlay");
                overlay.innerHTML =
                    '<div class="task-header"><div class="task-header-row"><h2 style="color:var(--text-dim)">Loading ' +
                    esc(agentName) +
                    "...</h2></div></div>";
                overlay.classList.add("open");

                // Auto-pause agent BEFORE fetching buffer data — prevents
                // auto-approve from draining the entry while we're loading.
                // Fetch authoritative pause state from the server (not the
                // 2-second-stale agentDataCache) so we don't accidentally
                // unpause an agent that another operator just paused.
                var wasPaused = false;
                if (!skipPause) {
                    try {
                        var pauseSnap = await fetchStatus(agentName);
                        wasPaused = (pauseSnap && pauseSnap.is_paused) || false;
                    } catch (e) {
                        wasPaused =
                            (agentDataCache[agentName] || {}).is_paused ||
                            false;
                    }
                }
                var didPause = false;
                if (!wasPaused && !skipPause) {
                    try {
                        var pauseResp = await fetch(
                            "/api/agents/" +
                                encodeURIComponent(agentName) +
                                "/pause",
                            {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ paused: true }),
                            },
                        );
                        didPause = pauseResp.ok;
                    } catch (e) {
                        didPause = false;
                    }
                }

                // Fetch all data in parallel (agent is now paused, buffer is stable)
                var [status, config, buffer] = await Promise.all([
                    fetchStatus(agentName),
                    fetchConfig(agentName),
                    fetchBuffer(agentName),
                ]);

                var shortJob = jobId ? jobId.slice(-8) : "";
                var actionLabel =
                    action === "evaluate" ? "Evaluation" : "Proposal";
                var actionColor = action === "evaluate" ? "blue" : "green";
                var actionCls = action === "evaluate" ? "evaluate" : "propose";

                // Find matching buffered entry — prefer exact ID match (from queue view)
                var bufEntry = null;
                if (buffer && buffer.length > 0) {
                    if (cardId) {
                        for (var b = 0; b < buffer.length; b++) {
                            if (buffer[b].id === cardId) {
                                bufEntry = buffer[b];
                                break;
                            }
                        }
                    }
                    if (!bufEntry) {
                        for (var b = 0; b < buffer.length; b++) {
                            if (
                                buffer[b].job_id === jobId &&
                                buffer[b].action === action
                            ) {
                                bufEntry = buffer[b];
                                break;
                            }
                        }
                    }
                    if (!bufEntry) {
                        for (var b = 0; b < buffer.length; b++) {
                            if (buffer[b].job_id === jobId) {
                                bufEntry = buffer[b];
                                break;
                            }
                        }
                    }
                }

                // Find task content from recent_tasks (LIFO: index 0 = most recent)
                var taskContent = null;
                var taskAction = action;
                var taskEntry = null;
                if (status && status.recent_tasks) {
                    for (var ti = 0; ti < status.recent_tasks.length; ti++) {
                        var rt = status.recent_tasks[ti];
                        if (
                            rt.job_id === jobId &&
                            rt.action === action &&
                            rt.content_preview
                        ) {
                            taskContent = rt.content_preview;
                            taskAction = rt.action;
                            taskEntry = rt;
                            break;
                        }
                    }
                }

                // Determine if agent is currently working on this job
                var isCurrentlyGenerating =
                    status &&
                    status.current_job === jobId &&
                    !bufEntry &&
                    !taskContent;

                // Check if the buffer was auto-released (no buffer entry but task content exists).
                // Without rain cards, we simply detect auto-release by absence of bufEntry.
                var cardWasPrepared = !bufEntry && taskContent ? true : false;

                // Fetch buffer detail
                var bufDetail = null;
                if (bufEntry) {
                    try {
                        var r = await fetch(
                            "/api/agents/" +
                                encodeURIComponent(agentName) +
                                "/buffer/" +
                                encodeURIComponent(bufEntry.id),
                        );
                        if (r.ok) bufDetail = await r.json();
                    } catch (e) {}
                }

                // Compute releaseAtMs — the absolute wall-clock time when auto-release fires.
                var releaseAtMs = null;
                if (
                    taskViewState &&
                    taskViewState.cardId === cardId &&
                    taskViewState.releaseAtMs
                ) {
                    releaseAtMs = taskViewState.releaseAtMs;
                } else if (bufEntry) {
                    var serverRemaining = bufEntry.release_in_ms || 0;
                    releaseAtMs = Date.now() + Math.max(serverRemaining, 0);
                }

                taskViewState = {
                    agentName: agentName,
                    action: action,
                    jobId: jobId,
                    bufEntry: bufEntry,
                    bufDetail: bufDetail,
                    wasPaused: skipPause ? true : wasPaused || !didPause,
                    timerId: null,
                    cardId: cardId,
                    releaseAtMs: releaseAtMs,
                    skipPause: !!skipPause,
                };

                // ── Status banner — determine correct state ──
                // Priority: 1) buffered (in buffer) → Ready for Review
                //           2) generating (current_job matches, no content yet) → Generating
                //           3) has content but card was prepared (buffer auto-released) → Ready for Review (released)
                //           4) has content, already submitted → Completed
                //           5) no content, not generating → Generating (fallback)
                var statusBanner;
                if (bufEntry && bufEntry.stopped) {
                    statusBanner =
                        '<div id="tv-status-banner" style="background:rgba(248,81,73,0.1);border:1px solid rgba(248,81,73,0.3);border-radius:8px;padding:10px 14px">' +
                        '<span style="color:#f85149;font-weight:700">\uD83D\uDED1 Stopped</span>' +
                        '<span style="color:var(--text-dim);font-size:11px;margin-left:8px">Will not auto-release. Undo or re-generate.</span>' +
                        "</div>";
                } else if (bufEntry) {
                    var releaseMs = bufEntry.release_in_ms || 0;
                    var releaseSecs = Math.max(0, Math.ceil(releaseMs / 1000));
                    statusBanner =
                        '<div id="tv-status-banner" style="background:rgba(210,153,34,0.12);border:1px solid rgba(210,153,34,0.4);border-radius:8px;padding:10px 14px">' +
                        '<div style="display:flex;align-items:center;gap:10px">' +
                        '<div style="flex:1">' +
                        '<div style="font-size:13px;font-weight:700;color:var(--yellow)">Ready for Review</div>' +
                        '<div style="font-size:11px;color:var(--text-dim);margin-top:2px">' +
                        esc(actionLabel) +
                        " · Round " +
                        (bufEntry.round || "?") +
                        "</div>" +
                        "</div>" +
                        '<div style="text-align:right">' +
                        '<div id="tv-countdown" style="font-size:20px;font-weight:700;font-family:\'SF Mono\',monospace;color:var(--yellow)" data-release-ms="' +
                        releaseMs +
                        '">' +
                        releaseSecs +
                        "s</div>" +
                        '<div style="font-size:9px;color:var(--text-dim)">auto-release</div>' +
                        "</div>" +
                        "</div>" +
                        '<div style="margin-top:8px;height:4px;background:rgba(210,153,34,0.15);border-radius:2px;overflow:hidden">' +
                        '<div id="tv-progress-bar" style="height:100%;background:var(--yellow);border-radius:2px;width:100%;transition:width 1s linear"></div>' +
                        "</div>" +
                        "</div>";
                } else if (isCurrentlyGenerating) {
                    statusBanner =
                        '<div style="background:rgba(136,106,255,0.10);border:1px dashed rgba(136,106,255,0.35);border-radius:8px;padding:10px 14px">' +
                        '<div style="display:flex;align-items:center;gap:10px">' +
                        '<div style="flex:1">' +
                        '<div style="font-size:13px;font-weight:700;color:rgb(136,106,255)">Generating…</div>' +
                        '<div style="font-size:11px;color:var(--text-dim);margin-top:2px">' +
                        esc(actionLabel) +
                        "</div>" +
                        "</div>" +
                        '<div style="text-align:right">' +
                        '<div id="tv-gen-timer" style="font-size:20px;font-weight:700;font-family:\'SF Mono\',monospace;color:rgb(136,106,255)">0s</div>' +
                        '<div style="font-size:9px;color:var(--text-dim)">elapsed</div>' +
                        "</div>" +
                        "</div></div>";
                } else if (taskContent && cardWasPrepared) {
                    // Buffer auto-released but card is still in "prepared" state
                    // (rain card is still visible on screen).  Show content as
                    // reviewable — the operator can click Approve to acknowledge
                    // and dismiss the card.
                    statusBanner =
                        '<div id="tv-status-banner" style="background:rgba(210,153,34,0.08);border:1px solid rgba(210,153,34,0.25);border-radius:8px;padding:10px 14px">' +
                        '<div style="display:flex;align-items:center;gap:10px">' +
                        '<div style="flex:1">' +
                        '<div style="font-size:13px;font-weight:700;color:var(--yellow)">Auto-Submitted</div>' +
                        '<div style="font-size:11px;color:var(--text-dim);margin-top:2px">' +
                        esc(actionLabel) +
                        " · Round " +
                        (taskEntry ? taskEntry.round || "?" : "?") +
                        " · Click Approve to acknowledge</div>" +
                        "</div>" +
                        "</div></div>";
                } else if (taskContent) {
                    var completedAgo = "";
                    var durationStr = "";
                    if (taskEntry) {
                        if (taskEntry.duration_ms)
                            durationStr =
                                (taskEntry.duration_ms / 1000).toFixed(1) + "s";
                        if (taskEntry.timestamp) {
                            try {
                                var tDiff =
                                    Date.now() -
                                    new Date(taskEntry.timestamp).getTime();
                                if (tDiff > 0 && tDiff < 86400000) {
                                    var aSec = Math.floor(tDiff / 1000);
                                    completedAgo =
                                        aSec >= 60
                                            ? Math.floor(aSec / 60) + "m ago"
                                            : aSec + "s ago";
                                }
                            } catch (e) {}
                        }
                    }
                    var timingParts = [completedAgo, durationStr]
                        .filter(Boolean)
                        .join(" · ");
                    statusBanner =
                        '<div style="background:rgba(210,153,34,0.08);border:1px solid rgba(210,153,34,0.3);border-radius:8px;padding:10px 14px">' +
                        '<div style="display:flex;align-items:center;gap:10px">' +
                        '<div style="flex:1">' +
                        '<div style="font-size:13px;font-weight:700;color:var(--yellow)">Pending Review</div>' +
                        '<div style="font-size:11px;color:var(--text-dim);margin-top:2px">' +
                        esc(actionLabel) +
                        " · Round " +
                        (taskEntry ? taskEntry.round || "?" : "?") +
                        "</div>" +
                        "</div>" +
                        (timingParts
                            ? "<div style=\"font-family:'SF Mono',monospace;font-size:11px;color:var(--text-dim)\">" +
                              esc(timingParts) +
                              "</div>"
                            : "") +
                        "</div></div>";
                } else {
                    statusBanner =
                        '<div style="background:rgba(136,106,255,0.10);border:1px dashed rgba(136,106,255,0.35);border-radius:8px;padding:10px 14px">' +
                        '<div style="display:flex;align-items:center;gap:10px">' +
                        '<div style="flex:1">' +
                        '<div style="font-size:13px;font-weight:700;color:rgb(136,106,255)">Generating…</div>' +
                        '<div style="font-size:11px;color:var(--text-dim);margin-top:2px">' +
                        esc(actionLabel) +
                        "</div>" +
                        "</div>" +
                        '<div style="text-align:right">' +
                        '<div id="tv-gen-timer" style="font-size:20px;font-weight:700;font-family:\'SF Mono\',monospace;color:rgb(136,106,255)">0s</div>' +
                        '<div style="font-size:9px;color:var(--text-dim)">elapsed</div>' +
                        "</div>" +
                        "</div></div>";
                }

                // Task IDs line for inspection/debugging
                var taskIdParts = [];
                if (jobId) taskIdParts.push("job:" + jobId);
                if (bufEntry && bufEntry.id)
                    taskIdParts.push("buf:" + bufEntry.id);
                if (cardId && (!bufEntry || bufEntry.id !== cardId))
                    taskIdParts.push("card:" + cardId);
                var taskIdLine =
                    taskIdParts.length > 0
                        ? '<div class="task-ids" title="Click to copy" onclick="navigator.clipboard.writeText(this.textContent)" style="font-family:\'SF Mono\',monospace;font-size:10px;color:var(--text-dim);margin-top:4px;cursor:pointer;word-break:break-all;opacity:0.7">' +
                          esc(taskIdParts.join(" · ")) +
                          "</div>"
                        : "";

                var headerHtml =
                    '<div class="task-header">' +
                    '<div class="task-header-row">' +
                    '<button class="task-close" onclick="closeTaskView()">✕</button>' +
                    '<h2 style="color:var(--' +
                    actionColor +
                    ')">' +
                    esc(agentName) +
                    "</h2>" +
                    '<div class="task-sub">' +
                    esc(status ? status.model_name || "" : "") +
                    "</div>" +
                    taskIdLine +
                    "</div>" +
                    statusBanner +
                    "</div>";

                // ── Build vertical stack body ──
                var bodyHtml = "";
                var isEvalAction =
                    action === "evaluate" || action === "evaluation";

                // ═══════════════════════════════════════════════
                // SECTION 0: Proposals Under Review (evaluation tasks)
                // Shows anonymized candidate proposals from the content_preview's
                // "props" field — populated by extract_content_preview() in the SDK.
                // ═══════════════════════════════════════════════
                if (isEvalAction) {
                    // Extract proposals from content_preview (props field) or bufDetail
                    var proposalMap = null;
                    try {
                        if (taskContent) {
                            var parsed =
                                typeof taskContent === "string"
                                    ? JSON.parse(taskContent)
                                    : taskContent;
                            if (parsed && parsed.props)
                                proposalMap = parsed.props;
                        }
                    } catch (e) {}
                    if (proposalMap && Object.keys(proposalMap).length > 0) {
                        bodyHtml += '<div class="task-section">';
                        bodyHtml +=
                            '<div class="task-section-header" style="cursor:pointer" onclick="toggleProposalsSection()">📄 Proposals Under Review <span style="font-size:10px;color:var(--text-dim);margin-left:6px">(anonymized)</span></div>';
                        bodyHtml +=
                            '<div class="task-section-body" id="tv-proposals-content">';
                        Object.keys(proposalMap)
                            .sort()
                            .forEach(function (candidateId) {
                                var proposalText = proposalMap[candidateId];
                                bodyHtml +=
                                    '<div style="margin-bottom:8px;border:1px solid var(--border);border-radius:6px;overflow:hidden">';
                                bodyHtml +=
                                    '<div style="background:rgba(63,185,80,0.06);padding:6px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)">';
                                bodyHtml +=
                                    '<span style="font-size:12px">📝</span>';
                                bodyHtml +=
                                    '<span style="font-size:11px;font-weight:700;color:var(--green)">' +
                                    esc(candidateId) +
                                    "</span>";
                                bodyHtml += "</div>";
                                bodyHtml +=
                                    '<div style="padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto">' +
                                    esc(proposalText) +
                                    "</div>";
                                bodyHtml += "</div>";
                            });
                        bodyHtml += "</div></div>";
                    }
                }

                // ═══════════════════════════════════════════════
                // SECTION 1: Current Generated Content
                // ═══════════════════════════════════════════════
                bodyHtml +=
                    '<div class="task-section" id="tv-response-section">';
                var editBtnStyle =
                    "background:none;border:1px solid var(--border);color:var(--text-dim);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;margin-left:auto";

                // Helper: render content preview (proposal or evaluation)
                function renderContentSection(
                    content,
                    agentName,
                    action,
                    editable,
                ) {
                    var h = "";
                    var isEval =
                        action === "evaluate" || action === "evaluation";
                    if (isEval) {
                        h += '<div id="tv-preview-wrap">';
                        try {
                            var parsed =
                                typeof content === "string"
                                    ? JSON.parse(content)
                                    : null;
                            if (parsed && parsed.t === "e" && parsed.evals) {
                                h += buildEvalAccordionFromPreview(
                                    parsed.evals,
                                    agentName,
                                    editable,
                                );
                            } else {
                                h += renderContentCard(
                                    typeof content === "string"
                                        ? content
                                        : JSON.stringify(content),
                                    agentName,
                                    action,
                                );
                            }
                        } catch (e) {
                            h += renderContentCard(
                                typeof content === "string"
                                    ? content
                                    : JSON.stringify(content),
                                agentName,
                                action,
                            );
                        }
                        h += "</div>";
                    } else {
                        h += '<div id="tv-preview-wrap">';
                        h += renderContentCard(
                            typeof content === "string"
                                ? content
                                : JSON.stringify(content),
                            agentName,
                            action,
                        );
                        h += "</div>";
                    }
                    return h;
                }

                if (bufDetail) {
                    var contentStr = JSON.stringify(bufDetail.content, null, 2);
                    var isEval =
                        (bufDetail.action || action) === "evaluate" ||
                        (bufDetail.action || action) === "evaluation";

                    bodyHtml +=
                        '<div class="task-section-header" id="tv-response-header">' +
                        (isEval ? "⚖️" : "📝") +
                        " " +
                        esc(actionLabel) +
                        " Response" +
                        (isEval
                            ? "" // Structured eval form is inline-editable — no toggle needed
                            : '<button onclick="toggleEditMode()" id="tv-edit-toggle" style="' +
                              editBtnStyle +
                              '">Edit JSON</button>') +
                        "</div>";

                    bodyHtml += '<div class="task-section-body">';

                    if (isEval) {
                        bodyHtml += '<div id="tv-preview-wrap">';
                        bodyHtml += buildEvalAccordion(
                            bufDetail.content,
                            agentName,
                            true,
                        );
                        bodyHtml +=
                            '<div style="text-align:right;margin-top:4px">' +
                            '<a href="#" onclick="toggleEditMode();return false" style="font-size:10px;color:var(--text-dim)">Show raw JSON</a>' +
                            "</div>";
                        bodyHtml += "</div>";
                    } else {
                        bodyHtml += '<div id="tv-preview-wrap">';
                        var previewStr = null;
                        try {
                            var bc = bufDetail.content;
                            if (bc.content != null) {
                                previewStr = JSON.stringify({
                                    t: "p",
                                    c: bc.content || "",
                                    tp: bc.thought_process || "",
                                });
                            }
                        } catch (e) {}
                        if (previewStr) {
                            bodyHtml += renderContentCard(
                                previewStr,
                                agentName,
                                "propose",
                            );
                        } else {
                            bodyHtml +=
                                '<div style="color:var(--text-dim);font-size:12px;padding:8px 0">No preview available</div>';
                        }
                        bodyHtml += "</div>";
                    }

                    bodyHtml += '<div id="tv-raw-wrap" style="display:none">';
                    bodyHtml +=
                        '<textarea id="tv-content" style="min-height:280px">' +
                        esc(contentStr) +
                        "</textarea>";
                    bodyHtml +=
                        '<button onclick="toggleEditMode()" style="background:none;border:1px solid var(--border);color:var(--text-dim);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;margin-top:8px">Preview</button>';
                    bodyHtml += "</div>";
                    bodyHtml += '<div id="tv-inject-entries"></div>';
                    bodyHtml += "</div>";

                    // Stop/Edit footer (or stopped mode if already stopped)
                    bodyHtml +=
                        '<div id="tv-action-footer" style="padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px">';
                    if (bufEntry && bufEntry.stopped) {
                        bodyHtml +=

                            '<button class="task-btn" onclick="taskSaveEdit()" style="margin-left:auto">Save Edit</button>';

                    bodyHtml +=

                        '<div style="font-size:32px;margin-bottom:12px;animation:pulse 1.5s infinite;opacity:0.6">⏳</div>';
                    bodyHtml +=
                        '<div style="font-size:12px;color:var(--text-dim)">Waiting for agent response…</div>';
                    bodyHtml += "</div>";

                    // Has content — pending review (may have been auto-released from buffer)

                        action === "evaluate" || action === "evaluation";
                    bodyHtml +=
                        '<div class="task-section-header" id="tv-response-header">' +
                        (isEval ? "⚖️" : "📝") +
                        " " +
                        esc(actionLabel) +
                        " Response" +
                        '<button onclick="toggleEditMode()" id="tv-edit-toggle" style="' +
                        editBtnStyle +
                        '">Edit</button>' +
                        "</div>";
                    bodyHtml += '<div class="task-section-body">';
                    bodyHtml += renderContentSection(
                        taskContent,
                        agentName,
                        action,
                        false,
                    );

                    bodyHtml += '<div id="tv-raw-wrap" style="display:none">';
                    bodyHtml +=
                        '<textarea id="tv-content" style="min-height:280px">' +
                        esc(taskContent) +
                        "</textarea>";
                    bodyHtml +=
                        '<button onclick="toggleEditMode()" style="background:none;border:1px solid var(--border);color:var(--text-dim);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;margin-top:8px">Preview</button>';
                    bodyHtml += "</div>";
                    bodyHtml += "</div>";

                    // No separate footer here — Section 3 (Operator Actions) handles approve/regen
                } else {
                    // Fallback: no content yet, generating
                    bodyHtml +=
                        '<div class="task-section-header">⏳ Generating…</div>';
                    bodyHtml +=
                        '<div class="task-section-body" style="text-align:center;padding:32px">';
                    bodyHtml +=
                        '<div style="font-size:32px;margin-bottom:12px;animation:pulse 1.5s infinite;opacity:0.6">⏳</div>';
                    bodyHtml +=
                        '<div style="font-size:12px;color:var(--text-dim)">Waiting for agent response…</div>';
                    bodyHtml += "</div>";
                }
                bodyHtml += "</div>"; // task-section

                // ═══════════════════════════════════════════════
                // SECTION 2: Approve / Re-generate
                // ═══════════════════════════════════════════════
                bodyHtml += '<div class="task-section">';
                bodyHtml +=
                    '<div class="task-section-header">💬 Operator Actions</div>';
                bodyHtml += '<div class="task-section-body">';
                // Approve: enabled when buffer entry exists (not stopped) OR auto-released (acknowledge).
                // Re-generate: only when a live buffer entry exists (not stopped) — requires bufEntry for the re-submit.
                var enableApprove =
                    (bufEntry && !bufEntry.stopped) || cardWasPrepared;
                var enableRegen = bufEntry && !bufEntry.stopped;
                var approveDisabled = enableApprove ? "" : " disabled";
                var regenDisabled = enableRegen ? "" : " disabled";
                bodyHtml +=
                    '<div style="display:flex;gap:8px;margin-bottom:10px">' +
                    '<textarea id="tv-inject" placeholder="Optional: add operator note before approving, or type a prompt for Re-generate" style="flex:1;min-height:36px;max-height:100px;resize:vertical"' +
                    approveDisabled +
                    "></textarea>" +
                    "</div>";
                bodyHtml += '<div style="display:flex;gap:8px">';
                bodyHtml +=
                    '<button class="task-btn" style="background:var(--green);color:#fff" onclick="taskApprove()"' +
                    approveDisabled +
                    ">✓ Approve</button>";
                bodyHtml +=
                    '<button class="task-btn accent" onclick="taskRegenerate()"' +
                    regenDisabled +
                    ">Re-generate</button>";
                bodyHtml += "</div>";
                bodyHtml += "</div></div>";

                // ═══════════════════════════════════════════════
                // SECTION 4: Score History (compact, always visible)
                // ═══════════════════════════════════════════════
                bodyHtml += '<div class="task-section">';
                bodyHtml += '<div class="task-section-header">📊 Scores</div>';
                bodyHtml += '<div class="task-section-body">';
                if (
                    status &&
                    status.recent_scores &&
                    status.recent_scores.length > 0
                ) {
                    var scores = status.recent_scores.slice(-20);
                    bodyHtml +=
                        '<div style="display:flex;gap:2px;align-items:flex-end;height:40px;background:var(--bg);border-radius:var(--radius);padding:4px 6px">';
                    scores.forEach(function (s) {
                        var pct = Math.max(
                            2,
                            Math.min(100, normScore(s.score) * 100),
                        );
                        var barColor = scoreColorVar(s.score);
                        bodyHtml +=
                            '<div title="' +
                            s.score.toFixed(2) +
                            " by " +
                            esc(s.evaluator) +
                            '" ' +
                            'style="flex:1;min-width:3px;height:' +

                            "%;background:" +

                    bodyHtml +=
                        '<div style="color:var(--text-dim);font-size:11px;padding:4px 0">No scores yet</div>';
                }
                bodyHtml += "</div></div>";

                // ═══════════════════════════════════════════════
                // SECTION 5: Deliberation History (collapsible, scroll internally)
                // ═══════════════════════════════════════════════
                var timelineHtml = buildTimeline(
                    status,
                    agentName,
                    jobId,
                    action,
                    bufDetail,
                );
                bodyHtml += '<div class="task-section">';
                bodyHtml +=
                    '<div class="task-section-header" style="cursor:pointer" onclick="toggleHistorySection()">' +
                    '<span class="eval-acc-arrow" id="tv-history-arrow">▶</span>' +
                    "📜 Deliberation History" +
                    "</div>";
                bodyHtml +=
                    '<div id="tv-history-body" style="display:none">' +
                    timelineHtml +
                    "</div>";
                bodyHtml += "</div>";

                // Assemble — single scrollable column, no sidebar
                overlay.innerHTML =
                    headerHtml +
                    '<div class="task-body" id="tv-timeline">' +
                    bodyHtml +
                    "</div>";

                // Start countdown timer for buffered entries.
                // Uses the precomputed releaseAtMs (synced to the rainfall card
                // position) so re-opening the modal never resets the timer.
                // Invariant: while the item is in the buffer, the timer NEVER
                // shows "OVERDUE" — the SLA math guarantees feasibility.
                if (bufEntry && taskViewState.releaseAtMs) {
                    var cdEl = document.getElementById("tv-countdown");
                    if (cdEl) {
                        var deadline = taskViewState.releaseAtMs;
                        // Total duration: from buffer creation to deadline (for progress bar %)
                        var totalMs =
                            parseInt(cdEl.dataset.releaseMs, 10) ||
                            deadline - Date.now();
                        if (totalMs <= 0) totalMs = 1; // avoid division by zero
                        function tickCountdown() {
                            var el = document.getElementById("tv-countdown");
                            var bar =
                                document.getElementById("tv-progress-bar");
                            if (!el) return;
                            var remaining = deadline - Date.now();
                            if (remaining <= 0) {
                                // Invariant: buffered item → never OVERDUE.
                                // Show "Releasing…" and keep ticking in case the
                                // card is still visible in the rainfall.
                                el.textContent = "Releasing\u2026";
                                el.style.color = "var(--yellow)";
                                if (bar) {
                                    bar.style.width = "0%";
                                }
                                taskViewState.timerId =
                                    requestAnimationFrame(tickCountdown);
                                return;
                            }
                            var secs = Math.ceil(remaining / 1000);
                            var mins = Math.floor(secs / 60);
                            el.textContent =
                                mins > 0
                                    ? mins + "m " + (secs % 60) + "s"
                                    : secs + "s";
                            if (bar && totalMs > 0) {
                                bar.style.width =
                                    Math.round((remaining / totalMs) * 100) +
                                    "%";
                            }
                            taskViewState.timerId =
                                requestAnimationFrame(tickCountdown);
                        }
                        tickCountdown();
                    }
                }

                // Start elapsed timer for generating state
                if (!bufEntry && !taskContent) {
                    var genTimerEl = document.getElementById("tv-gen-timer");
                    if (genTimerEl) {
                        var genStart = Date.now();
                        function tickGenTimer() {
                            var el = document.getElementById("tv-gen-timer");
                            if (!el) return;
                            var elapsed = Math.floor(
                                (Date.now() - genStart) / 1000,
                            );
                            var mins = Math.floor(elapsed / 60);
                            el.textContent =
                                mins > 0
                                    ? mins + "m " + (elapsed % 60) + "s"
                                    : elapsed + "s";
                            taskViewState.timerId =
                                requestAnimationFrame(tickGenTimer);
                        }
                        tickGenTimer();
                    }
                }

                // Remove any prior listener to prevent duplicates on re-render
                document.removeEventListener("keydown", taskEscHandler);
                document.addEventListener("keydown", taskEscHandler);
            }

                    if (arrow) arrow.textContent = "▼";

            // ── Build evaluation accordion for buffered content ──
            function buildEvalAccordion(bufContent, agentName, editable) {
                var html = "";
                var evalPairs = [];
                try {
                    if (Array.isArray(bufContent)) {
                        bufContent.forEach(function (pair) {
                            if (Array.isArray(pair) && pair.length >= 2) {
                                evalPairs.push({
                                    target: pair[0],
                                    eval: pair[1],
                                });
                            }
                        });
                    } else if (bufContent.evaluations) {
                        bufContent.evaluations.forEach(function (ev) {
                            var tgt =
                                ev.target_agent_id ||
                                ev.proposer_agent_id ||
                                "?";
                            evalPairs.push({
                                target: tgt,
                                eval: ev.evaluation || ev,
                            });
                        });
                    }
                } catch (e) {}
                if (evalPairs.length === 0)
                    return '<div style="color:var(--text-dim);font-size:12px">No evaluations found</div>';

                evalPairs.forEach(function (pair, idx) {
                    var ev = pair.eval;
                    var score =
                        ev.score != null
                            ? ev.score
                            : ev.personal_score != null
                              ? ev.personal_score
                              : null;
                    var scoreColor =
                        score != null
                            ? scoreColorVar(score)
                            : "var(--text-dim)";
                    var scoreStr = score != null ? score.toFixed(1) : "?";
                    var stance = ev.stance || "";

                    html +=
                        '<div class="eval-accordion" data-eval-idx="' +
                        idx +
                        '">';

                    // Accordion head: target name + score
                    html +=
                        '<div class="eval-acc-head' +
                        (editable ? " open" : "") +
                        '" role="button" tabindex="0" aria-expanded="' +
                        (editable ? "true" : "false") +
                        '" onclick="toggleEvalAccordion(this)" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleEvalAccordion(this)}">';
                    html += '<span class="eval-acc-arrow">▶</span>';
                    html +=
                        '<span style="font-weight:600;font-size:12px;color:var(--accent)">' +
                        esc(pair.target) +
                        "</span>";
                    if (stance) {
                        var stCls = safeEnumClass(
                            "stance-",
                            stance,
                            VALID_STANCES,
                            "neutral",
                        );
                        html +=
                            '<span class="eval-stance ' +
                            stCls +
                            '">' +
                            esc(stance) +
                            "</span>";
                    }
                    html +=
                        '<span style="margin-left:auto;font-weight:700;font-size:13px;color:' +
                        scoreColor +
                        ";font-family:'SF Mono',monospace\">" +
                        scoreStr +
                        "</span>";
                    html += "</div>";

                    // Accordion body
                    html +=
                        '<div class="eval-acc-body' +
                        (editable ? " open" : "") +
                        '">';

                    if (editable) {
                        // Editable score
                        html += '<div class="eval-field-row">';
                        html += '<span class="eval-field-label">Score</span>';
                        html +=
                            '<input class="eval-field-input score-input" type="number" min="-1" max="1" step="0.01" value="' +
                            (score != null ? normScore(score).toFixed(2) : "") +
                            '" data-field="score" data-idx="' +
                            idx +
                            '" onchange="evalFieldChanged(this)">';
                        html +=
                            '<span style="font-size:10px;color:var(--text-dim)">QV [−1, +1]</span>';
                        html += "</div>";

                        // Editable stance
                        html += '<div class="eval-field-row">';
                        html += '<span class="eval-field-label">Stance</span>';
                        html +=
                            '<select class="eval-field-input" data-field="stance" data-idx="' +
                            idx +
                            '" onchange="evalFieldChanged(this)">';
                        [
                            "",
                            "strong_agree",
                            "agree",
                            "neutral",
                            "disagree",
                            "strong_disagree",
                        ].forEach(function (s) {
                            html +=
                                '<option value="' +
                                s +
                                '"' +
                                (stance.toLowerCase().replace(/\s+/g, "_") === s
                                    ? " selected"
                                    : "") +
                                ">" +
                                (s ? s.replace(/_/g, " ") : "—") +
                                "</option>";
                        });
                        html += "</select>";
                        html += "</div>";

                        // Editable justification
                        html +=
                            '<div class="eval-field-row" style="align-items:flex-start">';
                        html +=
                            '<span class="eval-field-label" style="margin-top:6px">Feedback</span>';
                        html +=
                            '<textarea class="eval-field-input" rows="3" data-field="textual_feedback" data-idx="' +
                            idx +
                            '" onchange="evalFieldChanged(this)">' +
                            esc(
                                (
                                    ev.textual_feedback ||
                                    ev.justification ||
                                    ""
                                ).replace(/^[\s.…·]+/, ""),
                            ) +
                            "</textarea>";
                        html += "</div>";

                        // Category scores (if present)
                        var cats = ev.category_scores;
                        if (cats) {
                            var catNames = [
                                "correctness",
                                "completeness",
                                "novelty",
                                "feasibility",
                                "evidence_quality",
                            ];
                            var catLabels = [
                                "Correct",
                                "Complete",
                                "Novel",
                                "Feasible",
                                "Evidence",
                            ];
                            catNames.forEach(function (cn, ci) {
                                if (cats[cn] != null) {
                                    html += '<div class="eval-field-row">';
                                    html +=
                                        '<span class="eval-field-label">' +
                                        catLabels[ci] +
                                        "</span>";
                                    html +=
                                        '<input class="eval-field-input score-input" type="number" min="-100" max="100" step="1" value="' +
                                        cats[cn] +
                                        '" data-field="cat_' +
                                        cn +
                                        '" data-idx="' +
                                        idx +
                                        '" onchange="evalFieldChanged(this)">';
                                    html +=
                                        '<span style="font-size:10px;color:var(--text-dim)">[−100, +100]</span>';
                                    html += "</div>";
                                }
                            });
                        }
                    } else {
                        // Read-only structured view
                        html += renderEvalStructuredBody({
                            s: score,
                            j: ev.justification || "",
                            tf: ev.textual_feedback || "",
                            cats: ev.category_scores || null,
                            claims: ev.claim_assessments || null,
                            disputes: ev.disagreements || null,
                        });
                    }

                    // Opinion text already rendered by renderEvalStructuredBody above

                    html += "</div>"; // acc-body
                    html += "</div>"; // accordion
                });
                return html;
            }

            // ── Handle eval field edits → update hidden JSON textarea ──
            function evalFieldChanged(input) {
                if (!taskViewState || !taskViewState.bufDetail) return;
                var idx = parseInt(input.dataset.idx, 10);
                var field = input.dataset.field;
                var val = input.value;

                try {
                    var content = taskViewState.bufDetail.content;
                    var target;
                    if (Array.isArray(content) && content[idx]) {
                        target = content[idx][1];
                    } else if (
                        content.evaluations &&
                        content.evaluations[idx]
                    ) {
                        target =
                            content.evaluations[idx].evaluation ||
                            content.evaluations[idx];
                    }
                    if (!target) return;

                    if (field === "score") {
                        var raw = parseFloat(val) || 0;
                        // Clamp to [-1, +1]; convert legacy >1 values
                        target.score =
                            raw > 1.5
                                ? Math.min(raw / 10.0, 1.0)
                                : Math.max(-1, Math.min(raw, 1.0));
                        target.personal_score = target.score;
                    } else if (field === "stance") {
                        target.stance = val;
                    } else if (field === "textual_feedback") {
                        target.textual_feedback = val;
                    } else if (field.startsWith("cat_")) {
                        var catName = field.substring(4);
                        if (!target.category_scores)
                            target.category_scores = {};
                        target.category_scores[catName] = parseFloat(val) || 0;
                    }

                    // Update the hidden raw JSON textarea
                    var ta = document.getElementById("tv-content");
                    if (ta) ta.value = JSON.stringify(content, null, 2);

                    // Update score display in accordion header
                    var accordion = input.closest(".eval-accordion");
                    if (accordion && field === "score") {
                        var scoreEl = accordion.querySelector(
                            ".eval-acc-head span:last-child",
                        );
                        if (scoreEl) {
                            var s = parseFloat(val) || 0;
                            scoreEl.textContent = s.toFixed(1);
                            scoreEl.style.color = scoreColorVar(s);
                        }
                    }
                } catch (e) {
                    console.error("evalFieldChanged:", e);
                }
            }

            // ── Single unified Approve button — saves content + operator_comment, then releases ──
            async function taskApprove() {
                if (!taskViewState) return;

                // Buffer was already auto-released but card is still visible.
                // The response was already submitted to NATS — just retire
                // the rain card and close the panel.
                if (!taskViewState.bufEntry) {
                    retireCards(taskViewState.agentName, taskViewState.jobId);
                    appendTimelineMsg(
                        "propose",
                        "System",
                        "approved",
                        "Acknowledged — response was auto-submitted",
                    );
                    setTimeout(closeTaskView, 400);
                    return;
                }

                if (taskViewState.bufEntry.stopped) {
                    appendTimelineMsg(
                        "error",
                        "System",
                        "error",
                        "Cannot approve a stopped entry — unstop or re-generate first.",
                    );
                    return;
                }
                var agentUrl =
                    "/api/agents/" +
                    encodeURIComponent(taskViewState.agentName);
                var entryUrl =
                    agentUrl +
                    "/buffer/" +
                    encodeURIComponent(taskViewState.bufEntry.id);

                // 1. Build the content to save — prefer structured form state (kept
                //    in sync by evalFieldChanged), then raw textarea, then buffer
                var content = null;
                var previewEl = document.getElementById("tv-preview-wrap");
                var isStructuredVisible =
                    previewEl && previewEl.style.display !== "none";
                if (isStructuredVisible && taskViewState.bufDetail) {
                    content = taskViewState.bufDetail.content;
                }
                if (!content) {
                    var contentEl = document.getElementById("tv-content");
                    if (contentEl) {
                        try {
                            content = JSON.parse(contentEl.value);
                        } catch (e) {
                            appendTimelineMsg(
                                "error",
                                "System",
                                "error",
                                "Cannot approve: raw JSON is invalid — " +
                                    e.message,
                            );
                            return;
                        }
                    }
                }
                if (!content) {
                    // Last resort: use the original buffer entry content (not edited)
                    try {
                        content =
                            typeof taskViewState.bufEntry.content === "string"
                                ? JSON.parse(taskViewState.bufEntry.content)
                                : taskViewState.bufEntry.content;
                    } catch (e) {
                        appendTimelineMsg(
                            "error",
                            "System",
                            "error",
                            "Cannot approve: buffer content is unparsable — " +
                                e.message,
                        );
                        return;
                    }
                }

                // 2. Extract operator note (if any)
                var noteEl = document.getElementById("tv-inject");
                var note = noteEl ? noteEl.value.trim() : "";

                // 3. Save content + operator_comment as separate top-level fields
                //    (matches BufferEditRequest { content, operator_comment })
                var saveBody = { content: content };
                if (note) saveBody.operator_comment = note;

                var saveResp;
                try {
                    saveResp = await fetch(entryUrl, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(saveBody),
                    });
                } catch (e) {
                    appendTimelineMsg(
                        "error",
                        "System",
                        "error",
                        "Save failed before release: " + e.message,
                    );
                    return;
                }
                if (!saveResp.ok) {
                    appendTimelineMsg(
                        "error",
                        "System",
                        "error",
                        "Save failed before release: HTTP " + saveResp.status,
                    );
                    return;
                }

                // 4. Release the response
                var releaseResp = await fetch(entryUrl + "/release", {
                    method: "POST",
                });
                if (!releaseResp.ok) {
                    appendTimelineMsg(
                        "error",
                        "System",
                        "error",
                        "Release failed: HTTP " + releaseResp.status,
                    );
                    return;
                }

                // 5. Remove rain card from rainfall view
                retireCards(taskViewState.agentName, taskViewState.jobId);

                var msg = note
                    ? "Approved with note: " + note
                    : "Response approved and released";
                appendTimelineMsg("propose", "System", "approved", msg);
                setTimeout(closeTaskView, 400);
            }

            async function closeTaskView() {
                document.removeEventListener("keydown", taskEscHandler);
                var overlay = document.getElementById("task-overlay");
                overlay.classList.remove("open");
                overlay.innerHTML = "";

                // Restore pause state if we auto-paused
                if (taskViewState && !taskViewState.wasPaused) {
                    try {
                        await fetch(
                            "/api/agents/" +
                                encodeURIComponent(taskViewState.agentName) +
                                "/pause",
                            {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ paused: false }),

                        );
                    } catch (e) {

                    }
                }
                if (taskViewState && taskViewState.timerId) {
                    cancelAnimationFrame(taskViewState.timerId);

            // Render structured evaluation body: category scores, claims, disputes, justification
            function renderEvalStructuredBody(e) {
                var h = "";
                var hasCats = e.cats;
                var hasClaims = e.claims && e.claims.length > 0;
                var hasDisputes = e.disputes && e.disputes.length > 0;
                var justText = (e.j || "").replace(/^[\s.…·]+/, "").trim();
                var feedbackText = (e.tf || "").replace(/^[\s.…·]+/, "").trim();
                var hasJust = justText.length > 0;
                var hasFeedback = feedbackText.length > 0;
                var hasStructured = hasCats || hasClaims || hasDisputes;

                // Category scores: compact horizontal pills
                if (hasCats) {
                    var cn = [
                        "correctness",
                        "completeness",
                        "novelty",
                        "feasibility",
                        "evidence_quality",
                    ];
                    var cl = [
                        "Correct",
                        "Complete",
                        "Novel",
                        "Feasible",
                        "Evidence",
                    ];
                    h += '<div class="eval-cat-row">';
                    for (var ci = 0; ci < cn.length; ci++) {
                        var cv = e.cats[cn[ci]];
                        if (cv != null) {
                            var cc =
                                cv >= 70
                                    ? "var(--green)"
                                    : cv >= 40
                                      ? "var(--yellow)"
                                      : "var(--red)";
                            h +=
                                '<div class="eval-cat-pill"><span class="eval-cat-label">' +
                                cl[ci] +
                                '</span><span class="eval-cat-val" style="color:' +
                                cc +
                                '">' +
                                cv.toFixed(0) +
                                "</span></div>";
                        }
                    }
                    h += "</div>";
                }

                // Claim assessments
                if (hasClaims) {
                    h += '<div class="eval-claim-list">';
                    e.claims.forEach(function (ca) {
                        var v = (ca.verdict || "unverified").toLowerCase();
                        var vCls = safeEnumClass(
                            "verdict-",
                            v,
                            VALID_VERDICTS,
                            "unverified",
                        );
                        h += '<div class="eval-claim-item">';
                        h +=
                            '<span class="eval-verdict ' +
                            vCls +
                            '">' +
                            esc(v) +
                            "</span>";
                        h +=
                            '<span class="eval-claim-text">' +
                            esc(ca.claim || ca.content || "?");
                        if (ca.reason)
                            h +=
                                ' <em style="color:var(--text-dim);font-size:10px">\u2014 ' +
                                esc(ca.reason) +
                                "</em>";
                        h += "</span></div>";
                    });
                    h += "</div>";
                }

                // Disagreements
                if (hasDisputes) {
                    e.disputes.forEach(function (d) {
                        h += '<div class="eval-dispute-item">';
                        h +=
                            '<div class="eval-dispute-claim">\u2716 ' +
                            esc(
                                d.proposal_claims ||
                                    d.contested_claim ||
                                    d.claim ||
                                    "?",
                            ) +
                            "</div>";
                        h +=
                            '<div class="eval-dispute-position">\u21B3 ' +
                            esc(
                                d.evaluator_position ||
                                    d.belief ||
                                    d.details ||
                                    "",
                            ) +
                            "</div>";
                        if (d.confidence)
                            h +=
                                '<div class="eval-dispute-confidence">' +
                                esc(d.confidence) +
                                "</div>";
                        h += "</div>";
                    });
                }

                // Textual feedback
                if (hasFeedback) {
                    h +=
                        '<div class="rp-eval-feedback">' +
                        esc(feedbackText) +
                        "</div>";
                }

                // Justification — show dimmed if structured data exists, full if not
                if (hasJust && !hasStructured && !hasFeedback) {
                    h +=
                        '<div class="rp-eval-justification">' +
                        esc(justText) +
                        "</div>";
                } else if (hasJust && (hasStructured || hasFeedback)) {
                    h +=
                        '<div class="rp-eval-justification" style="opacity:0.6;margin-top:4px">' +
                        esc(justText) +
                        "</div>";
                }
                return h;
            }

                    html +=
