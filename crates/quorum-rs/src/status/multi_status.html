            function buildTimeline(
                status,
                agentName,
                jobId,
                action,
                bufDetail,
            ) {
                var html = "";
                if (!status)
                    return '<div style="color:var(--text-dim);padding:20px">No status data available.</div>';

                // Planned Response is shown in the main task view above — no need to duplicate in history.

                // Collect all timeline entries
                var entries = [];

                // Deduplicate: task entries supersede task_complete events
                var taskKeys = {};

                // From recent_tasks
                (status.recent_tasks || []).forEach(function (task) {
                    if (task.job_id === jobId || !jobId) {
                        taskKeys[
                            task.job_id + ":" + task.action + ":" + task.round
                        ] = true;
                        entries.push({
                            type: "task",
                            timestamp: task.timestamp,
                            action: task.action,
                            round: task.round,
                            status: task.status,
                            duration_ms: task.duration_ms,
                            job_id: task.job_id,
                            content_preview: task.content_preview || null,
                        });
                    }
                });

                // From recent_scores
                (status.recent_scores || []).forEach(function (s) {
                    if (s.job_id === jobId || !jobId) {
                        entries.push({
                            type: "score",
                            timestamp: s.timestamp,
                            evaluator: s.evaluator,
                            score: s.score,
                            round: s.round,
                            job_id: s.job_id,
                        });
                    }
                });

                // From event_log — only include significant events, skip noise.
                // task_complete, agent_working, buffer_released are all
                // represented by task entries already. Only show errors, pause/resume,
                // config changes, and job acceptance events.
                var events = (status.event_log || []).filter(function (e) {
                    if (e.event_type === "heartbeat") return false;
                    if (e.event_type === "task_complete") return false;
                    if (e.event_type === "agent_working") return false;
                    if (e.event_type === "buffer_released") return false;
                    return true;
                });
                var jobEvents = events.filter(function (e) {
                    return e.job_id === jobId;
                });
                var displayEvents =
                    jobEvents.length > 0 ? jobEvents : events.slice(-10);

                displayEvents.forEach(function (ev) {
                    entries.push({
                        type: "event",
                        timestamp: ev.timestamp,
                        event_type: ev.event_type,
                        detail: ev.detail || "",
                        job_id: ev.job_id,
                        round: ev.round != null ? ev.round : null,
                    });
                });

                // ── Group entries by round (descending), then by timestamp within round ──
                var roundMap = {};
                entries.forEach(function (entry) {
                    var r = entry.round != null ? entry.round : -1;
                    if (!roundMap[r]) roundMap[r] = [];
                    roundMap[r].push(entry);
                });
                // Sort round keys descending (newest round first)
                var roundKeys = Object.keys(roundMap)
                    .map(Number)
                    .sort(function (a, b) {
                        return b - a;
                    });

                // Render by round group
                roundKeys.forEach(function (rk) {
                    var roundEntries = roundMap[rk];
                    // Sort entries within round by timestamp descending (newest first)
                    roundEntries.sort(function (a, b) {
                        return a.timestamp > b.timestamp
                            ? -1
                            : a.timestamp < b.timestamp
                              ? 1
                              : 0;
                    });

                    if (rk >= 0) {
                        html +=
                            '<div class="tl-round-divider"><span>Round ' +
                            rk +
                            "</span></div>";
                    } else {
                        html +=
                            '<div class="tl-round-divider"><span>System Events</span></div>';
                    }

                    roundEntries.forEach(function (entry) {
                        if (entry.type === "task") {
                            var isPropose = entry.action === "propose";
                            var avatarCls = isPropose ? "propose" : "evaluate";
                            var glyph = isPropose ? "📝" : "⚖️";
                            var badgeCls = isPropose ? "propose" : "evaluate";
                            var statusColor =
                                entry.status === "ok" ? "green" : "red";

                            html +=
                                '<div class="tl-msg">' +
                                '<div class="tl-avatar ' +
                                avatarCls +
                                '">' +
                                glyph +
                                "</div>" +
                                '<div class="tl-body">' +
                                '<div class="tl-head">' +
                                '<span class="tl-agent">' +
                                esc(agentName) +
                                "</span>" +
                                '<span class="tl-badge ' +
                                badgeCls +
                                '">' +
                                esc(entry.action) +
                                "</span>" +
                                '<span style="color:var(--' +
                                statusColor +
                                ');font-size:10px">' +
                                esc(entry.status) +
                                "</span>" +
                                '<span class="tl-time">' +
                                entry.duration_ms +
                                "ms · " +
                                esc(fmtTime(entry.timestamp)) +
                                "</span>" +
                                "</div>";
                            // Show rich content card if available
                            if (entry.content_preview) {
                                html += renderContentCard(
                                    entry.content_preview,
                                    agentName,
                                    entry.action,
                                );
                            }
                            html += "</div></div>";
                        } else if (entry.type === "score") {
                            var scoreColor = scoreColorName(entry.score);
                            var pct = Math.max(
                                2,
                                Math.min(100, normScore(entry.score) * 100),
                            );

                            html +=
                                '<div class="tl-msg">' +
                                '<div class="tl-avatar evaluate">⚖️</div>' +
                                '<div class="tl-body">' +
                                '<div class="tl-head">' +
                                '<span class="tl-agent">' +
                                esc(entry.evaluator) +
                                "</span>" +
                                '<span class="tl-badge evaluate">scored</span>' +
                                '<span class="tl-time">' +
                                esc(fmtTime(entry.timestamp)) +
                                "</span>" +
                                "</div>" +
                                '<div class="tl-score-row">' +
                                '<span style="font-weight:700;color:var(--' +
                                scoreColor +
                                ')">' +
                                entry.score.toFixed(1) +
                                "</span>" +
                                '<div class="tl-score-bar"><div class="tl-score-fill" style="width:' +
                                pct +
                                "%;background:var(--" +
                                scoreColor +
                                ')"></div></div>' +
                                "</div>" +
                                "</div></div>";
                        } else if (entry.type === "event") {
                            var evType = entry.event_type;
                            var avatarCls2 = "system";
                            var glyph2 = "•";
                            if (
                                evType === "task_complete" ||
                                evType === "buffer_released"
                            ) {
                                avatarCls2 = "propose";
                                glyph2 = "✓";
                            } else if (evType === "agent_error") {
                                avatarCls2 = "error";
                                glyph2 = "⚠";
                            } else if (
                                evType === "agent_paused" ||
                                evType === "agent_resumed"
                            ) {
                                avatarCls2 = "inject";
                                glyph2 = "⏸";
                            } else if (evType === "config_updated") {
                                avatarCls2 = "evaluate";
                                glyph2 = "⚙";
                            }

                            html +=
                                '<div class="tl-msg">' +
                                '<div class="tl-avatar ' +
                                avatarCls2 +
                                '">' +
                                glyph2 +
                                "</div>" +
                                '<div class="tl-body">' +
                                '<div class="tl-head">' +
                                '<span class="tl-agent">' +
                                esc(evType.replace(/_/g, " ")) +
                                "</span>" +
                                '<span class="tl-time">' +
                                esc(fmtTime(entry.timestamp)) +
                                "</span>" +
                                "</div>" +
                                (entry.detail
                                    ? '<div class="tl-content" style="color:var(--text-dim);font-size:11px">' +
                                      esc(entry.detail) +
                                      "</div>"
                                    : "") +
                                "</div></div>";
                        }
                    });
                });

                if (entries.length === 0 && !bufDetail) {
                    html =
                        '<div style="color:var(--text-dim);padding:20px;text-align:center">No deliberation history available for this job.</div>';
                }

                return html;
            }

            function toggleBufPreview() {
                var el = document.getElementById("tv-buf-preview");
                if (!el) return;
                el.classList.toggle("collapsed");
                var btn = el.nextElementSibling;
                if (btn)
                    btn.textContent = el.classList.contains("collapsed")
                        ? "Show more ▾"
                        : "Show less ▴";
            }

            // Toggle between rendered preview and raw JSON editor
            function toggleEditMode() {
                var preview = document.getElementById("tv-preview-wrap");
                var raw = document.getElementById("tv-raw-wrap");
                if (!preview || !raw) return;
                if (preview.style.display === "none") {
                    // Switching FROM raw → preview: sync textarea edits into
                    // the in-memory bufDetail so save/approve reads current data.
                    var ta = document.getElementById("tv-content");
                    if (ta && taskViewState && taskViewState.bufDetail) {
                        try {
                            taskViewState.bufDetail.content = JSON.parse(
                                ta.value,
                            );
                        } catch (e) {
                            // Parse failed — keep raw editor visible so user can fix
                            alert(
                                "Invalid JSON — fix before switching to preview: " +
                                    e.message,
                            );
                            return;
                        }
                    }
                    preview.style.display = "";
                    raw.style.display = "none";
                } else {
                    // Switching FROM preview → raw: sync in-memory state into
                    // the textarea so raw editor shows current structured edits.
                    var ta = document.getElementById("tv-content");
                    if (ta && taskViewState && taskViewState.bufDetail) {
                        ta.value = JSON.stringify(
                            taskViewState.bufDetail.content,
                            null,
                            2,
                        );
                    }
                    preview.style.display = "none";
                    raw.style.display = "";
                    if (ta) ta.focus();
                }
            }

            // ── Task actions ──
            async function taskSaveEdit() {
                if (!taskViewState || !taskViewState.bufEntry) return;

                // For evaluations with the structured form visible, read from
                // the in-memory object (kept in sync by evalFieldChanged).
                // For raw JSON mode or proposals, read from the textarea.
                var content = null;
                var previewEl = document.getElementById("tv-preview-wrap");
                var isStructuredVisible =
                    previewEl && previewEl.style.display !== "none";
                if (isStructuredVisible && taskViewState.bufDetail) {
                    content = taskViewState.bufDetail.content;
                } else {
                    var contentEl = document.getElementById("tv-content");
                    if (!contentEl) return;
                    try {
                        content = JSON.parse(contentEl.value);
                    } catch (e) {
                        alert("Invalid JSON: " + e.message);
                        return;
                    }
                }

                try {
                    var noteEl = document.getElementById("tv-inject");
                    var resp = await fetch(
                        "/api/agents/" +
                            encodeURIComponent(taskViewState.agentName) +
                            "/buffer/" +
                            encodeURIComponent(taskViewState.bufEntry.id),
                        {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                content: content,
                                operator_comment:
                                    noteEl && noteEl.value.trim()
                                        ? noteEl.value.trim()
                                        : null,
                            }),
                        },
                    );
                    if (resp.ok) {
                        appendTimelineMsg(
                            "inject",
                            "Operator",
                            "edit",
                            "Content edited" +
                                (noteEl && noteEl.value.trim()
                                    ? ": " + noteEl.value.trim()
                                    : ""),
                        );
                        if (noteEl) noteEl.value = "";
                        transitionToApproveOnlyMode();
                    } else {
                        var err = await resp.json().catch(function () {
                            return { error: "Unknown" };
                        });
                        alert("Save failed: " + (err.error || "Unknown"));
                    }
                } catch (e) {
                    alert("Save failed: " + e.message);
                }
            }

            async function taskRelease() {
                if (!taskViewState || !taskViewState.bufEntry) return;
                var resp = await fetch(
                    "/api/agents/" +
                        encodeURIComponent(taskViewState.agentName) +
                        "/buffer/" +
                        encodeURIComponent(taskViewState.bufEntry.id) +
                        "/release",
                    { method: "POST" },

                if (!resp.ok) {
                    appendTimelineMsg(
                        "error",
                        "System",
                        "error",
                        "Release failed: HTTP " + resp.status,
                    );
                    return;
                }
                retireCards(taskViewState.agentName, taskViewState.jobId);
                appendTimelineMsg(
                    "propose",
                    "System",
                    "approved",
                    "Response approved and released",
                );
                setTimeout(closeTaskView, 600);
            }

                var resp = await fetch(

                        encodeURIComponent(taskViewState.agentName) +
                        "/buffer/" +
                        encodeURIComponent(taskViewState.bufEntry.id) +
                        "/reject",

                    "System",

            // ── Stop (reversible reject) — entry stays in buffer, won't auto-release ──
            async function taskStop() {
                if (!taskViewState || !taskViewState.bufEntry) return;
                var agentName = taskViewState.agentName;
                var bufId = taskViewState.bufEntry.id;
                var jobId = taskViewState.jobId;
                var resp = await fetch(
                    "/api/agents/" +
                        encodeURIComponent(agentName) +
                        "/buffer/" +
                        encodeURIComponent(bufId) +
                        "/stop",
                    { method: "POST" },
                );
                if (!resp.ok) {
                    appendTimelineMsg(
                        "error",
                        "System",
                        "error",
                        "Stop failed: HTTP " + resp.status,
                    );
                    return;
                }
                taskViewState.bufEntry.stopped = true;
                markRainCardStopped(agentName, jobId);
                appendTimelineMsg(
                    "error",
                    "Operator",
                    "stopped",
                    "Response stopped \u2014 will not send",
                );
                transitionToStoppedMode();
            }

            // ── Un-stop — re-enable entry for release ──
            async function taskUnstop() {
                if (!taskViewState || !taskViewState.bufEntry) return;
                var agentName = taskViewState.agentName;
                var bufId = taskViewState.bufEntry.id;
                var jobId = taskViewState.jobId;
                var resp = await fetch(
                    "/api/agents/" +
                        encodeURIComponent(agentName) +
                        "/buffer/" +
                        encodeURIComponent(bufId) +
                        "/unstop",
                    { method: "POST" },
                );
                if (!resp.ok) {
                    appendTimelineMsg(
                        "error",
                        "System",
                        "error",
                        "Unstop failed: HTTP " + resp.status,
                    );
                    return;
                }
                taskViewState.bufEntry.stopped = false;
                unmarkRainCardStopped(agentName, jobId);
                appendTimelineMsg(
                    "inject",
                    "Operator",
                    "resumed",
                    "Stop removed \u2014 response eligible for release",

                restoreNormalMode();

            // taskInjectEdit removed — edits are saved via taskSaveEdit() + PUT to buffer,
            // and approval is handled by taskApprove() which sends operator_comment alongside content.

            // taskInject removed — merged into taskApprove() which handles
            // optional operator notes as annotations before releasing.

            // Append an operator↔agent exchange below the planned response
            function appendInjectEntry(operatorMsg, agentName, agentReply) {
                var container = document.getElementById("tv-inject-entries");
                if (!container) return;

                var html =
                    '<div class="inject-entry from-operator">' +
                    '<div class="inject-who operator">Operator</div>' +

                    "</div>" +

                container.insertAdjacentHTML("beforeend", html);

            async function taskRegenerate() {
                var el = document.getElementById("tv-inject");
                if (!taskViewState) return;
                var instructions = el ? el.value.trim() : "";
                var actionType =
                    taskViewState.action === "evaluate"
                        ? "evaluation"
                        : "proposal";

                // Build a structured prompt with operator authority context
                var regenMsg;
                if (instructions) {
                    regenMsg =
                        "[OPERATOR INSTRUCTION \u2014 This message is from a human operator with authority to direct agent behavior]\n\n" +
                        "RE-GENERATE: The operator has reviewed your previous " +
                        actionType +
                        " and requests a revision.\n\n" +
                        "Operator feedback:\n" +
                        instructions +
                        "\n\n" +
                        "Please generate a new " +
                        actionType +
                        " incorporating the operator's feedback. " +
                        "Respond in the same format as your previous " +
                        actionType +
                        ".";
                } else {
                    regenMsg =
                        "[OPERATOR INSTRUCTION \u2014 This message is from a human operator with authority to direct agent behavior]\n\n" +
                        "RE-GENERATE: The operator has reviewed your previous " +
                        actionType +
                        " and requests that you try again.\n\n" +
                        "Please generate a new, improved " +
                        actionType +
                        ". Consider:\n" +
                        "- Strengthening your reasoning and evidence\n" +
                        "- Addressing any potential weaknesses\n" +
                        "- Being more thorough and precise\n\n" +
                        "Respond in the same format as your previous " +
                        actionType +
                        ".";
                }

                if (el) el.disabled = true;
                appendTimelineMsg(
                    "inject",
                    "Operator",
                    "regen",
                    "Re-generation requested: " +
                        (instructions || "Requesting improved " + actionType),
                );

                // If buffered, stop current (not reject) then send regeneration instruction
                if (taskViewState.bufEntry) {
                    var stopResp = await fetch(
                        "/api/agents/" +
                            encodeURIComponent(taskViewState.agentName) +
                            "/buffer/" +
                            encodeURIComponent(taskViewState.bufEntry.id) +
                            "/stop",
                        { method: "POST" },
                    );
                    if (!stopResp.ok) {
                        appendTimelineMsg(
                            "error",
                            "System",
                            "error",
                            "Failed to stop entry for regen: HTTP " +
                                stopResp.status,
                        );
                        if (el) el.disabled = false;
                        return;
                    }
                    // Transition rain card back to thinking state
                    transitionCardToThinking(
                        taskViewState.agentName,
                        taskViewState.jobId,
                    );
                }

                // ── Switch content section to "thinking" state ──
                var contentSection = document.getElementById(
                    "tv-response-section",
                );
                if (contentSection) {
                    // Save old content header text
                    var hdr = document.getElementById("tv-response-header");
                    if (hdr)
                        hdr.innerHTML =
                            "⏳ Re-generating " + esc(actionType) + "…";
                    var body =
                        contentSection.querySelector(".task-section-body");
                    if (body) {
                        body.innerHTML =
                            '<div style="text-align:center;padding:32px">' +
                            '<div style="font-size:32px;margin-bottom:12px;animation:pulse 1.5s infinite;opacity:0.6">⏳</div>' +
                            '<div id="tv-regen-timer" style="font-size:18px;font-weight:700;font-family:\'SF Mono\',monospace;color:rgb(136,106,255);margin-bottom:8px">0s</div>' +
                            '<div style="font-size:12px;color:var(--text-dim)">' +
                            (instructions
                                ? "Re-generating with operator feedback…"
                                : "Re-generating with improved quality…") +
                            "</div></div>";
                    }
                    // Remove any leftover footer during regen
                    var footer = document.getElementById("tv-action-footer");
                    if (footer) footer.remove();
                }
                // Start elapsed timer
                var regenStart = Date.now();
                function tickRegenTimer() {
                    var tel = document.getElementById("tv-regen-timer");
                    if (!tel) return;
                    var elapsed = Math.floor((Date.now() - regenStart) / 1000);
                    var mins = Math.floor(elapsed / 60);
                    tel.textContent =
                        mins > 0
                            ? mins + "m " + (elapsed % 60) + "s"
                            : elapsed + "s";
                    taskViewState._regenTimerId =
                        requestAnimationFrame(tickRegenTimer);
                }
                tickRegenTimer();

                try {
                    var resp = await fetch(
                        "/api/agents/" +
                            encodeURIComponent(taskViewState.agentName) +
                            "/chat",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                messages: [{ role: "user", content: regenMsg }],
                            }),
                        },
                    );
                    // Stop timer
                    if (taskViewState && taskViewState._regenTimerId)
                        cancelAnimationFrame(taskViewState._regenTimerId);

                    if (resp.ok) {
                        var data = await resp.json();
                        if (el) el.value = "";
                        appendTimelineMsg(
                            "propose",
                            taskViewState.agentName,
                            "regenerated",
                            "New response received",
                        );

                        // Replace buffer entry content with regenerated response.
                        // The entry keeps its original NATS reply_subject so the
                        // orchestrator receives it when approved.
                        if (taskViewState.bufEntry) {
                            var regenContent = data.response || "";
                            // Preserve the original content structure — replace the main field
                            var newContent;
                            try {
                                var oldContent = taskViewState.bufEntry.content;
                                if (
                                    taskViewState.action === "evaluate" ||
                                    taskViewState.action === "evaluation"
                                ) {
                                    // Evaluation: agent should return structured JSON
                                    newContent = JSON.parse(regenContent);
                                } else {
                                    // Proposal: replace content field, keep structure
                                    newContent =
                                        typeof oldContent === "object" &&
                                        oldContent !== null
                                            ? Object.assign({}, oldContent, {
                                                  content: regenContent,
                                              })
                                            : { content: regenContent };
                                }
                            } catch (e) {
                                if (
                                    taskViewState.action === "evaluate" ||
                                    taskViewState.action === "evaluation"
                                ) {
                                    // Evaluation must be valid JSON — abort rather than
                                    // writing an invalid payload into the buffer
                                    appendTimelineMsg(
                                        "error",
                                        "System",
                                        "error",
                                        "Regenerated evaluation is not valid JSON — buffer not updated. Raw: " +
                                            regenContent.substring(0, 200),
                                    );
                                    newContent = null;
                                } else {
                                    // Proposal fallback: wrap raw text
                                    newContent = { content: regenContent };
                                }
                            }
                            if (newContent) {
                                var putResp = await fetch(
                                    "/api/agents/" +
                                        encodeURIComponent(
                                            taskViewState.agentName,
                                        ) +
                                        "/buffer/" +
                                        encodeURIComponent(
                                            taskViewState.bufEntry.id,
                                        ),
                                    {
                                        method: "PUT",
                                        headers: {
                                            "Content-Type": "application/json",
                                        },
                                        body: JSON.stringify({
                                            content: newContent,
                                            operator_comment:
                                                "Regenerated by operator",
                                        }),
                                    },
                                );
                                if (!putResp.ok) {
                                    appendTimelineMsg(
                                        "error",
                                        "System",
                                        "error",
                                        "Failed to update buffer with regen content: HTTP " +
                                            putResp.status,
                                    );
                                } else {
                                    // Unstop so it's ready for approval (only if PUT succeeded)
                                    var unstopResp = await fetch(
                                        "/api/agents/" +
                                            encodeURIComponent(
                                                taskViewState.agentName,
                                            ) +
                                            "/buffer/" +
                                            encodeURIComponent(
                                                taskViewState.bufEntry.id,
                                            ) +
                                            "/unstop",
                                        { method: "POST" },
                                    );
                                    if (!unstopResp.ok) {
                                        appendTimelineMsg(
                                            "error",
                                            "System",
                                            "error",
                                            "Failed to unstop entry after regen: HTTP " +
                                                unstopResp.status,
                                        );
                                    }
                                }
                            }
                        }
                        // Reload task detail to show fresh content
                        showTaskDetail(
                            taskViewState.agentName,
                            taskViewState.action,
                            taskViewState.jobId,
                            taskViewState.cardId,
                            taskViewState.skipPause,
                        );
                    } else {
                        var errData = null;
                        try {
                            errData = await resp.json();
                        } catch (e) {}
                        var errMsg =
                            errData && errData.error
                                ? errData.error
                                : "HTTP " + resp.status;
                        appendTimelineMsg(
                            "error",
                            "System",
                            "error",
                            "Re-generate failed: " + errMsg,
                        );
                        // Restore content section on failure
                        if (contentSection) {
                            var hdr2 =
                                document.getElementById("tv-response-header");
                            if (hdr2)
                                hdr2.innerHTML = "❌ Re-generation Failed";
                            var body2 =
                                contentSection.querySelector(
                                    ".task-section-body",
                                );
                            if (body2)
                                body2.innerHTML =
                                    '<div style="padding:16px;color:var(--red);font-size:12px">' +
                                    "Error: " +
                                    esc(errMsg) +
                                    "<br><br>The previous response is stopped. Click Re-generate to try again, or Undo Stop to release the original." +
                                    "</div>";
                        }
                    }
                } catch (e) {
                    if (taskViewState && taskViewState._regenTimerId)
                        cancelAnimationFrame(taskViewState._regenTimerId);
                    appendTimelineMsg(
                        "error",
                        "System",
                        "error",
                        "Re-generate failed: " + e.message,
                    );
                }
                if (el) {
                    el.disabled = false;
                    el.focus();
                }
            }

            // Helper: append a message to the live timeline (inside history section)

            // ---- Detail panel ----
            function selectAgent(name) {
                panelMode = "agent";
                clearTimeout(debounceTimer);
                debounceTimer = null;
                if (selectedAgent === name || name === null) {
                    // Toggle off / close
                    selectedAgent = null;
                    document
                        .getElementById("detail-panel")
                        .classList.remove("open");
                    document
                        .querySelectorAll(".agent-card")
                        .forEach(function (c) {
                            c.classList.remove("selected");
                        });
                    return;
                }
                selectedAgent = name;
                document.getElementById("detail-panel").classList.add("open");
                document.querySelectorAll(".agent-card").forEach(function (c) {
                    c.classList.toggle("selected", c.dataset.agent === name);
                });
                refreshDetailPanel();
            }

            async function refreshDetailPanel() {
                if (!selectedAgent) return;
                var name = selectedAgent;
                var [status, buffer, config] = await Promise.all([
                    fetchStatus(name),
                    fetchBuffer(name),
                    fetchConfig(name),
                ]);
                if (!status || selectedAgent !== name) return;
                var agent =
                    agents.find(function (a) {
                        return a.name === name;
                    }) || {};

                var tc = status.tasks_completed || 0;
                var tf = status.tasks_failed || 0;
                var total = tc + tf;
                var successPct =
                    total > 0 ? ((tc / total) * 100).toFixed(0) + "%" : "N/A";
                var meanStr =
                    status.mean_score != null
                        ? status.mean_score.toFixed(2)
                        : "-";

                var html =
                    '<button class="close-btn" onclick="selectAgent(\'' +
                    escJsAttr(name) +
                    "')\">&times;</button>" +
                    "<h3>" +
                    esc(name) +
                    "</h3>" +
                    '<div class="sub">' +
                    esc(status.model_name || "") +
                    " &middot; " +
                    esc(status.provider_id || "") +
                    "</div>" +
                    '<div class="stats-row">' +
                    '<div class="mini-stat"><div class="ms-label">Completed</div><div class="ms-value green">' +
                    tc +
                    "</div></div>" +
                    '<div class="mini-stat"><div class="ms-label">Failed</div><div class="ms-value red">' +

                    "</div></div>" +

                    successPct +
                    "</div></div>" +

                // Tuning sliders

                            ? entry.job_id.slice(-8)
                            : "";
                        var ageSec = Math.round((entry.age_ms || 0) / 1000);
                        var cls =
                            entry.action === "evaluate"
                                ? "evaluate"
                                : "propose";
                        html +=
                            '<div class="buf-entry">' +
                            '<span class="buf-action ' +
                            cls +
                            '">' +
                            (entry.action === "evaluate" ? "E" : "P") +
                            "</span>" +
                            '<span class="buf-job">' +
                            esc(shortJob) +
                            " r" +
                            entry.round +
                            "</span>" +
                            '<span class="buf-age">' +
                            ageSec +
                            "s</span>" +
                            '<div class="buf-btns">' +
                            "<button onclick=\"bufferAction('" +
                            escJsAttr(name) +
                            "','" +
                            escJsAttr(entry.id) +
                            "','release')\">Release</button>" +
                            '<button class="reject-btn" onclick="bufferAction(\'' +
                            escJsAttr(name) +
                            "','" +
                            escJsAttr(entry.id) +
                            "','stop')\">Stop</button>" +
                            "</div></div>";
                    });
                    html += "</div>";
                }

                // Recent events
                var events = (status.event_log || [])
                    .filter(function (e) {
                        return e.event_type !== "heartbeat";
                    })
                    .slice(-15)
                    .reverse();
                if (events.length > 0) {
                    html +=
                        '<div class="section-label">Recent Events</div><div class="panel-events">';
                    events.forEach(function (ev) {
                        html +=
                            '<div class="pe">' +
                            '<span class="pe-time">' +
                            esc(fmtTime(ev.timestamp)) +
                            "</span>" +
                            '<span class="pe-type ' +
                            esc(ev.event_type) +
                            '">' +
                            esc(ev.event_type) +
                            "</span>" +
                            "<span>" +
                            esc(ev.detail || "") +
                            "</span>" +
                            "</div>";
                    });
                    html += "</div>";
                }

                document.getElementById("detail-inner").innerHTML = html;

                // Attach slider listeners after DOM update
                document
                    .querySelectorAll(
                        '#detail-inner input[type="range"][data-field]',
                    )
                    .forEach(function (slider) {
                        slider.addEventListener("input", function () {
                            var valSpan =
                                slider.parentElement.querySelector(".ctrl-val");
                            if (valSpan)
                                valSpan.textContent = parseFloat(
                                    slider.value,
                                ).toFixed(1);
                            debouncePatch(name);
                        });
                    });
            }

            function makeSlider(field, label, value, min, max, step) {
                var val = parseFloat(value) || 0;
                return (
                    '<div class="ctrl-group">' +
                    '<div class="ctrl-label"><span>' +
                    esc(label) +
                    '</span><span class="ctrl-val">' +
                    val.toFixed(1) +
                    "</span></div>" +
                    '<input type="range" data-field="' +
                    field +
                    '" min="' +
                    min +
                    '" max="' +
                    max +
                    '" step="' +
                    step +
                    '" value="' +
                    val +
                    '">' +
                    "</div>"
                );
            }

            // ---- Config patching ----
            function debouncePatch(name) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(function () {
                    sendPatch(name);
                }, 500);
            }

            function sendPatch(name) {
                if (selectedAgent !== name) return; // agent switched before timer fired
                var panel = document.getElementById("detail-inner");
                var patch = {};

                panel
                    .querySelectorAll('input[type="range"][data-field]')
                    .forEach(function (el) {
                        patch[el.dataset.field] = parseFloat(el.value);
                    });

                var personaEl = panel.querySelector('[data-field="persona"]');
                if (personaEl) patch.persona = personaEl.value;

                var tfEl = panel.querySelector(
                    '[data-field="textual_feedback"]',
                );
                if (tfEl) patch.textual_feedback = tfEl.checked;

                fetch("/api/agents/" + encodeURIComponent(name) + "/config", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(patch),
                }).catch(function (e) {
                    console.error("Config patch failed:", e);
                });
            }

            // ---- Buffer actions ----
            async function bufferAction(name, entryId, action) {
                try {
                    var resp = await fetch(
                        "/api/agents/" +
                            encodeURIComponent(name) +
                            "/buffer/" +
                            encodeURIComponent(entryId) +
                            "/" +
                            action,
                        {
                            method: "POST",
                        },
                    );
                    if (!resp.ok) {
                        console.error(
                            "Buffer " + action + " failed: HTTP " + resp.status,
                        );
                        return;
                    }
                    panelMode = "agent"; // switch back to agent sidebar after release/stop
                    refreshDetailPanel();
                } catch (e) {
                    console.error("Buffer action failed:", e);
                }
            }

            // ---- Main refresh loop ----
            var refreshInFlight = false;
            async function refreshAll() {
                if (refreshInFlight) return; // prevent overlapping refresh cycles
                refreshInFlight = true;
                try {
                    var freshAgents = await fetchAgents();
                    // null means transport failure — preserve the current list.
                    // An authoritative empty array (server returned []) is applied.
                    if (freshAgents !== null) {
                        agents = freshAgents;
                    }
                    // Update agent data cache for divergence coloring
                    var activeNames = {};
                    agents.forEach(function (a) {
                        agentDataCache[a.name] = a;
                        activeNames[a.name] = true;
                    });
                    // Prune caches for agents that no longer exist
                    Object.keys(agentDataCache).forEach(function (name) {
                        if (!activeNames[name]) delete agentDataCache[name];
                    });
                    Object.keys(boardStatusCache).forEach(function (name) {
                        if (!activeNames[name]) delete boardStatusCache[name];
                    });
                    // Count paused and flagged agents for header badges
                    var pausedCount = agents.filter(function (a) {
                        return a.is_paused;
                    }).length;
                    var flaggedCount = agents.filter(function (a) {
                        return a.is_flagged;
                    }).length;
                    document.getElementById("agent-count").textContent =
                        agents.length + " agents";
                    document.getElementById("paused-count").textContent =
                        pausedCount > 0 ? pausedCount + " paused" : "";
                    var flaggedEl = document.getElementById("flagged-count");
                    if (flaggedEl)
                        flaggedEl.textContent =
                            flaggedCount > 0 ? flaggedCount + " flagged" : "";

                    // Update master toggle button state
                    var masterBtn = document.getElementById("master-toggle");
                    if (masterBtn) {
                        var anyRunning = agents.some(function (a) {
                            return !a.is_paused;
                        });
                        masterBtn.innerHTML = anyRunning
                            ? "&#9209;"
                            : "&#9654;"; // ⏹ stop-all vs ▶ start-all
                        masterBtn.title = anyRunning ? "Stop All" : "Start All";
                        if (!anyRunning && agents.length > 0)
                            masterBtn.classList.add("paused");
                        else masterBtn.classList.remove("paused");
                    }

                    // Master auto button state
                    var masterAutoBtn = document.getElementById("master-auto");
                    if (masterAutoBtn) {
                        var anyAuto = agents.some(function (a) {
                            return a.auto_approve;
                        });
                        if (anyAuto) {
                            masterAutoBtn.classList.add("active");
                            masterAutoBtn.title =
                                "Auto-approve ON — click to disable all";
                        } else {
                            masterAutoBtn.classList.remove("active");
                            masterAutoBtn.title =
                                "Auto-approve OFF — click to enable all";
                        }
                    }

                    // Fetch all agent statuses in parallel (avoids N+1 serial requests)
                    var statusResults = await Promise.all(
                        agents.map(function (a) {
                            return fetchStatus(a.name).then(function (status) {
                                return { agent: a, status: status };
                            });
                        }),
                    );

                    // Cache statuses for board/queue views
                    statusResults.forEach(function (item) {
                        if (item.status) {
                            boardStatusCache[item.agent.name] = {
                                status: item.status,
                            };
                        }
                    });

                    // Update active view
                    if (currentView === "board") {
                        buildBoard(agents);
                    } else if (currentView === "queue") {
                        await refreshQueueNow();
                    }

                    // Refresh detail panel if open (but don't overwrite buffer edit view)
                    if (selectedAgent && panelMode === "agent")
                        refreshDetailPanel();

                    // Refresh orchestrator budgets when on orchestrators tab
                    if (currentView === "orchestrators") {
                        loadOrchestratorBudgets();
                    }
                } finally {
                    refreshInFlight = false;
                }
            }

            // Initial load + polling — gated on auth so a guarded dashboard
            // prompts for the token before it starts hitting /api/*.
            initAuth();
        </script>
    </body>
</html>
