        <script>
            /* Rain cards modules removed — board + queue views replace live rainfall */

            // ── Dashboard auth (bearer token) ──────────────────────────────
            // The /api/* control plane is guarded when the server runs with
            // QUORUM_DASHBOARD_TOKEN set. The page and /auth/status stay public;
            // the user pastes the token here, it is stored locally, and attached
            // as `Authorization: Bearer <token>` to every guarded request.
            var TOKEN = "";
            try {
                TOKEN = localStorage.getItem("quorum_dashboard_token") || "";
            } catch (e) { /* storage blocked (e.g. private mode) — token stays in memory */ }
            var AUTH_REQUIRED = false;
            var APP_STARTED = false;

            function guardedPath(url) {
                var p;
                try {
                    p = new URL(url, window.location.origin).pathname;
                } catch (e) {
                    p = String(url);
                }
                return p.indexOf("/api/") === 0 || p === "/auth/status";
            }

            // Wrap fetch so guarded calls carry the bearer token and a 401
            // re-prompts, without editing every individual call site.
            (function () {
                var nativeFetch = window.fetch.bind(window);
                window.fetch = function (input, init) {
                    init = init || {};
                    var url =
                        typeof input === "string"
                            ? input
                            : (input && input.url) || "";
                    if (TOKEN && guardedPath(url)) {
                        var headers = new Headers(init.headers || {});
                        if (!headers.has("Authorization")) {
                            headers.set("Authorization", "Bearer " + TOKEN);
                        }
                        init.headers = headers;
                    }
                    return nativeFetch(input, init).then(function (resp) {
                        if (resp.status === 401 && AUTH_REQUIRED) {
                            onAuthFailed();
                        }
                        return resp;
                    });
                };
            })();

            function onAuthFailed() {
                TOKEN = "";
                try {
                    localStorage.removeItem("quorum_dashboard_token");
                } catch (e) { /* storage blocked (e.g. private mode) — token stays in memory */ }
                showAuthBar(true);
                setAuthState("session expired — reconnect", false);
            }

            function showAuthBar(show) {
                var bar = document.getElementById("auth-bar");
                if (bar) bar.style.display = show ? "flex" : "none";
            }

            function setAuthState(msg, ok) {
                var el = document.getElementById("auth-state");
                if (el) {
                    el.textContent = msg;
                    el.style.color = ok ? "#3fb950" : "#f85149";
                }
            }

            async function initAuth() {
                try {
                    var resp = await fetch("/auth/status");
                    var s = await resp.json();
                    AUTH_REQUIRED = !!s.auth_required;
                    if (!AUTH_REQUIRED || s.authenticated) {
                        showAuthBar(AUTH_REQUIRED);
                        if (AUTH_REQUIRED) setAuthState("connected", true);
                        startApp();
                        return;
                    }
                } catch (e) {
                    AUTH_REQUIRED = true;
                }
                showAuthBar(true);
                setAuthState("enter token", false);
            }

            async function connectAuth() {
                var tokenField = document.getElementById("token-input");
                TOKEN = (tokenField && tokenField.value
                    ? tokenField.value
                    : "").trim();
                if (!TOKEN) {
                    setAuthState("token required", false);
                    return;
                }
                try {
                    localStorage.setItem("quorum_dashboard_token", TOKEN);
                } catch (e) { /* storage blocked (e.g. private mode) — token stays in memory */ }
                var resp = await fetch("/auth/status");
                var s = await resp.json();
                if (s.authenticated) {
                    setAuthState("connected", true);
                    startApp();
                } else {
                    TOKEN = "";
                    try {
                        localStorage.removeItem("quorum_dashboard_token");
                    } catch (e) { /* storage blocked (e.g. private mode) — token stays in memory */ }
                    setAuthState("invalid token", false);
                }
            }

            function startApp() {
                if (APP_STARTED) return;
                APP_STARTED = true;
                refreshAll().then(function () {
                    var anyAuto = agents.some(function (a) {
                        return a.auto_approve;
                    });
                    if (!anyAuto && agents.length > 0) {
                        toggleAllAutoApprove();
                    }
                });
                setInterval(refreshAll, 2000);
            }

            function esc(s) {
                if (s == null) return "";
                var d = document.createElement("div");
                d.textContent = String(s);
                return d.innerHTML;
            }
            // Escape for JS string inside HTML attribute: onclick="fn('...')"
            // First JS-escapes (for single-quoted string), then HTML-entity-escapes (for attribute context)
            function escJsAttr(s) {
                if (s == null) return "";
                s = String(s)
                    .replace(/\\/g, "\\\\")
                    .replace(/'/g, "\\'")
                    .replace(/"/g, '\\"')
                    .replace(/\n/g, "\\n")
                    .replace(/\r/g, "\\r");
                return s
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }
            var VALID_STANCES = [
                "strong_agree",
                "agree",
                "neutral",
                "disagree",
                "strong_disagree",
            ];
            var VALID_VERDICTS = [
                "verified",
                "contested",
                "unverified",
                "wrong",
            ];
            function safeEnumClass(prefix, raw, allowed, fallback) {
                var normalized = String(raw || "")
                    .toLowerCase()
                    .replace(/\s+/g, "_");
                return (
                    prefix +
                    (allowed.indexOf(normalized) !== -1 ? normalized : fallback)
                );
            }
            function fmtUptime(s) {
                if (s < 60) return s + "s";
                if (s < 3600) return Math.floor(s / 60) + "m";
                return (
                    Math.floor(s / 3600) +
                    "h " +
                    Math.floor((s % 3600) / 60) +
                    "m"
                );
            }
            function fmtTime(ts) {
                try {
                    return new Date(ts).toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                    });
                } catch (e) {
                    return ts;
                }
            }

            var agents = [];
            var selectedAgent = null;
            var panelMode = "agent"; // 'agent' = sidebar, 'buffer' = buffer detail/edit view
            var agentDataCache = {}; // latest agent data keyed by name (for divergence coloring)
            var debounceTimer = null;
            var currentSlaSecs = 300; // global SLA in seconds — set from backend config (5 min default)
            var responseSlaMs = 10000; // global response SLA in ms — agents exceeding are out-of-SLA
            var configuredSlaSecs = 300; // original configured SLA from backend — never changed by Speed slider

            var currentView = "board"; // 'board' (card grid) or 'queue' (buffer work queue)
            var boardStatusCache = {}; // { agentName: { status, buffer } } — cached for board cards
            var queueBufferCache = {}; // { agentName: [ bufferEntries ] } — cached for queue view

            function switchView(view) {
                currentView = view;
                document.querySelectorAll(".view-tab").forEach(function (btn) {
                    btn.classList.toggle("active", btn.dataset.view === view);
                });
                var board = document.getElementById("board");
                var queue = document.getElementById("queue");
                var orchView = document.getElementById("orchestrators-view");
                board.classList.toggle("active", view === "board");
                queue.classList.toggle("active", view === "queue");
                orchView.style.display = view === "orchestrators" ? "flex" : "none";
                if (view === "board") buildBoard(agents);
                if (view === "queue") refreshQueueNow();
                if (view === "orchestrators") loadOrchestratorBudgets();
            }

            // ---- Orchestrators view ----
            async function loadOrchestratorBudgets() {
                try {
                    var resp = await fetchWithTimeout("/api/orchestrators/budgets");
                    if (!resp.ok) return;
                    var data = await resp.json();
                    renderOrchestratorBudgets(data);
                    // Update detail panel budget if an orchestrator is selected
                    if (selectedOrchId && currentOrch) {
                        var updated = (data || []).find(function(ob) { return ob.id === selectedOrchId; });
                        if (updated && updated.budget) {
                            currentOrch.budget = updated.budget;
                            // Update the budget stats row in the detail panel
                            var budgetRow = document.querySelector('#orch-detail-content .orch-budget-row');
                            if (budgetRow) {
                                var b = updated.budget;
                                var rem = (b.credits_total || 0) + (b.credits_earned || 0) - (b.credits_used || 0);
                                var rc = rem > 0.5 ? '#27ae60' : rem > 0.1 ? '#f39c12' : '#e74c3c';
                                budgetRow.innerHTML =
                                    budgetStat('Balance', '$' + rem.toFixed(4), rc) +
                                    budgetStat('Allocated', '$' + (b.credits_total || 0).toFixed(2), '#58a6ff') +
                                    budgetStat('Spent', '$' + (b.credits_used || 0).toFixed(4), '#e74c3c') +
                                    budgetStat('Earned', '$' + (b.credits_earned || 0).toFixed(4), '#27ae60');
                            }
                        }
                    }
                } catch (e) {
                    console.warn("Failed to fetch orchestrator budgets:", e);
                }
            }

            var orchBudgets = []; // cached for detail view
            var selectedOrchId = null;
            function renderOrchestratorBudgets(budgets) {
                orchBudgets = budgets || [];
                var list = document.getElementById("orchestrators-list");
                if (!list) return;
                list.innerHTML = "";
                if (!budgets || budgets.length === 0) {
                    list.innerHTML = '<div style="color:#888;padding:12px;font-size:12px;">No orchestrators connected.</div>';
                    return;
                }
                budgets.forEach(function(ob) {
                    var item = document.createElement("div");
                    var isSelected = selectedOrchId === ob.id;
                    item.style.cssText = "padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:6px;transition:background 0.15s;" +
                        (isSelected ? "background:#1a1a3e;border:1px solid #556;" : "background:#111;border:1px solid #222;");
                    item.onmouseenter = function() { if (!isSelected) item.style.background = '#161630'; };
                    item.onmouseleave = function() { if (!isSelected) item.style.background = '#111'; };
                    item.onclick = function() { selectedOrchId = ob.id; renderOrchestratorBudgets(orchBudgets); openOrchestratorDetail(ob); };

                    var statusDot = ob.error ? '🔴' : '🟢';
                    var budgetLine = '';
                    if (ob.budget) {
                        var b = ob.budget;
                        var remaining = (b.credits_total || 0) + (b.credits_earned || 0) - (b.credits_used || 0);
                        var color = remaining > 0.5 ? '#27ae60' : remaining > 0.1 ? '#f39c12' : '#e74c3c';
                        budgetLine = '<div style="font-size:10px;color:' + color + ';margin-top:4px;">$' + remaining.toFixed(4) + ' remaining</div>';
                    } else if (ob.error) {
                        budgetLine = '<div style="font-size:10px;color:#e74c3c;margin-top:4px;">' + esc(ob.error) + '</div>';
                    }

                    item.innerHTML = '<div style="display:flex;align-items:center;gap:6px;">' +
                        '<span style="font-size:8px;">' + statusDot + '</span>' +
                        '<div style="flex:1;min-width:0;">' +
                        '<div style="font-weight:600;color:#eee;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(ob.id) + '</div>' +
                        '<div style="font-size:10px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(ob.url) + '</div>' +
                        budgetLine +
                        '</div></div>';
                    list.appendChild(item);
                });

                // Auto-select first if none selected
                if (!selectedOrchId && budgets.length > 0 && !document.getElementById("orchestrators-detail").querySelector('.orch-detail-loaded')) {
                    selectedOrchId = budgets[0].id;
                    renderOrchestratorBudgets(orchBudgets);
                    openOrchestratorDetail(budgets[0]);
                }
            }

            // ---- Orchestrator detail panel (proxy-based) ----
            var currentOrch = null;
            async function openOrchestratorDetail(ob) {
                currentOrch = ob;
                cleanupJobView();
                var detail = document.getElementById("orchestrators-detail");
                detail.innerHTML = '<div class="orch-detail-loaded">' +
                    '<h3 style="margin:0 0 4px;color:#eee;font-size:18px;">' + esc(ob.id) + '</h3>' +
                    '<div style="font-size:12px;color:#888;margin-bottom:16px;">' + esc(ob.url) +
                    ' &nbsp;<a href="' + esc(ob.url) + '/dashboard" target="_blank" rel="noopener noreferrer" style="color:#58a6ff;text-decoration:none;">Open Full Dashboard ↗</a></div>' +
                    '<div id="orch-detail-content"><div style="color:#888;">Loading...</div></div>' +
                    '</div>';

                var expectedId = ob.id;
                var prefix = '/api/orchestrators/' + encodeURIComponent(ob.id) + '/proxy';
                var [agentsResp, jobsResp] = await Promise.allSettled([
                    fetchWithTimeout(prefix + '/agents'),
                    fetchWithTimeout(prefix + '/admin/api/jobs')
                ]);

                // Bail if user switched to a different orchestrator while fetching
                if (!currentOrch || currentOrch.id !== expectedId) return;

                var agents = (agentsResp.status === 'fulfilled' && agentsResp.value.ok)
                    ? await agentsResp.value.json().catch(function() { return []; }) : [];
                var jobs = (jobsResp.status === 'fulfilled' && jobsResp.value.ok)
                    ? await jobsResp.value.json().catch(function() { return []; }) : [];

                renderOrchestratorDetail(ob, agents, jobs);
            }

            function renderOrchestratorDetail(ob, agents, jobs) {
                var b = ob.budget || {};
                var remaining = (b.credits_total || 0) + (b.credits_earned || 0) - (b.credits_used || 0);
                var remColor = remaining > 0.5 ? '#27ae60' : remaining > 0.1 ? '#f39c12' : '#e74c3c';
                var html = '';

                // Budget summary (auto-refreshed via loadOrchestratorBudgets)
                html += '<div class="orch-budget-row" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">';
                html += budgetStat('Balance', '$' + remaining.toFixed(4), remColor);
                html += budgetStat('Allocated', '$' + (b.credits_total || 0).toFixed(2), '#58a6ff');
                html += budgetStat('Spent', '$' + (b.credits_used || 0).toFixed(4), '#e74c3c');
                html += budgetStat('Earned', '$' + (b.credits_earned || 0).toFixed(4), '#27ae60');
                html += '</div>';

                // Ledger entries
                if (b.entries && b.entries.length > 0) {
                    html += '<details style="margin-bottom:16px;"><summary style="color:#ccc;cursor:pointer;font-size:13px;">Ledger (' + b.entries.length + ' entries)</summary>';
                    html += '<table style="width:100%;font-size:11px;color:#aaa;margin-top:6px;border-collapse:collapse;">';
                    html += '<tr style="border-bottom:1px solid #333;"><th style="text-align:left;padding:4px;">Time</th><th>Type</th><th>Amount</th><th>Job</th></tr>';
                    b.entries.slice(-10).reverse().forEach(function(e) {
                        var tc = e.entry_type === 'Debit' ? '#e74c3c' : e.entry_type === 'Credit' ? '#58a6ff' : '#27ae60';
                        html += '<tr style="border-bottom:1px solid #222;"><td style="padding:3px;">' + new Date(e.timestamp * 1000).toLocaleTimeString() + '</td>';
                        html += '<td style="color:' + tc + '">' + esc(e.entry_type) + '</td>';
                        html += '<td>$' + e.amount.toFixed(4) + '</td>';
                        html += '<td style="font-family:monospace;font-size:10px;">' + esc(e.job_id || '-') + '</td></tr>';
                    });
                    html += '</table></details>';
                }

                // Deliberation form
                html += '<div style="background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:16px;margin-bottom:16px;">';
                html += '<h4 style="margin:0 0 12px;color:#eee;font-size:14px;">New Deliberation</h4>';
                html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">';
                html += '<div><label style="color:#888;font-size:11px;">Room ID</label><input id="orch-room-id" placeholder="auto-generated" style="width:100%;padding:6px;background:#111;border:1px solid #444;border-radius:4px;color:#eee;font-size:12px;box-sizing:border-box;"></div>';
                html += '<div><label style="color:#888;font-size:11px;">Scope</label><select id="orch-scope" onchange="updateAgentFeasibility()" style="width:100%;padding:6px;background:#111;border:1px solid #444;border-radius:4px;color:#eee;font-size:12px;">';
                html += '<option value="quick">Quick — 300s</option><option value="standard" selected>Standard — 1800s</option><option value="thorough">Thorough — 3600s</option><option value="unlimited">Unlimited — 86400s</option></select></div>';
                html += '</div>';
                html += '<div style="margin-bottom:10px;"><label style="color:#888;font-size:11px;">Topic</label>';
                html += '<textarea id="orch-topic" rows="3" placeholder="What should agents deliberate on?" style="width:100%;padding:6px;background:#111;border:1px solid #444;border-radius:4px;color:#eee;font-size:12px;resize:vertical;box-sizing:border-box;"></textarea></div>';
                html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">';
                html += '<div><label style="color:#888;font-size:11px;">Rounds</label>';
                html += '<input id="orch-rounds" type="number" value="3" min="1" max="20" onchange="updateAgentFeasibility()" style="width:100%;padding:6px;background:#111;border:1px solid #444;border-radius:4px;color:#eee;font-size:12px;box-sizing:border-box;"></div>';
                html += '<div><label style="color:#888;font-size:11px;">Timeout (seconds, overrides scope)</label>';
                html += '<input id="orch-timeout" type="number" placeholder="auto from scope" min="30" onchange="updateAgentFeasibility()" style="width:100%;padding:6px;background:#111;border:1px solid #444;border-radius:4px;color:#eee;font-size:12px;box-sizing:border-box;"></div>';
                html += '</div>';

                // Agent picker with SLA feasibility
                if (agents && agents.length > 0) {
                    html += '<div style="margin-bottom:10px;"><label style="color:#888;font-size:11px;">Agents (' + agents.length + ')</label>';
                    html += '<div id="orch-agent-feasibility-msg" style="font-size:10px;color:#f39c12;margin:4px 0;display:none;"></div>';
                    html += '<div style="max-height:200px;overflow-y:auto;border:1px solid #333;border-radius:4px;margin-top:4px;">';
                    html += '<table style="width:100%;font-size:11px;color:#ccc;border-collapse:collapse;">';
                    html += '<tr style="background:#111;position:sticky;top:0;"><th style="padding:4px;text-align:left;"><input type="checkbox" id="orch-select-all" checked onchange="toggleAllOrchAgents(this.checked)"></th><th style="text-align:left;">Agent</th><th>Model</th><th>Operator</th><th>SLA</th><th>Status</th></tr>';
                    agents.forEach(function(a) {
                        var sc = a.is_online ? '#27ae60' : '#888';
                        var sla = a.response_sla_secs || 0;
                        html += '<tr class="orch-agent-row" data-sla="' + sla + '" data-agent="' + esc(a.agent_id) + '" style="border-bottom:1px solid #222;">';
                        html += '<td style="padding:3px;"><input type="checkbox" class="orch-agent-cb" value="' + esc(a.agent_id) + '" ' + (a.is_online ? 'checked' : '') + '></td>';
                        html += '<td>' + esc(a.agent_id) + '</td><td>' + esc(a.model_name || '-') + '</td>';
                        html += '<td>' + esc(a.operator || '-') + '</td>';
                        html += '<td>' + (sla > 0 ? sla + 's' : '-') + '</td>';
                        html += '<td style="color:' + sc + '">' + (a.is_online ? '●' : '○') + '</td></tr>';
                    });
                    html += '</table></div></div>';
                }

                html += '<button onclick="submitOrchestratorDeliberation()" style="background:#238636;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px;">Start Deliberation</button>';
                html += ' <span id="orch-submit-status" style="font-size:12px;color:#888;"></span>';
                html += '</div>';

                // Jobs list
                html += '<h4 style="margin:0 0 10px;color:#eee;font-size:14px;">Recent Jobs</h4>';
                if (jobs && jobs.length > 0) {
                    html += '<table style="width:100%;font-size:11px;color:#ccc;border-collapse:collapse;">';
                    html += '<tr style="border-bottom:1px solid #333;"><th style="text-align:left;padding:4px;">Job ID</th><th>Status</th><th>Query</th></tr>';
                    jobs.slice(0, 20).forEach(function(j) {
                        var jid = j.job_id || j.id || '';
                        var sc = j.status === 'completed' ? '#27ae60' : j.status === 'running' ? '#58a6ff' : '#888';
                        html += '<tr style="border-bottom:1px solid #222;cursor:pointer;" onclick="viewJobDetail(\'' + esc(jid).replace(/'/g, "\\'") + '\')">';
                        html += '<td style="padding:3px;font-family:monospace;color:#58a6ff;">' + esc(jid) + '</td>';
                        html += '<td style="color:' + sc + '">' + esc(j.status || '-') + '</td>';
                        html += '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(j.query_preview || '-') + '</td></tr>';
                    });
                    html += '</table>';
                } else {
                    html += '<div style="color:#888;font-size:12px;">No jobs</div>';
                }

                document.getElementById("orch-detail-content").innerHTML = html;
                // Validate agent feasibility after rendering form
                updateAgentFeasibility();
            }

            function budgetStat(label, value, color) {
                return '<div style="background:#111;border-radius:8px;padding:10px;text-align:center;">' +
                    '<div style="font-size:11px;color:#888;">' + label + '</div>' +
                    '<div style="font-size:16px;font-weight:600;color:' + color + ';margin-top:4px;">' + value + '</div></div>';
            }

            // Mirrors `Scope::timeout_seconds()` in `quorum-rs` (`scheduling.rs`).
            // Keep in sync with the Rust source of truth.
            var SCOPE_TIMEOUTS = { quick: 300, standard: 1800, thorough: 3600, unlimited: 86400 };

            function toggleAllOrchAgents(checked) {
                document.querySelectorAll('.orch-agent-cb:not(:disabled)').forEach(function(cb) { cb.checked = checked; });
            }

            function updateAgentFeasibility() {
                var scopeEl = document.getElementById('orch-scope');
                var timeoutEl = document.getElementById('orch-timeout');
                if (!scopeEl) return;

                var timeoutSecs = parseInt(timeoutEl && timeoutEl.value) || SCOPE_TIMEOUTS[scopeEl.value] || 600;
                var roundsEl = document.getElementById('orch-rounds');
                var rounds = parseInt(roundsEl && roundsEl.value) || 3;
                var infeasibleCount = 0;

                document.querySelectorAll('.orch-agent-row').forEach(function(row) {
                    var sla = parseInt(row.dataset.sla) || 0;
                    var cb = row.querySelector('.orch-agent-cb');
                    if (!cb) return;

                    // Total time needed: rounds × 2 × SLA (propose + evaluate per round)
                    var requiredTime = rounds * 2 * sla;
                    var feasible = sla === 0 || requiredTime <= timeoutSecs;

                    if (!feasible) {
                        row.style.opacity = '0.4';
                        cb.checked = false;
                        cb.disabled = true;
                        infeasibleCount++;
                    } else {
                        row.style.opacity = '1';
                        cb.disabled = false;
                    }
                });

                var msg = document.getElementById('orch-agent-feasibility-msg');
                if (msg) {
                    if (infeasibleCount > 0) {
                        msg.style.display = 'block';
                        msg.textContent = '⚠ ' + infeasibleCount + ' agent(s) disabled — SLA × ' + rounds + ' rounds exceeds ' + timeoutSecs + 's timeout';
                    } else {
                        msg.style.display = 'none';
                    }
                }
            }

            var isSubmittingDelib = false;
            async function submitOrchestratorDeliberation() {
                if (!currentOrch || isSubmittingDelib) return;
                var topic = document.getElementById('orch-topic').value.trim();
                if (!topic) { alert('Please enter a topic'); return; }
                var selectedAgents = [];
                document.querySelectorAll('.orch-agent-cb:checked').forEach(function(cb) { selectedAgents.push(cb.value); });
                if (selectedAgents.length < 2) { alert('Select at least 2 agents'); return; }

                var statusEl = document.getElementById('orch-submit-status');
                isSubmittingDelib = true;
                statusEl.textContent = 'Submitting...';
                statusEl.style.color = '#58a6ff';

                try {
                    var payload = {
                        user_query: topic,
                        agent_names: selectedAgents,
                        scope: document.getElementById('orch-scope').value,
                        deliberation_rounds: parseInt(document.getElementById('orch-rounds').value) || 3,
                        room_id: document.getElementById('orch-room-id').value.trim() || ('delib-' + Date.now().toString(36))
                    };
                    var timeoutVal = parseInt(document.getElementById('orch-timeout').value);
                    if (timeoutVal > 0) payload.timeout_seconds = timeoutVal;
                    var body = JSON.stringify(payload);
                    var resp = await fetch('/api/orchestrators/' + encodeURIComponent(currentOrch.id) + '/proxy/deliberation', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body
                    });
                    var result = await resp.json().catch(function() { return null; });
                    if (resp.ok) {
                        var jobId = result && result.job_id ? result.job_id : null;
                        statusEl.textContent = '✓ ' + (jobId || 'OK');
                        statusEl.style.color = '#27ae60';
                        if (jobId) setTimeout(function() { viewJobDetail(jobId); }, 500);
                    } else {
                        statusEl.textContent = '✗ ' + ((result && result.error) || 'HTTP ' + resp.status);
                        statusEl.style.color = '#e74c3c';
                    }
                } catch (e) {
                    statusEl.textContent = '✗ ' + e.message;
                    statusEl.style.color = '#e74c3c';
                } finally {
                    isSubmittingDelib = false;
                }
            }

            // ---- Job detail view with SSE + fallback polling ----
            var jobPollTimer = null;
            var jobEventSource = null;
            var jobSseEvents = [];
            var currentViewedJobId = null;

            function viewJobDetail(jobId) {
                if (!currentOrch) return;
                cleanupJobView();
                currentViewedJobId = jobId;

                var detail = document.getElementById("orchestrators-detail");
                detail.innerHTML = '<div class="orch-detail-loaded">' +
                    '<button onclick="openOrchestratorDetail(currentOrch)" style="background:none;border:1px solid #555;color:#ccc;padding:4px 12px;border-radius:4px;cursor:pointer;margin-bottom:12px;font-size:12px;">← Back</button>' +
                    '<h3 style="margin:0 0 4px;color:#eee;font-size:16px;">Job: <code style="color:#58a6ff;">' + esc(jobId) + '</code></h3>' +
                    '<div id="job-status-badge" style="margin:8px 0 8px;font-size:13px;color:#888;">Connecting...</div>' +
                    '<div id="job-sse-feed" style="margin-bottom:12px;"></div>' +
                    '<div id="job-detail-body"></div></div>';

                jobSseEvents = [];
                startJobSSE(jobId);
                // Also do an initial poll for existing data
                pollJobStatus(jobId);
                jobPollTimer = setInterval(function() { pollJobStatus(jobId); }, 5000);
            }

            function cleanupJobView() {
                currentViewedJobId = null;
                if (jobEventSource) { jobEventSource.close(); jobEventSource = null; }
                if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
                jobSseEvents = [];
            }

            function startJobSSE(jobId) {
                if (!currentOrch) return;
                var sseUrl = '/api/orchestrators/' + encodeURIComponent(currentOrch.id) +
                    '/stream/' + encodeURIComponent(jobId);

                jobEventSource = new EventSource(sseUrl);
                jobEventSource.onopen = function() {
                    var badge = document.getElementById("job-status-badge");
                    if (badge) badge.innerHTML = '<span style="color:#58a6ff;">● SSE connected</span>';
                };
                jobEventSource.onmessage = function(ev) {
                    try {
                        var data = JSON.parse(ev.data);
                        handleSseEvent(data);
                    } catch(e) {
                        // raw text event
                        handleSseEvent({ type: 'message', data: ev.data });
                    }
                };
                // Listen for typed events from the orchestrator
                ['round_start', 'phase_start', 'proposal', 'evaluation', 'round_end',
                 'convergence', 'budget_update', 'job_complete', 'job_failed', 'replay_complete'].forEach(function(evType) {
                    jobEventSource.addEventListener(evType, function(ev) {
                        try {
                            var data = JSON.parse(ev.data);
                            data._sseType = evType;
                            handleSseEvent(data);
                        } catch(e) {}
                    });
                });
                jobEventSource.onerror = function() {
                    var badge = document.getElementById("job-status-badge");
                    if (badge && badge.innerHTML.indexOf('COMPLETED') === -1 && badge.innerHTML.indexOf('FAILED') === -1) {
                        badge.innerHTML = '<span style="color:#f39c12;">● SSE reconnecting...</span>';
                    }
                };
            }

            function handleSseEvent(data) {
                var evType = data._sseType || data.type || data.event || 'unknown';
                var feed = document.getElementById("job-sse-feed");
                if (!feed) return;

                // Update status badge for key events
                var badge = document.getElementById("job-status-badge");
                if (evType === 'round_start' && badge) {
                    badge.innerHTML = '<span style="color:#58a6ff;">● RUNNING — Round ' + (data.round || '?') + '</span>';
                } else if (evType === 'phase_start' && badge) {
                    var phase = data.phase || '?';
                    badge.innerHTML = '<span style="color:#58a6ff;">● ' + phase.toUpperCase() + '</span>';
                } else if (evType === 'job_complete' && badge) {
                    badge.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#27ae60;margin-right:6px;"></span><span style="color:#27ae60;font-weight:600;">COMPLETED</span>';
                    cleanupJobView();
                    // Final poll to get full details
                    setTimeout(function() { pollJobStatus(data.job_id || ''); }, 500);
                } else if (evType === 'job_failed' && badge) {
                    badge.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#e74c3c;margin-right:6px;"></span><span style="color:#e74c3c;font-weight:600;">FAILED</span>';
                    cleanupJobView();
                }

                // Add event to live feed (keep last 30)
                jobSseEvents.push(data);
                if (jobSseEvents.length > 30) jobSseEvents.shift();
                renderSseFeed();

                // Update budget display if present
                if (evType === 'budget_update' && data.snapshot) {
                    renderLiveBudget(data.snapshot);
                }
            }

            function renderSseFeed() {
                var feed = document.getElementById("job-sse-feed");
                if (!feed) return;
                var html = '<details open style="margin-bottom:4px;"><summary style="color:#ccc;cursor:pointer;font-size:12px;">Live Events (' + jobSseEvents.length + ')</summary>';
                html += '<div style="max-height:200px;overflow-y:auto;font-family:monospace;font-size:11px;background:#0a0a15;border:1px solid #222;border-radius:4px;padding:6px;margin-top:4px;">';
                jobSseEvents.slice().reverse().forEach(function(ev) {
                    var evType = ev._sseType || ev.type || ev.event || '?';
                    var color = {round_start:'#58a6ff',phase_start:'#888',proposal:'#ccc',evaluation:'#f39c12',
                        round_end:'#58a6ff',convergence:'#27ae60',budget_update:'#888',job_complete:'#27ae60',job_failed:'#e74c3c'}[evType] || '#666';
                    var summary = evType;
                    if (ev.round) summary += ' r' + ev.round;
                    if (ev.agent_id) summary += ' ' + ev.agent_id;
                    if (ev.phase) summary += ' ' + ev.phase;
                    if (ev.score !== undefined) summary += ' score=' + ev.score;
                    if (ev.convergence_score !== undefined) summary += ' conv=' + (ev.convergence_score).toFixed(2);
                    html += '<div style="color:' + color + ';padding:1px 0;">' + esc(summary) + '</div>';
                });
                html += '</div></details>';
                feed.innerHTML = html;
            }

            function renderLiveBudget(snap) {
                var body = document.getElementById("job-detail-body");
                if (!body) return;
                var existing = body.querySelector('.live-budget-row');
                var html = '<div class="live-budget-row" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;">';
                html += miniStat('Rounds', (snap.rounds_completed||0) + '/' + (snap.total_rounds||'?'));
                html += miniStat('Time', fmtSecs(snap.elapsed_secs||0) + ' / ' + fmtSecs(snap.job_timeout_secs||0));
                html += miniStat('In Tokens', formatTokens(snap.total_input_tokens||0));
                html += miniStat('Out Tokens', formatTokens(snap.total_output_tokens||0));
                html += miniStat('Cost', '$'+(snap.estimated_cost_usd||0).toFixed(4));
                html += '</div>';
                if (existing) {
                    existing.outerHTML = html;
                } else {
                    body.insertAdjacentHTML('afterbegin', html);
                }
            }

            async function pollJobStatus(jobId) {
                if (!currentOrch || currentViewedJobId !== jobId) return;
                var prefix = '/api/orchestrators/' + encodeURIComponent(currentOrch.id) + '/proxy';
                try {
                    var [rr, dr, br] = await Promise.allSettled([
                        fetchWithTimeout(prefix + '/deliberation/' + encodeURIComponent(jobId) + '/result'),
                        fetchWithTimeout(prefix + '/deliberation/' + encodeURIComponent(jobId) + '/details'),
                        fetchWithTimeout(prefix + '/deliberation/' + encodeURIComponent(jobId) + '/budget')
                    ]);
                    var result = (rr.status === 'fulfilled' && rr.value.ok) ? await rr.value.json().catch(function(){return null;}) : null;
                    var details = (dr.status === 'fulfilled' && dr.value.ok) ? await dr.value.json().catch(function(){return null;}) : null;
                    var budget = (br.status === 'fulfilled' && br.value.ok) ? await br.value.json().catch(function(){return null;}) : null;

                    renderJobDetail(jobId, result, details, budget);
                    if (result && (result.status === 'completed' || result.status === 'failed')) {
                        cleanupJobView();
                    }
                } catch (e) {
                    // silent — SSE is primary
                }
            }

            function renderJobDetail(jobId, result, details, budget) {
                var status = (result && result.status) || 'unknown';
                var sc = {pending:'#888',claimed:'#f39c12',running:'#58a6ff',completed:'#27ae60',failed:'#e74c3c'}[status] || '#888';

                var badge = document.getElementById("job-status-badge");
                if (badge) {
                    badge.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+sc+';margin-right:6px;"></span>' +
                        '<span style="color:'+sc+';font-weight:600;">'+status.toUpperCase()+'</span>' + (status==='running'?' ⟳':'');
                }

                var body = document.getElementById("job-detail-body");
                if (!body) return;
                var html = '';

                // Budget stats — response is { job_id, budget: BudgetSnapshot }
                var snap = budget && budget.budget ? budget.budget : budget;
                if (snap && snap.total_rounds) {
                    html += '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;">';
                    html += miniStat('Rounds', (snap.rounds_completed||0) + '/' + (snap.total_rounds||'?'));
                    html += miniStat('Time', fmtSecs(snap.elapsed_secs||0) + ' / ' + fmtSecs(snap.job_timeout_secs||0));
                    html += miniStat('In Tokens', formatTokens(snap.total_input_tokens||0));
                    html += miniStat('Out Tokens', formatTokens(snap.total_output_tokens||0));
                    html += miniStat('Cost', '$'+(snap.estimated_cost_usd||0).toFixed(4));
                    html += '</div>';
                }

                // Final answer
                if (result && result.result) {
                    html += '<div style="background:#0a2a0a;border:1px solid #27ae60;border-radius:8px;padding:14px;margin-bottom:16px;">';
                    html += '<div style="font-size:11px;color:#27ae60;font-weight:600;margin-bottom:6px;">FINAL ANSWER</div>';
                    html += '<div style="color:#eee;font-size:13px;line-height:1.5;white-space:pre-wrap;">'+esc(result.result)+'</div></div>';
                }

                // Full deliberation history
                // ProposalRecord: { round, author_agent_id, proposal: { content, thought_process }, evaluations: [{ evaluator_agent_id, evaluation: { score, justification } }], aggregated_score }
                if (details && details.history && details.history.length > 0) {
                    var roundKeys = {};
                    details.history.forEach(function(p) { var r=p.round||0; if(!roundKeys[r])roundKeys[r]=[]; roundKeys[r].push(p); });
                    var sortedRounds = Object.keys(roundKeys).sort(function(a,b){return a-b;});

                    html += '<h4 style="margin:0 0 10px;color:#eee;font-size:14px;">Deliberation History — ' + sortedRounds.length + ' rounds, ' + details.history.length + ' proposals</h4>';

                    sortedRounds.forEach(function(rn) {
                        var props = roundKeys[rn];
                        html += '<details open style="margin-bottom:10px;">';
                        html += '<summary style="cursor:pointer;color:#ccc;font-size:13px;font-weight:600;">Round '+rn+' — '+props.length+' proposals</summary>';
                        html += '<div style="margin-left:8px;border-left:2px solid #333;padding-left:12px;">';
                        props.forEach(function(p) {
                            var score = p.aggregated_score != null ? p.aggregated_score : -1;
                            var psc = score >= 7 ? '#27ae60' : score >= 4 ? '#f39c12' : score >= 0 ? '#e74c3c' : '#888';
                            var content = (p.proposal && p.proposal.content) || p.content || '';
                            var thought = (p.proposal && p.proposal.thought_process) || '';

                            html += '<div style="background:#111;border-radius:6px;padding:12px;margin:8px 0;">';
                            // Header: agent name + score
                            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
                            html += '<span style="font-weight:600;color:#eee;font-size:13px;">'+esc(p.author_agent_id||'?')+'</span>';
                            if (score >= 0) html += '<span style="color:'+psc+';font-weight:600;font-size:13px;background:#1a1a2e;padding:2px 8px;border-radius:4px;">'+score.toFixed(1)+'/10</span>';
                            html += '</div>';

                            // Proposal content
                            html += '<div style="color:#ccc;font-size:12px;line-height:1.6;white-space:pre-wrap;margin-bottom:8px;">'+esc(content)+'</div>';

                            // Thought process (collapsible)
                            if (thought) {
                                html += '<details style="margin-bottom:8px;"><summary style="font-size:11px;color:#666;cursor:pointer;">Thought process</summary>';
                                html += '<div style="color:#777;font-size:11px;line-height:1.4;white-space:pre-wrap;margin-top:4px;padding:6px;background:#0a0a15;border-radius:4px;">'+esc(thought)+'</div></details>';
                            }

                            // Evaluations
                            if (p.evaluations && p.evaluations.length > 0) {
                                html += '<div style="margin-top:8px;border-top:1px solid #222;padding-top:8px;">';
                                html += '<div style="font-size:11px;color:#888;font-weight:600;margin-bottom:6px;">Evaluations ('+p.evaluations.length+')</div>';
                                p.evaluations.forEach(function(evRec) {
                                    var ev = evRec.evaluation || evRec;
                                    var evScore = ev.score != null ? ev.score : -1;
                                    var ec = evScore >= 7 ? '#27ae60' : evScore >= 4 ? '#f39c12' : evScore >= 0 ? '#e74c3c' : '#888';
                                    var justification = ev.justification || ev.critique || '';

                                    html += '<div style="padding:6px 0;border-bottom:1px solid #1a1a1a;">';
                                    html += '<div style="display:flex;align-items:center;gap:8px;">';
                                    html += '<span style="color:'+ec+';font-weight:600;font-size:12px;min-width:40px;">'+(evScore>=0?evScore.toFixed(1):'?')+'/10</span>';
                                    html += '<span style="color:#aaa;font-size:12px;">'+esc(evRec.evaluator_agent_id||'?')+'</span>';
                                    html += '</div>';
                                    if (justification) {
                                        html += '<div style="color:#888;font-size:11px;line-height:1.4;margin-top:4px;margin-left:48px;white-space:pre-wrap;">'+esc(justification)+'</div>';
                                    }
                                    html += '</div>';
                                });
                                html += '</div>';
                            }
                            html += '</div>';
                        });
                        html += '</div></details>';
                    });
                } else if (status==='running') {
                    html += '<div style="color:#888;font-size:13px;text-align:center;padding:20px;">Waiting for round data...</div>';
                }
                body.innerHTML = html;
            }

            function miniStat(l,v) {
                return '<div style="background:#111;border-radius:6px;padding:8px;text-align:center;"><div style="font-size:10px;color:#888;">'+l+'</div><div style="font-size:14px;color:#eee;font-weight:600;margin-top:2px;">'+v+'</div></div>';
            }
            function fmtSecs(s) { return s<60?s.toFixed(0)+'s':s<3600?Math.floor(s/60)+'m '+(s%60).toFixed(0)+'s':Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m'; }
            function trunc(s,m) { return !s||s.length<=m?s||'':s.substring(0,m)+'…'; }

            function formatTokens(n) {
                if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
                if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
                return '' + n;
            }

            // ---- Data fetching ----
            var FETCH_TIMEOUT_MS = 8000;
            function fetchWithTimeout(url) {
                return fetch(url, {
                    signal: AbortSignal.timeout(FETCH_TIMEOUT_MS),
                });
            }
            async function fetchAgents() {
                try {
                    var r = await fetchWithTimeout("/api/agents");
                    if (!r.ok) return null; // transport/server error
                    return await r.json();
                } catch (e) {
                    return null; // network error — distinct from empty list
                }
            }
            async function fetchStatus(name) {
                try {
                    var r = await fetchWithTimeout(
                        "/api/agents/" + encodeURIComponent(name) + "/status",
                    );
                    return await r.json();
                } catch (e) {
                    return null;
                }
            }
            async function fetchBuffer(name) {
                try {
                    var r = await fetchWithTimeout(
                        "/api/agents/" + encodeURIComponent(name) + "/buffer",
                    );
                    return await r.json();
                } catch (e) {
                    return [];
                }
            }
            async function fetchConfig(name) {
                try {
                    var r = await fetchWithTimeout(
                        "/api/agents/" + encodeURIComponent(name) + "/config",
                    );
                    return await r.json();
                } catch (e) {
                    return null;
                }
            }

            // Column rendering removed — board + queue views handle agent display

            // updateColumnHeader and buildColumns removed — board/queue handle agent display

            // ---- Board view (agent cards) ----

            function buildBoard(agentList) {
                var container = document.getElementById("board-grid");
                var existingCards = {};
                container.querySelectorAll(".agent-card").forEach(function (c) {
                    existingCards[c.dataset.agent] = c;
                });

                agentList.forEach(function (a) {
                    var card = existingCards[a.name];
                    if (!card) {
                        card = document.createElement("div");
                        card.className = "agent-card";
                        card.dataset.agent = a.name;
                        card.setAttribute("tabindex", "0");
                        card.setAttribute("role", "button");
                        card.setAttribute("aria-label", "Agent " + a.name);
                        card.innerHTML =
                            '<div class="card-top">' +
                            '<span class="status-dot" data-el="dot"></span>' +
                            '<span class="card-name">' +
                            esc(a.name) +
                            "</span>" +
                            '<span class="card-flag" data-el="flag" style="display:none"></span>' +
                            '<button class="card-pause-btn" data-el="pausebtn" title="Pause">&#9208;</button>' +
                            "</div>" +
                            '<div class="card-metrics" data-el="metrics"></div>' +
                            '<div class="card-auto" data-el="auto"></div>';
                        container.appendChild(card);

                        // Card click → open agent detail modal (except pause button)
                        card.addEventListener("click", function (e) {
                            if (e.target.classList.contains("card-pause-btn"))
                                return;
                            openAgentModal(a.name);
                        });

                        // Keyboard: Enter/Space → open agent detail modal
                        card.addEventListener("keydown", function (e) {
                            if (e.key === "Enter" || e.key === " ") {
                                if (
                                    e.target.classList.contains(
                                        "card-pause-btn",
                                    )
                                )
                                    return;
                                e.preventDefault();
                                openAgentModal(a.name);
                            }
                        });

                        // Pause button
                        card.querySelector(
                            '[data-el="pausebtn"]',
                        ).addEventListener("click", function (e) {
                            e.stopPropagation();
                            togglePause(a.name);
                        });
                    }
                    updateBoardCard(card, a);
                    delete existingCards[a.name];
                });

                // Remove cards for agents that no longer exist
                Object.values(existingCards).forEach(function (c) {
                    c.remove();
                });
            }

            function updateBoardCard(card, a) {
                // Status dot
                var dot = card.querySelector('[data-el="dot"]');
                var cached = boardStatusCache[a.name] || {};
                var isWorking = cached.status && cached.status.current_phase;
                var dotClass = "status-dot";
                if (a.is_paused) dotClass += " paused";
                else if (
                    cached.status &&
                    cached.status.tasks_failed > 0 &&
                    cached.status.tasks_completed === 0
                )
                    dotClass += " error";
                else if (isWorking) dotClass += " working";
                else dotClass += " idle";
                dot.className = dotClass;

                // Paused card state
                card.classList.toggle("paused", !!a.is_paused);
                card.classList.toggle("selected", selectedAgent === a.name);
                card.classList.toggle("flagged", !!a.is_flagged);

                // Pause button
                var pauseBtn = card.querySelector('[data-el="pausebtn"]');
                if (a.is_paused) {
                    pauseBtn.innerHTML = "&#9654;";
                    pauseBtn.classList.add("paused");
                    pauseBtn.title = "Resume";
                } else {
                    pauseBtn.innerHTML = "&#9208;";
                    pauseBtn.classList.remove("paused");
                    pauseBtn.title = "Pause";
                }

                // Flag
                var flagEl = card.querySelector('[data-el="flag"]');
                if (a.is_flagged) {
                    flagEl.textContent = "\u2691";
                    flagEl.title = a.flag_reason || "Flagged";
                    flagEl.style.display = "inline";
                } else {
                    flagEl.style.display = "none";
                }

                // Metrics badges
                var metricsHtml = "";

                // Score badge
                if (a.mean_score != null) {
                    metricsHtml +=
                        '<span class="card-badge ' +
                        scoreClass(a.mean_score) +
                        '">' +
                        '<span class="badge-label">Score</span>' +
                        a.mean_score.toFixed(2) +
                        "</span>";
                }

                // Error rate badge (from cached status)
                if (cached.status) {
                    var tc = cached.status.tasks_completed || 0;
                    var tf = cached.status.tasks_failed || 0;
                    var total = tc + tf;
                    if (total > 0) {
                        var errPct = ((tf / total) * 100).toFixed(0);
                        var errClass =
                            tf === 0
                                ? "good"
                                : tf / total > 0.2
                                  ? "low"
                                  : "mid";
                        metricsHtml +=
                            '<span class="card-badge ' +
                            errClass +
                            '">' +
                            '<span class="badge-label">Err</span>' +
                            errPct +
                            "%</span>";
                    }
                }

                // Buffered count badge
                var bufCount = cached.status
                    ? cached.status.buffered_count || 0
                    : 0;
                if (bufCount > 0) {
                    metricsHtml +=
                        '<span class="card-badge buf-active">' +
                        '<span class="badge-label">Buf</span>' +
                        bufCount +
                        "</span>";
                }

                card.querySelector('[data-el="metrics"]').innerHTML =
                    metricsHtml;

                // Auto-approve indicator
                var autoHtml =
                    '<span class="auto-dot' +
                    (a.auto_approve ? " on" : "") +
                    '"></span>';
                if (a.auto_approve) {
                    autoHtml +=
                        "Auto " +
                        Math.round((a.auto_approve_threshold || 0.5) * 100) +
                        "%";
                } else {
                    autoHtml += "Manual";
                }
                card.querySelector('[data-el="auto"]').innerHTML = autoHtml;
            }

            // ---- Queue view (unified buffer work queue) ----

            // Immediately fetch all agent buffers and rebuild the queue.
            // Called on tab activation so the queue is always fresh.
            async function refreshQueueNow() {
                // Prune stale agents from cache.  fetchAgents() returns null on
                // transport failure (preserving the agent list), so agents is
                // always authoritative here — safe to prune unconditionally.
                var activeNames = {};
                agents.forEach(function (a) {
                    activeNames[a.name] = true;
                });
                Object.keys(queueBufferCache).forEach(function (name) {
                    if (!activeNames[name]) delete queueBufferCache[name];
                });
                // Fetch all current agents' buffers in parallel
                var bufResults = await Promise.all(
                    agents.map(function (a) {
                        return fetchBuffer(a.name).then(function (buf) {
                            return { name: a.name, buffer: buf };
                        });
                    }),
                );
                bufResults.forEach(function (item) {
                    queueBufferCache[item.name] = item.buffer || [];
                });
                buildQueue();
            }

            function buildQueue() {
                var container = document.getElementById("queue-list");
                // Collect all buffer entries from all agents
                var allEntries = [];
                Object.keys(queueBufferCache).forEach(function (agentName) {
                    var entries = queueBufferCache[agentName] || [];
                    entries.forEach(function (entry) {
                        allEntries.push({ agent: agentName, entry: entry });
                    });
                });

                // Sort by age descending (newest first = smallest age_ms)
                allEntries.sort(function (a, b) {
                    return (a.entry.age_ms || 0) - (b.entry.age_ms || 0);
                });

                if (allEntries.length === 0) {
                    container.innerHTML =
                        '<div class="queue-empty">' +
                        '<div class="empty-icon">&#9745;</div>' +
                        "<div>No items pending review</div>" +
                        '<div style="font-size:11px;margin-top:4px;opacity:0.6">Buffer entries will appear here when agents produce responses</div>' +
                        "</div>";
                    return;
                }

                var html = "";
                var now = Date.now();
                allEntries.forEach(function (item) {
                    var agentName = item.agent;
                    var entry = item.entry;
                    var actionCls =
                        entry.action === "evaluate" ? "evaluate" : "propose";
                    var actionLabel =
                        entry.action === "evaluate" ? "EVAL" : "PROP";
                    var shortJob = entry.job_id ? entry.job_id.slice(-8) : "";
                    var ageSec = Math.round((entry.age_ms || 0) / 1000);
                    var ageStr =
                        ageSec >= 60
                            ? Math.floor(ageSec / 60) +
                              "m " +
                              (ageSec % 60) +
                              "s"
                            : ageSec + "s";

                    // Countdown to auto-release
                    var countdownHtml = "";
                    if (entry.release_in_ms != null) {
                        var relSec = Math.ceil(entry.release_in_ms / 1000);
                        if (relSec > 0) {
                            countdownHtml =
                                '<span class="queue-countdown">' +
                                relSec +
                                "s</span>";
                        } else {
                            countdownHtml =
                                '<span class="queue-countdown overdue">overdue</span>';
                        }
                    }

                    html +=
                        '<div class="queue-entry">' +
                        '<span class="queue-agent">' +
                        esc(agentName) +
                        "</span>" +
                        '<span class="queue-action ' +
                        actionCls +
                        '">' +
                        actionLabel +
                        "</span>" +
                        '<span class="queue-round">R' +
                        (entry.round != null ? entry.round : "?") +
                        "</span>" +
                        '<span class="queue-job">' +
                        esc(shortJob) +
                        "</span>" +
                        '<span class="queue-timers">' +
                        '<span class="queue-age" title="Time in buffer">' +
                        ageStr +
                        "</span>" +
                        countdownHtml +
                        "</span>" +
                        '<span class="queue-btns">' +
                        (!entry.stopped
                            ? "<button onclick=\"queueRelease('" +
                              escJsAttr(agentName) +
                              "','" +
                              escJsAttr(entry.id) +
                              "')\">Release</button>"
                            : "") +
                        '<button class="q-stop" onclick="queueStop(\'' +
                        escJsAttr(agentName) +
                        "','" +
                        escJsAttr(entry.id) +
                        "')\">Stop</button>" +
                        '<button class="q-view" onclick="queueView(\'' +
                        escJsAttr(agentName) +
                        "','" +
                        escJsAttr(entry.action) +
                        "','" +
                        escJsAttr(entry.job_id || "") +
                        "','" +
                        escJsAttr(entry.id) +
                        "')\">View</button>" +
                        "</span>" +
                        "</div>";
                });
                container.innerHTML = html;
            }

            async function queueAction(agentName, entryId, action) {
                // Optimistically remove the entry from cache to prevent flash of stale state
                if (queueBufferCache[agentName]) {
                    queueBufferCache[agentName] = queueBufferCache[
                        agentName
                    ].filter(function (e) {
                        return e.id !== entryId;
                    });
                    if (currentView === "queue") buildQueue();
                }
                try {
                    var resp = await fetch(
                        "/api/agents/" +
                            encodeURIComponent(agentName) +
                            "/buffer/" +
                            encodeURIComponent(entryId) +
                            "/" +
                            action,
                        { method: "POST" },
                    );
                    if (!resp.ok) {
                        console.error(
                            "Queue " + action + " failed: HTTP " + resp.status,
                        );
                    }
                } catch (e) {
                    console.error("Queue " + action + " failed:", e);
                }
                // Re-fetch authoritative buffer state
                queueBufferCache[agentName] = await fetchBuffer(agentName);
                if (currentView === "queue") buildQueue();
            }

            function queueRelease(agentName, entryId) {
                queueAction(agentName, entryId, "release");
            }

            function queueStop(agentName, entryId) {
                queueAction(agentName, entryId, "stop");
            }

            function queueView(agentName, action, jobId, entryId) {
                showTaskDetail(agentName, action, jobId, entryId, true);
            }

            // ---- Agent detail modal ----

            var agentModalState = null; // { name, tab, chatHistory, configDebounce, sessionId }
            var agentModalSessionCounter = 0;

            function openAgentModal(name) {
                agentModalOpener = document.activeElement;
                agentModalSessionCounter++;

                    name: name,
                    tab: "overview",
                    chatHistory: [],

                    sessionId: agentModalSessionCounter,

                // Prevent focus from escaping the modal into the main app

                renderAgentModalTabs("overview");
                loadAgentModalTab("overview");

                var closeBtn = document.querySelector(".am-close");

            }

            function closeAgentModal() {
                flushModalConfig();
                document.getElementById("agent-modal").classList.remove("open");
                agentModalState = null;
                // Restore inert state on the main app
                var mainContent = document.querySelector(".main");
                if (mainContent) mainContent.removeAttribute("inert");
                var topbar = document.querySelector(".topbar");
                if (topbar) topbar.removeAttribute("inert");

                if (agentModalOpener && agentModalOpener.focus) {

            function renderAgentModalHeader(name) {

            async function loadAgentModalTab(tab) {

            function isModalStale(name, tab, sessionId) {
                if (isSessionStale(name, sessionId)) return true;
                return agentModalState.tab !== tab;

            function isSessionStale(name, sessionId) {
                if (!agentModalState) return true;
                if (agentModalState.name !== name) return true;
                if (
                    sessionId != null &&
                    agentModalState.sessionId !== sessionId
                )

            function drawScoreSparkline(scores) {
                var canvas = document.getElementById("am-score-canvas");
                if (!canvas) return;
                var ctx = canvas.getContext("2d");
                var w = canvas.offsetWidth;
                var h = 80;
                canvas.width = w * (window.devicePixelRatio || 1);
                canvas.height = h * (window.devicePixelRatio || 1);
                ctx.scale(
                    window.devicePixelRatio || 1,
                    window.devicePixelRatio || 1,
                );

                var vals = scores.map(function (s) {
                    return s.score;
                });
                var minV = Math.min.apply(null, vals);
                var maxV = Math.max.apply(null, vals);
                var range = maxV - minV || 1;
                var pad = 4;

                // Grid lines
                ctx.strokeStyle = "rgba(48,54,61,0.4)";
                ctx.lineWidth = 0.5;
                for (var gi = 0; gi <= 4; gi++) {
                    var gy = pad + ((h - 2 * pad) * gi) / 4;
                    ctx.beginPath();
                    ctx.moveTo(0, gy);
                    ctx.lineTo(w, gy);
                    ctx.stroke();
                }

                // Score line
                ctx.beginPath();
                ctx.strokeStyle = "#58a6ff";
                ctx.lineWidth = 1.5;
                ctx.lineJoin = "round";
                for (var i = 0; i < vals.length; i++) {
                    var x =
                        vals.length > 1
                            ? (i / (vals.length - 1)) * (w - 2 * pad) + pad
                            : w / 2;
                    var y =
                        h - pad - ((vals[i] - minV) / range) * (h - 2 * pad);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // Dots
                ctx.fillStyle = "#58a6ff";
                for (var i = 0; i < vals.length; i++) {
                    var x =
                        vals.length > 1
                            ? (i / (vals.length - 1)) * (w - 2 * pad) + pad
                            : w / 2;
                    var y =
                        h - pad - ((vals[i] - minV) / range) * (h - 2 * pad);
                    ctx.beginPath();
                    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Labels
                ctx.fillStyle = "rgba(139,148,158,0.7)";
                ctx.font = "9px SF Mono, monospace";
                ctx.textAlign = "right";
                ctx.fillText(maxV.toFixed(2), w - 2, pad + 8);
                ctx.fillText(minV.toFixed(2), w - 2, h - pad);
            }

            // ── Chat tab ──
            function renderChatTab(name, container) {
                var html =
                    '<div class="am-chat">' +
                    '<div class="am-chat-messages" id="am-chat-messages">';
                // Render existing chat history
                agentModalState.chatHistory.forEach(function (m) {
                    html += chatMsgHtml(m.role, m.content, name);
                });
                if (agentModalState.chatHistory.length === 0) {
                    html +=
                        '<div style="padding:24px;text-align:center;color:var(--text-dim);font-size:13px">' +
                        "Send a message to chat directly with <strong>" +
                        esc(name) +
                        "</strong>'s LLM.</div>";

                html +=
                    "</div>" +
                    '<div class="am-chat-input-row">' +
                    '<textarea class="am-chat-input" id="am-chat-input" placeholder="Type a message…" rows="1" ' +
                    "onkeydown=\"if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage();}\"></textarea>" +
                    '<button class="am-chat-send" id="am-chat-send" onclick="sendChatMessage()">Send</button>' +
                    "</div></div>";
                container.innerHTML = html;
                scrollChatBottom();

            function chatMsgHtml(role, content, agentName) {
                var isUser = role === "user";
                var avatarCls = isUser ? "user" : "agent";
                var avatarLetter = isUser ? "U" : esc(agentName.charAt(0));
                var roleLabel = isUser ? "You" : esc(agentName);
                return (
                    '<div class="am-chat-msg">' +
                    '<div class="am-chat-avatar ' +
                    avatarCls +
                    '">' +
                    avatarLetter +
                    "</div>" +
                    '<div class="am-chat-body">' +
                    '<div class="am-chat-role">' +
                    roleLabel +
                    "</div>" +
                    '<div class="am-chat-text">' +
                    esc(content) +
                    "</div>" +
                    "</div></div>"
                );
            }

            function scrollChatBottom() {
                var el = document.getElementById("am-chat-messages");
                if (el) el.scrollTop = el.scrollHeight;
            }

            async function sendChatMessage() {
                if (!agentModalState) return;
                var input = document.getElementById("am-chat-input");
                var sendBtn = document.getElementById("am-chat-send");
                var msg = (input.value || "").trim();
                if (!msg) return;

                var sessionName = agentModalState.name;
                var sessionId = agentModalState.sessionId;
                var sessionHistory = agentModalState.chatHistory;
                sessionHistory.push({ role: "user", content: msg });
                input.value = "";
                input.disabled = true;
                sendBtn.disabled = true;

                // Append user message to DOM
                var container = document.getElementById("am-chat-messages");
                // Remove empty-state placeholder if present
                var placeholder = container.querySelector(
                    '[style*="text-align:center"]',
                );
                if (placeholder) placeholder.remove();
                container.insertAdjacentHTML(
                    "beforeend",
                    chatMsgHtml("user", msg, sessionName),
                );
                container.insertAdjacentHTML(
                    "beforeend",
                    '<div class="am-chat-thinking" id="am-chat-thinking">Thinking…</div>',
                );
                scrollChatBottom();

                try {
                    // Build messages array for the API
                    var apiMessages = sessionHistory.map(function (m) {
                        return { role: m.role, content: m.content };
                    });
                    var chatAbort = new AbortController();
                    var chatTimeout = setTimeout(function () {
                        chatAbort.abort();
                    }, 120000);
                    var resp = await fetch(
                        "/api/agents/" +
                            encodeURIComponent(sessionName) +
                            "/chat",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ messages: apiMessages }),
                            signal: chatAbort.signal,
                        },
                    );
                    clearTimeout(chatTimeout);
                    var data = await resp.json();
                    // Bail if session changed (different agent or re-opened modal)
                    if (isSessionStale(sessionName, sessionId)) return;

                    // Always push reply into session history (survives tab switches)
                    if (resp.ok) {
                        var reply = data.response || "";
                        sessionHistory.push({
                            role: "assistant",
                            content: reply,
                        });
                    }
                    // Only update DOM if Chat tab is still active
                    if (!isModalStale(sessionName, "chat", sessionId)) {
                        var thinkingEl =
                            document.getElementById("am-chat-thinking");
                        if (thinkingEl) thinkingEl.remove();
                        if (resp.ok) {
                            container.insertAdjacentHTML(
                                "beforeend",
                                chatMsgHtml("assistant", reply, sessionName),
                            );
                        } else {
                            container.insertAdjacentHTML(
                                "beforeend",
                                '<div style="padding:6px 0;color:var(--red);font-size:12px">Error: ' +
                                    esc(data.response || "Request failed") +
                                    "</div>",
                            );
                        }
                    }
                } catch (e) {
                    if (isSessionStale(sessionName, sessionId)) return;
                    if (!isModalStale(sessionName, "chat", sessionId)) {
                        var thinkingEl2 =
                            document.getElementById("am-chat-thinking");
                        if (thinkingEl2) thinkingEl2.remove();
                        var errMsg =
                            e.name === "AbortError"
                                ? "Request timed out"
                                : String(e);
                        container.insertAdjacentHTML(
                            "beforeend",
                            '<div style="padding:6px 0;color:var(--red);font-size:12px">Error: ' +
                                esc(errMsg) +
                                "</div>",
                        );
                    }
                } finally {
                    // Always restore the composer, even if modal switched
                    if (input) input.disabled = false;
                    if (sendBtn) sendBtn.disabled = false;
                    if (!isModalStale(sessionName, "chat", sessionId)) {
                        input.focus();
                    }
                    scrollChatBottom();
                }
            }

            function flushModalConfig() {
                if (!agentModalState) return;
