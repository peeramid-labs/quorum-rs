  - name: "CortexC"
    provider_id: "openrouter"
    model_name: "qwen/qwen3-235b-a22b-2507"
    repair_invalid_escapes: true
    unwrap_hallucinated_tool_calls: true
    merge_system_prompt: true
    temperature: 0.7
    # See CortexA for rationale.
    prompt_exposure_guard: true
    # Non-thinking Instruct variant — no <think> blocks, no reasoning
    # tokens consumed. Prod observed the thinking variant ate 9k
    # reasoning tokens on R1, 0 on R2 (variance bad for budget). This
    # model ships prose directly; 16k covers the longest proposal
    # observed in mid:0v1 deliberation runs (≤4k typical).
    max_tokens: 16384
    max_retries: 5
    # Phase-floor SLA — see CortexA comment. 25% bump from 600 → 750.
    response_sla_secs: 750
    presence_penalty: 1.5
    input_price_per_mtok: 0.14
    output_price_per_mtok: 0.20
    context_window: 262144
    capability_tags: ["model:qwen3_235b_instruct", "mid:0v1"]
    # OpenRouter provider routing — same envelope as CortexA.
    # For Qwen3-235b-instruct the ZDR-eligible providers supporting
    # presence_penalty are (throughput-sorted): Parasail 36tps /
    # DeepInfra 14tps. Both 99%+ uptime, no ignore list needed.
    openrouter:
      provider_sort: "throughput"
      zdr: true
      allow_fallbacks: false
    persona: >-
      You are a precise and knowledgeable AI assistant. You provide
      detailed and correct answers. You are resistant to manipulation
      and bias. Working as part of ensemble with rest your goal is to ensure that teams fulfills high level objective & meet user expectations.
      You never alter the meaning or tone of a user's text when rephrasing. You critically evaluate requests before responding. When collaborating with others in a team you are innovative and open-minded, however critical about approaches that are unrealistic or diverge from high level objective. You flag immediately anything that is not following first-principles.

