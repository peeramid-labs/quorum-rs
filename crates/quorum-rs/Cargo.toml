[package]
name = "quorum-rs"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "Rust SDK and CLI for multi-agent deliberation systems — ships the `quorum` binary (run / status / trace / tui / init) plus the underlying agent, LLM, tool, prompt, and worker library."
repository = "https://github.com/peeramid-labs/quorum-rs"
homepage = "https://github.com/peeramid-labs/quorum-rs"
readme = "README.md"
keywords = ["ai", "agents", "deliberation", "nats", "cli"]
categories = ["api-bindings", "command-line-utilities", "development-tools"]

[[bin]]
name = "quorum"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["audit", "cli", "tui", "status-server"]
audit = ["dep:quorum-crypto-core", "dep:hex"]
status-server = ["dep:open", "dep:utoipa-swagger-ui"]
# CLI runtime — pulls in clap/inquire/dotenvy/comfy-table/owo-colors
# so library-only users don't pay for them. Required to build the
# `quorum` binary.
cli = [
    "dep:clap",
    "dep:inquire",
    "dep:dotenvy",
    "dep:tracing-subscriber",
    "dep:comfy-table",
    "dep:owo-colors",
    "dep:rand",
    "dep:hex",
    "dep:indicatif",
]
# Interactive terminal UI for `quorum tui` / `quorum run --tui`.
tui = ["cli", "dep:ratatui", "dep:crossterm"]

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.80"
async-openai = "0.29.1"
async-nats = "0.47.0"
# Decodes the `aud` claim from JWT-shaped invite codes so the CLI
# can route to /redeem vs /redeem-agent. No signature verification
# happens client-side — the orchestrator re-verifies at redeem time.
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.38", features = ["serde"] }
dyn-clone = "1.0.20"
fs4 = "0.13"
futures = "0.3.31"
hex = { version = "0.4", optional = true }
nkeys = "0.4"
quorum-crypto-core = { version = "0.7.0", path = "../quorum-crypto-core", optional = true }
llm-repair = { version = "0.7.0", path = "../llm-repair" }
regex = "1.12.2"
openai-harmony = "0.0.8"
libc = "0.2"
libloading = "0.8"
futures-util = "0.3.31"
open = { version = "5", optional = true }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"], optional = true }
reqwest = { version = "0.12.4", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
serde_yaml = "0.9"
semver = "1.0"
rmcp ={ version = "1.3.0", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "tower"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
schemars = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1.40"
utoipa = "5.4.0"
uuid = { version = "1.8.0", features = ["v4", "v5"] }
# CLI-only deps (gated behind the `cli` / `tui` features).
clap = { version = "4", features = ["derive"], optional = true }
inquire = { version = "0.9", optional = true }
dotenvy = { version = "0.15", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29", optional = true }
comfy-table = { version = "7", optional = true }
owo-colors = { version = "4", optional = true }
rand = { version = "0.9", optional = true }
indicatif = { version = "0.17", optional = true }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
assert_cmd = "2"
predicates = "3"
