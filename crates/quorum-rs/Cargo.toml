[package]
name = "quorum-rs"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "Rust SDK for building multi-agent deliberation systems — agent traits, LLM dispatch, tool framework, prompt sets, worker runtime"
repository = "https://github.com/peeramid-labs/quorum-rs"
homepage = "https://github.com/peeramid-labs/quorum-rs"
readme = "README.md"
keywords = ["ai", "agents", "deliberation", "nats", "sdk"]
categories = ["api-bindings", "development-tools"]

[features]
default = ["audit"]
audit = ["dep:nsed-crypto-core", "dep:hex"]
status-server = ["dep:open", "dep:utoipa-swagger-ui"]

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.80"
async-openai = "0.29.1"
async-nats = "0.47.0"
bytes = "1.11.1"
chrono = { version = "0.4.38", features = ["serde"] }
dyn-clone = "1.0.20"
fs4 = "0.13"
futures = "0.3.31"
hex = { version = "0.4", optional = true }
nkeys = "0.4"
nsed-crypto-core = { package = "quorum-crypto-core", version = "0.6.0", path = "../quorum-crypto-core", optional = true }
llm-repair = { version = "0.6.0", path = "../llm-repair" }
regex = "1.12.2"
openai-harmony = "0.0.8"
libc = "0.2"
libloading = "0.8"
futures-util = "0.3.31"
open = { version = "5", optional = true }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"], optional = true }
reqwest = { version = "0.12.4", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
serde_yaml = "0.9"
rmcp = { version = "1.3.0", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "tower"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
schemars = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1.40"
utoipa = "5.4.0"
uuid = { version = "1.8.0", features = ["v4", "v5"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
