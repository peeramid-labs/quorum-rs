[package]
name = "quorum-crypto-core"
version = "0.7.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
description = "Cryptographic primitives and traits for agent signing and verification (ed25519, secp256k1, SHA3)"
repository = "https://github.com/peeramid-labs/quorum-rs"
readme = "README.md"
keywords = ["cryptography", "signing", "ed25519", "secp256k1", "audit"]
categories = ["cryptography", "authentication"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "sha256", "ecdsa-core"] }
nkeys = { version = "0.4", optional = true }
rand = "0.8"
schemars = { version = "1", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"
utoipa = { version = "5.4.0", optional = true }

# On wasm32-unknown-unknown, `getrandom` (pulled via rand/ed25519-dalek/k256)
# needs its `js` backend or it refuses to compile. Target-scoped so native
# builds are unaffected. Build the core for wasm with `--no-default-features`
# (the `device`/nkeys feature has no wasm `KeyPair::new_user`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["device"]
# Device identity (NATS user nkey) for self-serve register. Pulls `nkeys`.
# wasm consumers that don't register can `default-features = false` to drop it.
device = ["dep:nkeys"]
# JSON-schema / OpenAPI derives on the wire types, for consumers that expose
# them in an HTTP API. Off by default so a lean or wasm build does not carry
# schema machinery it never serves.
schema = ["dep:schemars", "dep:utoipa"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
