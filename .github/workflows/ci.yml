name: CI

on:
  push:
    branches: [dev]
  pull_request:
    # `feat/**` lets stacked PRs (e.g. PR-B targets `feat/foo`,
    # PR-A targets `dev`) trigger CI on both legs of the stack.
    branches: [dev, 'feat/**']
    types: [opened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Fast lint & audit (no NATS, no instrumentation) ────────────────
  lint:
    name: Lint & Audit
    if: >
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: "ci-lint-v1"

      - name: Install Tools (binstall)
        uses: cargo-bins/cargo-binstall@v1.17.9

      - name: Install cargo-deny
        run: |
          cargo binstall --no-confirm --force cargo-deny
          cargo deny --version

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: License & Advisory Audit
        run: cargo deny check

  # ── Supply-chain freshness (only when Cargo.lock changes) ──────────
  dep-age:
    name: Dependency Age Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Need enough history for the dep-age script to resolve the
          # diff target (PR base or HEAD~1 on push events) via
          # `git show <ref>:Cargo.lock`. Depth 2 covers push events;
          # for PR events GitHub Actions already fetches the base
          # commit as part of the merge-commit setup.
          fetch-depth: 2

      - name: Check if Cargo.lock changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lockfile:
              - 'Cargo.lock'

      - name: Dependency Age Check (supply-chain freshness)
        if: steps.filter.outputs.lockfile == 'true'
        env:
          # Only set on pull_request events; empty on pushes.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          target_arg=""
          if [ -n "${PR_BASE_SHA}" ]; then
            target_arg="--target ${PR_BASE_SHA}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            target_arg="--target HEAD~1"
          fi
          # shellcheck disable=SC2086
          python3 scripts/check-dep-age.py --min-age-days 7 $target_arg

      - name: Skip (Cargo.lock unchanged)
        if: steps.filter.outputs.lockfile != 'true'
        run: echo "Cargo.lock unchanged — skipping dep-age check"

  # ── Tests (NATS required, no coverage instrumentation) ─────────────
  # Coverage publishing moved to coverage.yml on workflow_dispatch —
  # per-push CI must never depend on git push auth to a Pages host.
  test:
    name: Test
    if: >
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Start NATS (JetStream)
        run: |
          # Attach NATS to the same per-workflow network as this job container,
          # so it is reachable by DNS alias "nats" without publishing host ports.
          # Unique name avoids collisions across parallel runs/retries.
          JOB_CT=$(hostname)
          JOB_NET=$(docker inspect "$JOB_CT" \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          NAME="nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d \
            --name "$NAME" \
            --network "$JOB_NET" \
            --network-alias nats \
            nats:alpine -js -m 8222
          echo "NATS_NAME=$NAME" >> $GITHUB_ENV

          # Wait for NATS HTTP monitoring to be ready (probe via DNS alias)
          echo "Waiting for NATS..."
          for i in $(seq 1 30); do
            if docker run --rm --network "$JOB_NET" curlimages/curl:latest \
               -sf http://nats:8222/varz > /dev/null 2>&1; then
              echo "NATS is up."
              exit 0
            fi
            if ! docker ps --filter "name=$NAME" --filter "status=running" -q | grep -q .; then
              echo "❌ NATS container died. Logs:"
              docker logs "$NAME"
              exit 1
            fi
            sleep 1
          done
          echo "❌ NATS failed to respond within 30s. Logs:"
          docker logs "$NAME"
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: "ci-test-v1"

      - name: Install ffmpeg
        # The HLS pipeline shells out to it. Without it the transcode tests
        # skip, and the one thing a fake transcoder cannot check — that the
        # argument vector we actually run produces a playlist — goes untested.
        #
        # This runs on a self-hosted Forgejo runner whose image we choose, so
        # it assumes as little about that image as it can: ffmpeg may already
        # be there, the job may be root with no `sudo` binary, and the package
        # manager may be apt or apk. `sudo` appears nowhere else in this file,
        # so requiring it here would be this step's own assumption.
        #
        # The cheapest arrangement is to bake ffmpeg into the runner image —
        # the first branch then short-circuits and this costs nothing per run,
        # instead of ~45s of apt.
        run: |
          set -eu
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already in the runner image:"
            ffmpeg -version | head -1
            exit 0
          fi
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              SUDO=sudo
            else
              echo "no ffmpeg, not root, and no sudo: bake ffmpeg into the runner image" >&2
              exit 1
            fi
          fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends ffmpeg
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache ffmpeg
          else
            echo "no ffmpeg and no known package manager: bake it into the runner image" >&2
            exit 1
          fi
          ffmpeg -version | head -1

      - name: Set up Environment Variables
        run: |
          # NATS reachable via DNS alias on per-workflow network
          echo "NATS_URL=nats://nats:4222" >> $GITHUB_ENV
          echo "RUST_LOG=info" >> $GITHUB_ENV
          echo "CARGO_BUILD_JOBS=2" >> $GITHUB_ENV
          # This job provides a broker and a transcoder, so a test that skips
          # for want of either is a test that silently stopped covering
          # anything. Fail instead.
          echo "REQUIRE_NATS=1" >> $GITHUB_ENV
          echo "REQUIRE_FFMPEG=1" >> $GITHUB_ENV

      - name: Run Tests
        run: cargo test --workspace

      - name: Cleanup NATS
        if: always()
        run: docker rm -f "${NATS_NAME:-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" || true

  typos:
    name: Spell Check
    if: >
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
