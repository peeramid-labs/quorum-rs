name: Pre-Release

# Publishes a pre-release (RC / alpha / beta) of one workspace crate
# to crates.io and cuts a matching GitHub pre-release.
#
# Lifecycle vs. the stable release flow:
#   - Stable releases go through release-prepare → release-publish
#     (PR-driven, version bump on dev, single canonical tag).
#   - Pre-releases skip the PR ceremony — they're typically short-
#     lived, sometimes mutable, and we don't want every `-rc.N`
#     iteration to land as a permanent commit on dev. Instead the
#     workflow bumps Cargo.toml on a TRANSIENT branch, tags the
#     bump commit, pushes ONLY the tag, and discards the branch.
#     `dev` keeps its release version untouched until the eventual
#     stable bump lands via release-prepare.
#
# Mutability matches nsed's parent convention: re-running with the
# same `--tag` deletes the prior tag + GitHub Release first, so an
# author can iterate on the same `-rc.N` name during validation.
#
# Triggered exclusively by `workflow_dispatch`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pre-release tag (e.g. "v0.7.0-rc.1" for "all", or "llm-repair-v0.7.0-rc.1" for a per-crate RC)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pre-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Pre-Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      crate: ${{ steps.parse.outputs.crate }}
    steps:
      # Tag shape lives in two regexes:
      #   - per-crate:  <crate>-vX.Y.Z-<id>(.N)*
      #   - workspace:  vX.Y.Z-<id>(.N)*
      # The pre-release identifier (`-<id>(.N)*`) is REQUIRED so the
      # workflow refuses to publish a stable tag through the
      # pre-release pipeline by accident — stable tags belong to
      # release-publish.yml.
      - name: Parse and validate tag shape
        id: parse
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          # OCI tag length cap (also a sanity ceiling for crates.io).
          if [ "${#TAG}" -gt 128 ]; then
            echo "::error::Tag exceeds 128 character limit (got ${#TAG})"
            exit 1
          fi
          # Refuse stable semver — pre-release identifier is required.
          if echo "$TAG" | grep -qE '^(llm-repair-|quorum-crypto-core-|quorum-rs-)?v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG looks like a stable release — use release-publish.yml. Pre-release identifier required (e.g. -rc.1, -alpha.2)."
            exit 1
          fi
          PRE_RE='[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          case "$TAG" in
            llm-repair-v*|quorum-crypto-core-v*|quorum-rs-v*)
              CRATE="${TAG%-v*}"
              VERSION="${TAG##*-v}"
              ;;
            v*)
              CRATE="all"
              VERSION="${TAG#v}"
              ;;
            *)
              echo "::error::Unrecognised tag shape: $TAG"; exit 1 ;;
          esac
          if ! echo "$VERSION" | grep -qE "^${PRE_RE}\$"; then
            echo "::error::VERSION ($VERSION) is not a valid pre-release semver — must look like X.Y.Z-rc.1 / X.Y.Z-alpha.2"
            exit 1
          fi
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "crate=$CRATE"  >> "$GITHUB_OUTPUT"
          echo "Pre-release: $TAG (crate=$CRATE, version=$VERSION)"

  preflight:
    name: Preflight (token + workspace state)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      # Fail fast before any side effect if the token is missing.
      # Same rationale as release-publish.yml's preflight: don't
      # leave a phantom tag behind when there's no path to crates.io.
      - name: CARGO_REGISTRY_TOKEN must be configured
        env:
          HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN repository secret is missing or empty. Configure it in Settings → Secrets → Actions, then re-run."
            exit 1
          fi

  publish:
    name: Bump → Tag → Publish (${{ needs.validate.outputs.crate }} @ ${{ needs.validate.outputs.version }})
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pre-releases always cut from the default branch — same
          # safety rationale as release-publish.yml's dispatch path.
          # `github.sha` would let the operator publish from any
          # ref via the manual-trigger UI.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.17.9

      - name: Install cargo-edit
        run: cargo binstall --no-confirm cargo-edit

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: pre-release-${{ needs.validate.outputs.tag }}

      # Bump on a transient branch — never pushed, so `dev` stays
      # clean. The tag we push points at this commit; the branch
      # name is purely local. See module-top comment for why RCs
      # don't get a permanent dev commit.
      - name: Bump Cargo.toml on transient branch
        env:
          CRATE: ${{ needs.validate.outputs.crate }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "rc-bump-$$"
          case "$CRATE" in
            llm-repair)         cargo set-version -p llm-repair "$VERSION" ;;
            quorum-crypto-core) cargo set-version -p quorum-crypto-core "$VERSION" ;;
            quorum-rs)          cargo set-version -p quorum-rs "$VERSION" ;;
            all)                cargo set-version --workspace "$VERSION" ;;
            *) echo "::error::Unknown crate slug: $CRATE"; exit 1 ;;
          esac
          cargo generate-lockfile
          git add -u Cargo.toml Cargo.lock crates/*/Cargo.toml
          git commit -m "chore(pre-release): ${VERSION}"

      # Pre-release tags are mutable per convention — force-deletes
      # the prior tag on origin (if any) so an operator can iterate
      # on the same `-rc.N` name during validation. Stable releases
      # do NOT have this behaviour — release-publish.yml refuses to
      # overwrite tags.
      - name: Force-push pre-release tag
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          # Remove the remote tag if present, then create + push fresh.
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true
          git tag -f "$TAG" -m "Pre-release ${TAG}"
          git push origin "$TAG"

      # Cargo handles pre-release versions on crates.io natively —
      # `cargo publish` accepts `X.Y.Z-rc.1` and the registry stores
      # it as a separate version that `cargo add` won't pick up by
      # default (semver opt-in required). Same per-crate topological
      # logic as release-publish.yml so the publish order is
      # deterministic regardless of which crate the RC targets.
      - name: Publish llm-repair (RC)
        if: ${{ needs.validate.outputs.crate == 'all' || needs.validate.outputs.crate == 'llm-repair' }}
        run: |
          set -o pipefail
          out=$(cargo publish -p llm-repair 2>&1) && rc=0 || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          # crates.io rejects re-uploading the same version — that's
          # the only failure mode we treat as a no-op (operator
          # re-ran the workflow after a successful publish).
          if printf '%s' "$out" | grep -qE 'crate version `[^`]+` is already uploaded'; then
            echo "::notice::llm-repair@${{ needs.validate.outputs.version }} already on crates.io — treating as no-op"
            exit 0
          fi
          exit "$rc"

      # No explicit index-wait step between publishes: `cargo publish`
      # (Rust ≥ 1.66) blocks until the new version is fetchable from
      # the sparse index before exiting — that's the
      # `note: waiting for <crate> v<X.Y.Z> to be available …`
      # line in the publish output. A separate poll against the HTTP
      # API was redundant with that built-in wait AND prone to false
      # negatives (anonymous GH-Actions traffic gets rate-limited /
      # User-Agent-checked on /api/v1/crates), so it blocked
      # otherwise-successful releases. If we ever need an extra
      # safety margin add `sleep 30` here — don't reintroduce a
      # polling loop without switching to the sparse index endpoint.

      - name: Publish quorum-crypto-core (RC)
        if: ${{ needs.validate.outputs.crate == 'all' || needs.validate.outputs.crate == 'quorum-crypto-core' }}
        run: |
          set -o pipefail
          out=$(cargo publish -p quorum-crypto-core 2>&1) && rc=0 || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if printf '%s' "$out" | grep -qE 'crate version `[^`]+` is already uploaded'; then
            echo "::notice::quorum-crypto-core@${{ needs.validate.outputs.version }} already on crates.io — treating as no-op"
            exit 0
          fi
          exit "$rc"

      # See note above re: cargo's built-in publish-wait — no
      # explicit poll step needed before publishing the next crate.

      - name: Publish quorum-rs (RC)
        if: ${{ needs.validate.outputs.crate == 'all' || needs.validate.outputs.crate == 'quorum-rs' }}
        run: |
          set -o pipefail
          out=$(cargo publish -p quorum-rs 2>&1) && rc=0 || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if printf '%s' "$out" | grep -qE 'crate version `[^`]+` is already uploaded'; then
            echo "::notice::quorum-rs@${{ needs.validate.outputs.version }} already on crates.io — treating as no-op"
            exit 0
          fi
          exit "$rc"

  release:
    name: Create GitHub Pre-Release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      # Same mutability rule as the tag itself — re-running with the
      # same `--tag` should overwrite the existing pre-release. The
      # forgejo runner ships without the `gh` CLI, so we hit the
      # forge's REST directly. `github.api_url` resolves to whichever
      # forge fired the run.
      - name: Delete existing forge release (if any)
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          REL_ID=$(curl -fsSL \
            -H "Authorization: token ${FORGE_TOKEN}" \
            "${FORGE_API}/repos/${REPO}/releases/tags/${TAG}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id",""))' \
            2>/dev/null || echo "")
          if [ -n "$REL_ID" ]; then
            curl -fsSL -X DELETE \
              -H "Authorization: token ${FORGE_TOKEN}" \
              "${FORGE_API}/repos/${REPO}/releases/${REL_ID}" || true
          fi

      - name: Create forge Pre-Release
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          CRATE: ${{ needs.validate.outputs.crate }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # `github.sha` is the workflow-dispatch SHA (default-branch
          # HEAD when the dispatch fired), NOT the tagged commit. The
          # publish job pushes the tag at a transient bump commit
          # ON TOP of dev, so the two diverge by exactly that bump.
          # Resolve the tag's actual commit so the release notes
          # point at the artifact we just shipped.
          TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")

          # Install hint must reflect what actually got published.
          # `CRATE=all` ships the whole workspace at $VERSION, so
          # the hint enumerates each crate; otherwise it's a single
          # `cargo add` for the targeted crate.
          if [ "$CRATE" = "all" ]; then
            HEADER="Workspace-wide pre-release at \`${VERSION}\`."
            INSTALL_LINES=$(printf 'cargo add llm-repair@%s\ncargo add quorum-crypto-core@%s\ncargo add quorum-rs@%s' \
              "$VERSION" "$VERSION" "$VERSION")
          else
            HEADER=$(printf 'Pre-release of `%s` at `%s`.' "$CRATE" "$VERSION")
            INSTALL_LINES=$(printf 'cargo add %s@%s' "$CRATE" "$VERSION")
          fi

          NOTES=$(printf '%s\n\n⚠️ **This is a pre-release** — not recommended for production use.\n\nInstall (semver opt-in required for pre-releases):\n\n```\n%s\n```\n\nCommit: %s' \
            "$HEADER" "$INSTALL_LINES" "$TAG_COMMIT")

          # JSON-encode body via env+python so newlines + backticks
          # survive intact; printf'ing into a JSON string literal
          # would break on the embedded ``` fences.
          export TAG NOTES
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"tag_name":os.environ["TAG"],"name":os.environ["TAG"],"body":os.environ["NOTES"],"prerelease":True,"draft":False}))')
          curl -fsSL -X POST \
            -H "Authorization: token ${FORGE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${FORGE_API}/repos/${REPO}/releases" \
            >/dev/null
