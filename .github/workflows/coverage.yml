name: Update Coverage

# Manually-triggered coverage publish. Runs the workspace tests under
# `cargo llvm-cov` and force-pushes the HTML report + badge JSON to
# the `gh-pages` branch of THIS repo (whichever host fired the
# workflow — forgejo or github). Split out of per-push CI so a
# transient push-auth failure on the Pages host can never block dev.
#
# On forgejo, the gh-pages branch is reachable via raw file URLs:
#   http://<forgejo-host>/peeramid-labs/quorum/raw/branch/gh-pages/index.html

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: Run Coverage & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Start NATS (JetStream)
        run: |
          JOB_CT=$(hostname)
          JOB_NET=$(docker inspect "$JOB_CT" \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          NAME="nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d \
            --name "$NAME" \
            --network "$JOB_NET" \
            --network-alias nats \
            nats:alpine -js -m 8222
          echo "NATS_NAME=$NAME" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if docker run --rm --network "$JOB_NET" curlimages/curl:latest \
               -sf http://nats:8222/varz > /dev/null 2>&1; then
              echo "NATS is up."
              exit 0
            fi
            sleep 1
          done
          docker logs "$NAME"
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: "ci-coverage-v1"

      - name: Install Tools (binstall)
        uses: cargo-bins/cargo-binstall@v1.17.9

      - name: Install cargo-llvm-cov
        run: |
          cargo binstall --no-confirm --force cargo-llvm-cov
          cargo llvm-cov --version

      - name: Set up Environment Variables
        run: |
          echo "NATS_URL=nats://nats:4222" >> $GITHUB_ENV
          echo "RUST_LOG=info" >> $GITHUB_ENV
          echo "CARGO_BUILD_JOBS=2" >> $GITHUB_ENV

      - name: Run Tests & Coverage
        run: |
          IGNORE_RE="(src/main\.rs|src/bin/)"
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report --all-targets
          mkdir -p coverage
          cargo llvm-cov report \
            --ignore-filename-regex "$IGNORE_RE" \
            --cobertura --output-path coverage/cobertura.xml
          cargo llvm-cov report \
            --ignore-filename-regex "$IGNORE_RE" \
            --html --output-dir coverage

      - name: Extract coverage
        id: coverage
        run: python3 scripts/extract-coverage.py coverage/cobertura.xml

      - name: Publish coverage to gh-pages
        env:
          PERCENT: ${{ steps.coverage.outputs.percent }}
          COLOR: ${{ steps.coverage.outputs.color }}
          PACKAGES_JSON: ${{ steps.coverage.outputs.packages_json }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/ghpages

          jq -n \
            --arg cov "$PERCENT" \
            --arg color "$COLOR" \
            --argjson pkgs "${PACKAGES_JSON:-{\}}" \
            --arg branch "$BRANCH" \
            '{coverage:$cov, coverage_color:$color, packages:$pkgs, branch:$branch}' \
            > /tmp/ghpages/badges.json

          jq -n \
            --arg pct "${PERCENT}%" \
            --arg color "$COLOR" \
            --arg branch "$BRANCH" \
            '{schemaVersion:1, label:"coverage", message:$pct, color:$color, branch:$branch}' \
            > /tmp/ghpages/coverage.json

          if [ -f coverage/html/index.html ]; then
            cp -r coverage/html/* /tmp/ghpages/
            echo "📄 HTML coverage report included"
          fi

          cd /tmp/ghpages
          git init -q
          git checkout --orphan gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ci: coverage ${PERCENT}% (${BRANCH}) [skip ci]"
          # `${SERVER_URL}` resolves to whichever forge fired the run —
          # forgejo host on forgejo, github.com on github. Token is
          # auto-injected by that same host, so auth always matches.
          git remote add origin "${SERVER_URL#https://}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${SERVER_URL#https://}/${REPO}.git"
          git push origin gh-pages --force

      - name: Cleanup NATS
        if: always()
        run: docker rm -f "${NATS_NAME:-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" || true
