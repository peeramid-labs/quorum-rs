# Configuration for typos spell checker
# https://github.com/crate-ci/typos

[files]
extend-exclude = [
    ".git",
    "target",
    "*.json",
    "*.lock",
    "*.yml",
    "*.yaml",
    "CHANGELOG.md",
]

[default]
# Accept any English dialect (US, UK, CA, AU) for variant corrections
# handled by the varcon dataset: colour/color, behaviour/behavior,
# analyse/analyze, organise/organize, etc. This is typos' default, but
# we set it explicitly so a future tightening to `en-us` is a visible
# opt-in rather than a silent config drift.
locale = "en"

[default.extend-words]
# Domain-specific terms that are not typos
ser = "ser"                   # serde serialization
ba = "ba"                     # byte array abbreviation
hom = "hom"                   # homogeneous (benchmark analytics)
groth = "groth"               # Groth16 ZK proof system (named after Jens Groth)
ratatui = "ratatui"           # Rust TUI framework (crate name, not a typo of ratatouille)
MAPE = "MAPE"                 # Mean Absolute Percentage Error (statistics)
# Programmer-style spellings that typos-dict flags as typos but are
# widely used in technical writing. These are NOT UK/US locale variants
# (so `locale = "en"` above does not cover them) — they are alternate
# spellings that preserve the root word's final `e` (parse → parseable).
unparseable = "unparseable"   # alternate of `unparsable`
parseable = "parseable"       # alternate of `parsable`
